name: Verify catalog integrity

on:
  workflow_run:
    workflows: ["Deploy to Ukraine.com.ua"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-catalog:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify extended services and price items
        shell: bash
        run: |
          set -euo pipefail

          curl -sS --fail 'https://baukostenradar.de/kosten/tueren' -o /tmp/tueren.html
          curl -sS --fail 'https://baukostenradar.de/kosten/estrich' -o /tmp/estrich.html
          curl -sS --fail 'https://baukostenradar.de/kosten/maurer' -o /tmp/maurer.html
          curl -sS --fail 'https://baukostenradar.de/kosten/treppen' -o /tmp/treppen.html
          curl -sS --fail 'https://baukostenradar.de/kosten/kueche' -o /tmp/kueche.html
          curl -sS --fail 'https://baukostenradar.de/kosten/abriss-entsorgung' -o /tmp/abriss.html

          grep -q 'https://baukostenradar.de/kosten/tueren' /tmp/tueren.html
          grep -q 'https://baukostenradar.de/kosten/estrich' /tmp/estrich.html
          grep -q 'https://baukostenradar.de/kosten/maurer' /tmp/maurer.html
          grep -q 'https://baukostenradar.de/kosten/treppen' /tmp/treppen.html
          grep -q 'https://baukostenradar.de/kosten/kueche' /tmp/kueche.html
          grep -q 'https://baukostenradar.de/kosten/abriss-entsorgung' /tmp/abriss.html

          check_item() {
            local path="$1"
            local text="$2"
            local out="$3"
            curl -sS --fail "https://baukostenradar.de${path}" -o "$out"
            grep -q "$text" "$out"
          }

          check_item '/kosten/tueren/leistung/innentuer-mit-zarge-inkl-montage' 'Innentür mit Zarge inkl. Montage' /tmp/tueren-item.html
          check_item '/kosten/estrich/leistung/zementestrich-verlegen' 'Zementestrich verlegen' /tmp/zement-item.html
          check_item '/kosten/estrich/leistung/fliessestrich-verlegen' 'Fließestrich verlegen' /tmp/fliess-item.html
          check_item '/kosten/estrich/leistung/trockenestrich-verlegen' 'Trockenestrich verlegen' /tmp/trocken-item.html
          check_item '/kosten/maurer/leistung/mauerarbeiten-fertige-wand' 'Mauerarbeiten fertige Wand' /tmp/maurer-item.html
          check_item '/kosten/treppen/leistung/holzstufe-schleifen-und-versiegeln' 'Holzstufe schleifen und versiegeln' /tmp/treppen-item.html
          check_item '/kosten/kueche/leistung/kuechen-renovierung-ohne-moebel' 'Küchen-Renovierung ohne Möbel' /tmp/kueche-item.html
          check_item '/kosten/abriss-entsorgung/leistung/einfamilienhaus-komplett-abreissen' 'Einfamilienhaus komplett abreißen' /tmp/abriss-item.html
          check_item '/kosten/abriss-entsorgung/leistung/abbruch-nach-umbautem-raum' 'Abbruch nach umbautem Raum' /tmp/abriss-volume-item.html
          check_item '/kosten/abriss-entsorgung/leistung/innenabbruch-einfamilienhaus' 'Innenabbruch Einfamilienhaus' /tmp/innenabbruch-item.html
          check_item '/kosten/abriss-entsorgung/leistung/industriehalle-abbrechen' 'Industriehalle abbrechen' /tmp/industrie-item.html
          check_item '/kosten/abriss-entsorgung/leistung/bauschuttcontainer-30-m3' 'Bauschuttcontainer 30 m³' /tmp/container-item.html

      - name: Verify catalog guide silos and quantities
        shell: bash
        run: |
          set -euo pipefail

          curl -sS --fail 'https://baukostenradar.de/ratgeber/6-innentueren-austauschen-kosten' -o /tmp/tueren-guide.html
          curl -sS --fail 'https://baukostenradar.de/ratgeber/estrich-100-qm-kosten' -o /tmp/estrich-guide.html
          curl -sS --fail 'https://baukostenradar.de/ratgeber/innenwand-mauern-kosten' -o /tmp/maurer-guide.html
          curl -sS --fail 'https://baukostenradar.de/ratgeber/14-treppenstufen-renovieren-kosten' -o /tmp/treppen-guide.html
          curl -sS --fail 'https://baukostenradar.de/ratgeber/kueche-10-qm-renovieren-kosten' -o /tmp/kueche-guide.html

          grep -q 'gewerk=tueren' /tmp/tueren-guide.html
          grep -q 'leistung=innentuer-mit-zarge-inkl-montage' /tmp/tueren-guide.html
          grep -q 'menge=6' /tmp/tueren-guide.html

          grep -q 'gewerk=estrich' /tmp/estrich-guide.html
          grep -q 'leistung=zementestrich-verlegen' /tmp/estrich-guide.html
          grep -q 'menge=100' /tmp/estrich-guide.html

          grep -q 'gewerk=maurer' /tmp/maurer-guide.html
          grep -q 'leistung=mauerarbeiten-fertige-wand' /tmp/maurer-guide.html
          grep -q 'menge=20' /tmp/maurer-guide.html

          grep -q 'gewerk=treppen' /tmp/treppen-guide.html
          grep -q 'leistung=holzstufe-schleifen-und-versiegeln' /tmp/treppen-guide.html
          grep -q 'menge=14' /tmp/treppen-guide.html

          grep -q 'gewerk=kueche' /tmp/kueche-guide.html
          grep -q 'leistung=kuechen-renovierung-ohne-moebel' /tmp/kueche-guide.html
          grep -q 'menge=10' /tmp/kueche-guide.html

      - name: Verify current door screed and demolition guides
        shell: bash
        run: |
          set -euo pipefail

          check_guide() {
            local path="$1"
            local expected_text="$2"
            local expected_service="$3"
            local expected_item="$4"
            local output="$5"
            curl -sS --fail "https://baukostenradar.de${path}" -o "$output"
            grep -q "$expected_text" "$output"
            grep -q "gewerk=${expected_service}" "$output"
            grep -q "leistung=${expected_item}" "$output"
            grep -q "https://baukostenradar.de${path}" "$output"
          }

          check_guide '/ratgeber/innentuer-einbauen-kosten' '320' 'tueren' 'innentuer-mit-zarge-inkl-montage' /tmp/current-door.html
          check_guide '/ratgeber/zementestrich-kosten-pro-qm' '30' 'estrich' 'zementestrich-verlegen' /tmp/current-zement.html
          check_guide '/ratgeber/fliessestrich-kosten-pro-qm' '40' 'estrich' 'fliessestrich-verlegen' /tmp/current-fliess.html
          check_guide '/ratgeber/trockenestrich-kosten-pro-qm' '45' 'estrich' 'trockenestrich-verlegen' /tmp/current-trocken.html
          check_guide '/ratgeber/schnellestrich-kosten-pro-qm' '60' 'estrich' 'schnellestrich' /tmp/current-schnell.html
          check_guide '/ratgeber/bodenausgleich-kosten-pro-qm' '18' 'estrich' 'bodenausgleich-5-20-mm' /tmp/current-ausgleich.html
          check_guide '/ratgeber/estrich-rissreparatur-kosten' '35' 'estrich' 'estrich-rissreparatur' /tmp/current-riss.html
          check_guide '/ratgeber/haus-abreissen-kosten' '8.500' 'abriss-entsorgung' 'einfamilienhaus-komplett-abreissen' /tmp/current-hausabriss.html
          check_guide '/ratgeber/abbruch-kosten-pro-m3' '15' 'abriss-entsorgung' 'abbruch-nach-umbautem-raum' /tmp/current-abbruch-volume.html
          check_guide '/ratgeber/innenabbruch-einfamilienhaus-kosten' '8.000' 'abriss-entsorgung' 'innenabbruch-einfamilienhaus' /tmp/current-innenabbruch.html
          check_guide '/ratgeber/industriehalle-abbrechen-kosten-pro-qm' '25' 'abriss-entsorgung' 'industriehalle-abbrechen' /tmp/current-industrie.html
          check_guide '/ratgeber/bauschuttcontainer-30-m3-kosten' '650' 'abriss-entsorgung' 'bauschuttcontainer-30-m3' /tmp/current-container.html

      - name: Verify quantity deep links resolve in calculator
        shell: bash
        run: |
          set -euo pipefail

          check_calculator() {
            local url="$1"
            local expected_value="$2"
            local expected_text="$3"
            local output="$4"
            curl -sS --fail "$url" -o "$output"
            grep -q 'https://baukostenradar.de/rechner/handwerkerkosten' "$output"
            grep -q 'Vorauswahl aus der vorherigen Kostenseite übernommen' "$output"
            grep -q "$expected_text" "$output"
            grep -Eq "value=\"${expected_value}\"|value=\"${expected_value}\.0\"" "$output"
          }

          check_calculator 'https://baukostenradar.de/rechner/handwerkerkosten?gewerk=tueren&leistung=innentuer-mit-zarge-inkl-montage&menge=6' '6' 'Innentür mit Zarge inkl. Montage' /tmp/calc-tueren.html
          check_calculator 'https://baukostenradar.de/rechner/handwerkerkosten?gewerk=estrich&leistung=zementestrich-verlegen&menge=100' '100' 'Zementestrich verlegen' /tmp/calc-zement.html
          check_calculator 'https://baukostenradar.de/rechner/handwerkerkosten?gewerk=estrich&leistung=fliessestrich-verlegen&menge=100' '100' 'Fließestrich verlegen' /tmp/calc-fliess.html
          check_calculator 'https://baukostenradar.de/rechner/handwerkerkosten?gewerk=estrich&leistung=trockenestrich-verlegen&menge=100' '100' 'Trockenestrich verlegen' /tmp/calc-trocken.html
          check_calculator 'https://baukostenradar.de/rechner/handwerkerkosten?gewerk=abriss-entsorgung&leistung=einfamilienhaus-komplett-abreissen&menge=1' '1' 'Einfamilienhaus komplett abreißen' /tmp/calc-abriss.html
          check_calculator 'https://baukostenradar.de/rechner/handwerkerkosten?gewerk=abriss-entsorgung&leistung=abbruch-nach-umbautem-raum&menge=500' '500' 'Abbruch nach umbautem Raum' /tmp/calc-abbruch-volume.html
          check_calculator 'https://baukostenradar.de/rechner/handwerkerkosten?gewerk=abriss-entsorgung&leistung=industriehalle-abbrechen&menge=1000' '1000' 'Industriehalle abbrechen' /tmp/calc-industrie.html
          check_calculator 'https://baukostenradar.de/rechner/handwerkerkosten?gewerk=abriss-entsorgung&leistung=bauschuttcontainer-30-m3&menge=1' '1' 'Bauschuttcontainer 30 m³' /tmp/calc-container.html

      - name: Verify permanent redirects for retired catalog URLs
        shell: bash
        run: |
          set -euo pipefail

          check_redirect() {
            local source="$1"
            local target="$2"
            local result
            result="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "https://baukostenradar.de${source}")"
            echo "$result" | grep -Eq '^(301|308) '
            echo "$result" | grep -q "https://baukostenradar.de${target}"
          }

          check_redirect '/kosten/tueren/leistung/innentuer-einbauen-inkl-zarge' '/kosten/tueren/leistung/innentuer-mit-zarge-inkl-montage'
          check_redirect '/kosten/estrich/leistung/zementestrich-komplett' '/kosten/estrich/leistung/zementestrich-verlegen'
          check_redirect '/kosten/estrich/leistung/calciumsulfat-anhydritestrich' '/kosten/estrich/leistung/fliessestrich-verlegen'
          check_redirect '/kosten/estrich/leistung/fliessestrich' '/kosten/estrich/leistung/fliessestrich-verlegen'
          check_redirect '/kosten/estrich/leistung/trockenestrich' '/kosten/estrich/leistung/trockenestrich-verlegen'
          check_redirect '/ratgeber/tuer-lackieren-kosten' '/ratgeber/6-innentueren-austauschen-kosten'
          check_redirect '/ratgeber/anhydritestrich-kosten-pro-qm' '/ratgeber/fliessestrich-kosten-pro-qm'
          check_redirect '/ratgeber/gussasphaltestrich-kosten-pro-qm' '/ratgeber/estrich-100-qm-kosten'
          check_redirect '/ratgeber/sichtestrich-kosten-pro-qm' '/ratgeber/estrich-100-qm-kosten'
          check_redirect '/ratgeber/estrich-zement-oder-anhydrit-kosten' '/ratgeber/estrich-100-qm-kosten'

      - name: Verify extended catalog is indexed
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail 'https://baukostenradar.de/sitemap.xml' -o /tmp/sitemap.xml

          for path in \
            '/kosten/tueren' \
            '/kosten/estrich' \
            '/kosten/maurer' \
            '/kosten/treppen' \
            '/kosten/kueche' \
            '/kosten/abriss-entsorgung' \
            '/kosten/tueren/leistung/innentuer-mit-zarge-inkl-montage' \
            '/kosten/estrich/leistung/zementestrich-verlegen' \
            '/kosten/estrich/leistung/fliessestrich-verlegen' \
            '/kosten/estrich/leistung/trockenestrich-verlegen' \
            '/kosten/estrich/leistung/schnellestrich' \
            '/kosten/estrich/leistung/bodenausgleich-5-20-mm' \
            '/kosten/estrich/leistung/estrich-rissreparatur' \
            '/kosten/maurer/leistung/mauerarbeiten-fertige-wand' \
            '/kosten/treppen/leistung/holzstufe-schleifen-und-versiegeln' \
            '/kosten/kueche/leistung/kuechen-renovierung-ohne-moebel' \
            '/kosten/abriss-entsorgung/leistung/einfamilienhaus-komplett-abreissen' \
            '/kosten/abriss-entsorgung/leistung/abbruch-nach-umbautem-raum' \
            '/kosten/abriss-entsorgung/leistung/innenabbruch-einfamilienhaus' \
            '/kosten/abriss-entsorgung/leistung/industriehalle-abbrechen' \
            '/kosten/abriss-entsorgung/leistung/bauschuttcontainer-30-m3' \
            '/ratgeber/6-innentueren-austauschen-kosten' \
            '/ratgeber/estrich-100-qm-kosten' \
            '/ratgeber/innentuer-einbauen-kosten' \
            '/ratgeber/zementestrich-kosten-pro-qm' \
            '/ratgeber/fliessestrich-kosten-pro-qm' \
            '/ratgeber/trockenestrich-kosten-pro-qm' \
            '/ratgeber/schnellestrich-kosten-pro-qm' \
            '/ratgeber/bodenausgleich-kosten-pro-qm' \
            '/ratgeber/estrich-rissreparatur-kosten' \
            '/ratgeber/haus-abreissen-kosten' \
            '/ratgeber/abbruch-kosten-pro-m3' \
            '/ratgeber/innenabbruch-einfamilienhaus-kosten' \
            '/ratgeber/industriehalle-abbrechen-kosten-pro-qm' \
            '/ratgeber/bauschuttcontainer-30-m3-kosten' \
            '/ratgeber/innenwand-mauern-kosten' \
            '/ratgeber/14-treppenstufen-renovieren-kosten' \
            '/ratgeber/kueche-10-qm-renovieren-kosten'; do
            grep -q "$path" /tmp/sitemap.xml
          done

          for retired in \
            '/kosten/tueren/leistung/innentuer-einbauen-inkl-zarge' \
            '/kosten/estrich/leistung/zementestrich-komplett' \
            '/kosten/estrich/leistung/calciumsulfat-anhydritestrich' \
            '/ratgeber/tuer-lackieren-kosten' \
            '/ratgeber/anhydritestrich-kosten-pro-qm' \
            '/ratgeber/gussasphaltestrich-kosten-pro-qm' \
            '/ratgeber/sichtestrich-kosten-pro-qm' \
            '/ratgeber/estrich-zement-oder-anhydrit-kosten' \
            '/ratgeber/bauschutt-entsorgung-kosten-pro-tonne'; do
            if grep -q "$retired" /tmp/sitemap.xml; then
              echo "Retired URL still present in sitemap: $retired" >&2
              exit 1
            fi
          done