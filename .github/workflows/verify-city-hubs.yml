name: Verify city SEO hubs

on:
  workflow_run:
    workflows: ["Deploy to Ukraine.com.ua"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-city-hubs:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify city directory and direct trade navigation
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 45 "$1" -o "$2"
          }

          cities=(berlin hamburg muenchen koeln frankfurt stuttgart duesseldorf leipzig)
          services=(badsanierung dachsanierung elektriker fenster heizung kueche)

          fetch 'https://baukostenradar.de/staedte' /tmp/cities.html

          grep -q '"@type":"CollectionPage"' /tmp/cities.html
          grep -q 'Beliebte Handwerkerkosten nach Stadt' /tmp/cities.html
          ! grep -qi 'noindex' /tmp/cities.html

          for city in "${cities[@]}"; do
            grep -q "/staedte/${city}" /tmp/cities.html
            for service in "${services[@]}"; do
              grep -q "/kosten/${service}/${city}" /tmp/cities.html
            done
          done

          python3 - /tmp/cities.html <<'PY'
          import json
          import re
          import sys

          html = open(sys.argv[1], encoding="utf-8").read()
          scripts = re.findall(r'<script[^>]*type="application/ld\+json"[^>]*>(.*?)</script>', html, flags=re.S)
          collections = []
          for script in scripts:
              try:
                  data = json.loads(script)
              except json.JSONDecodeError:
                  continue
              stack = list(data) if isinstance(data, list) else [data]
              while stack:
                  value = stack.pop()
                  if isinstance(value, dict):
                      if value.get("@type") == "CollectionPage" and value.get("url", "").endswith("/staedte"):
                          collections.append(value)
                      stack.extend(value.values())
                  elif isinstance(value, list):
                      stack.extend(value)

          if len(collections) != 1:
              raise SystemExit(f"Expected one city CollectionPage, found {len(collections)}")
          item_list = collections[0].get("mainEntity", {})
          if item_list.get("@type") != "ItemList":
              raise SystemExit("City CollectionPage mainEntity is not ItemList")
          if item_list.get("numberOfItems") != 8 or len(item_list.get("itemListElement", [])) != 8:
              raise SystemExit("City ItemList must contain exactly 8 city pages")
          print("City directory CollectionPage verified: 8 cities")
          PY

      - name: Verify all eight city hubs
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 45 "$1" -o "$2"
          }

          cities=(berlin hamburg muenchen koeln frankfurt stuttgart duesseldorf leipzig)
          guides=(
            /ratgeber/bad-komplett-sanieren-kosten
            /ratgeber/dach-sanieren-kosten-pro-qm
            /ratgeber/elektrik-erneuern-altbau
            /ratgeber/fenster-austauschen-kosten-haus
            /ratgeber/heizung-erneuern-kosten
            /ratgeber/kueche-10-qm-renovieren-kosten
          )

          checked=0
          for city in "${cities[@]}"; do
            output="/tmp/city-${city}.html"
            url="https://baukostenradar.de/staedte/${city}"
            fetch "$url" "$output"

            grep -q "https://baukostenradar.de/staedte/${city}" "$output"
            ! grep -qi 'noindex' "$output"
            grep -q 'ItemList' "$output"
            grep -q 'Preispositionen' "$output"
            grep -q "region=${city}" "$output"

            service_count=$(grep -oE "/kosten/[a-z0-9-]+/${city}" "$output" | sort -u | wc -l | tr -d ' ')
            echo "${city}: ${service_count} live Gewerke"
            test "$service_count" -ge 20

            python3 - "$output" "$service_count" <<'PY'
          import json
          import re
          import sys

          html = open(sys.argv[1], encoding="utf-8").read()
          expected = int(sys.argv[2])
          scripts = re.findall(r'<script[^>]*type="application/ld\+json"[^>]*>(.*?)</script>', html, flags=re.S)
          found = []
          for script in scripts:
              try:
                  data = json.loads(script)
              except json.JSONDecodeError:
                  continue
              stack = list(data) if isinstance(data, list) else [data]
              while stack:
                  value = stack.pop()
                  if isinstance(value, dict):
                      if value.get("@type") == "ItemList" and str(value.get("name", "")).startswith("Handwerkerpreise nach Gewerk"):
                          found.append(value)
                      stack.extend(value.values())
                  elif isinstance(value, list):
                      stack.extend(value)

          if len(found) != 1:
              raise SystemExit(f"Expected one trade ItemList, found {len(found)}")
          item_list = found[0]
          actual = item_list.get("numberOfItems")
          elements = item_list.get("itemListElement", [])
          if actual != expected or len(elements) != expected:
              raise SystemExit(f"ItemList mismatch: numberOfItems={actual}, entries={len(elements)}, expected={expected}")
          print(f"JSON-LD ItemList verified: {actual} Gewerke")
          PY

            grep -q "/kosten/kellerabdichtung/${city}" "$output"
            grep -q "/kosten/abriss-entsorgung/${city}" "$output"

            for guide in "${guides[@]}"; do
              grep -q "$guide" "$output"
            done

            checked=$((checked + 1))
          done

          test "$checked" -eq 8

      - name: Verify all city hubs are in sitemap
        shell: bash
        run: |
          set -euo pipefail

          curl -sS --fail --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 45 'https://baukostenradar.de/sitemap.xml' -o /tmp/sitemap.xml
          cities='berlin|hamburg|muenchen|koeln|frankfurt|stuttgart|duesseldorf|leipzig'
          count=$(grep -oE "https://baukostenradar.de/staedte/(${cities})</loc>" /tmp/sitemap.xml | wc -l | tr -d ' ')
          test "$count" -eq 8

      - name: Verify city calculator preselection
        shell: bash
        run: |
          set -euo pipefail

          for city in berlin hamburg muenchen koeln frankfurt stuttgart duesseldorf leipzig; do
            output="/tmp/calculator-${city}.html"
            curl -sS --fail --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 45 "https://baukostenradar.de/rechner/handwerkerkosten?region=${city}" -o "$output"
            grep -q 'Vorauswahl aus der vorherigen Kostenseite übernommen' "$output"
            grep -q "/kosten/badsanierung/${city}" "$output"
            ! grep -qi 'noindex' "$output"
          done
