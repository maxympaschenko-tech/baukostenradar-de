name: Verify Wärmepumpe pricing expansion

on:
  workflow_run:
    workflows: ["Deploy to Ukraine.com.ua"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-waermepumpe-pricing:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Wärmepumpe production pages
        shell: bash
        run: |
          set -euo pipefail
          fetch_with_retry() {
            local url="$1" output="$2"
            for i in 1 2 3 4 5; do
              if curl -sS --fail --connect-timeout 10 --max-time 25 "$url" -o "$output"; then return 0; fi
              [[ "$i" == "5" ]] && return 1
              sleep 4
            done
          }
          fetch_with_retry 'https://baukostenradar.de/kosten/waermepumpe' /tmp/main.html
          fetch_with_retry 'https://baukostenradar.de/kosten/waermepumpe/muenchen' /tmp/city.html
          fetch_with_retry 'https://baukostenradar.de/quellen' /tmp/quellen.html
          fetch_with_retry 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml

      - name: Verify source-backed Wärmepumpe data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from html.parser import HTMLParser

          class TextParser(HTMLParser):
              def __init__(self): super().__init__(); self.parts = []
              def handle_data(self, data):
                  value = data.strip()
                  if value: self.parts.append(value)

          def text(path):
              parser = TextParser()
              with open(path, encoding='utf-8') as handle: parser.feed(handle.read())
              return re.sub(r'\s+', ' ', ' '.join(parser.parts))

          main = text('/tmp/main.html')
          city = text('/tmp/city.html')
          quellen = text('/tmp/quellen.html')
          sitemap = open('/tmp/sitemap.xml', encoding='utf-8').read()

          expected_main = (
              '21 Preispositionen', '6 geprüfte Quellen',
              'Erdwärmepumpe mit Flächenkollektor komplett',
              'Erdwärmepumpe mit Erdsonde komplett',
              'Wasser-Wasser-Wärmepumpe komplett',
              'Wärmepumpe im Neubau inkl. Einbau',
              'Wärmepumpe im Altbau inkl. Einbau und Anpassungen',
              'Luft-Wasser-Wärmepumpe Gerät 10 kW',
              'Wärmepumpe installieren und hydraulisch einbinden',
              'Altheizung demontieren mit Pufferspeicher und Zubehör',
              'Elektrik für Wärmepumpe mit Zählerschrank und Anschluss',
              'Niedertemperatur-Heizkörper für Wärmepumpe nachrüsten',
              'Hydraulischer Abgleich für Wärmepumpe im Einfamilienhaus',
              'Blauarbeit - Wärmepumpe Kosten & Einbau 2026',
          )
          for needle in expected_main:
              if needle not in main: raise SystemExit(f'Missing Wärmepumpe signal: {needle}')

          for needle in (
              'Wärmepumpe Kosten in München 2026',
              'Wärmepumpe im Altbau inkl. Einbau und Anpassungen',
              'Elektrik für Wärmepumpe mit Zählerschrank und Anschluss',
              'Hydraulischer Abgleich für Wärmepumpe im Einfamilienhaus',
          ):
              if needle not in city: raise SystemExit(f'Missing München Wärmepumpe signal: {needle}')

          if 'Blauarbeit - Wärmepumpe Kosten & Einbau 2026' not in quellen:
              raise SystemExit('Missing Wärmepumpe source in central source catalog')

          for needle in (
              '/kosten/waermepumpe/leistung/waermepumpe-im-altbau-inkl-einbau-und-anpassungen',
              '/kosten/waermepumpe/leistung/elektrik-fuer-waermepumpe-mit-zaehlerschrank-und-anschluss',
              '/kosten/waermepumpe/leistung/hydraulischer-abgleich-fuer-waermepumpe-im-einfamilienhaus',
          ):
              if needle not in sitemap: raise SystemExit(f'Missing Wärmepumpe URL: {needle}')
          PY
