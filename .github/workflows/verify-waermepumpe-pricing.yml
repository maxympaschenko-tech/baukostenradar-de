name: Verify Wärmepumpe pricing expansion

on:
  workflow_run:
    workflows: ["Deploy to Ukraine.com.ua"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-waermepumpe-pricing:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Wärmepumpe production pages
        shell: bash
        run: |
          set -euo pipefail
          fetch_with_retry() {
            local url="$1" output="$2"
            for i in 1 2 3 4 5; do
              if curl -sS --fail --connect-timeout 10 --max-time 25 "$url" -o "$output"; then return 0; fi
              [[ "$i" == "5" ]] && return 1
              sleep 4
            done
          }
          fetch_with_retry 'https://baukostenradar.de/kosten/waermepumpe' /tmp/main.html
          fetch_with_retry 'https://baukostenradar.de/kosten/waermepumpe/muenchen' /tmp/city.html
          fetch_with_retry 'https://baukostenradar.de/quellen' /tmp/quellen.html
          fetch_with_retry 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml

      - name: Verify source-backed Wärmepumpe data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from html.parser import HTMLParser

          class TextParser(HTMLParser):
              def __init__(self): super().__init__(); self.parts = []
              def handle_data(self, data):
                  value = data.strip()
                  if value: self.parts.append(value)

          def text(path):
              parser = TextParser()
              with open(path, encoding='utf-8') as handle: parser.feed(handle.read())
              return re.sub(r'\s+', ' ', ' '.join(parser.parts))

          main = text('/tmp/main.html')
          city = text('/tmp/city.html')
          quellen = text('/tmp/quellen.html')
          sitemap = open('/tmp/sitemap.xml', encoding='utf-8').read()

          expected_main = (
              '13 Preispositionen', '5 geprüfte Quellen',
              'Erdwärmepumpe mit Flächenkollektor komplett',
              'Erdwärmepumpe mit Erdsonde komplett',
              'Flächenkollektor für Erdwärmepumpe erschließen',
              'Erdsonde für Erdwärmepumpe erschließen',
              'Wasser-Wasser-Wärmepumpe komplett',
              'Brunnenbohrungen für Wasser-Wasser-Wärmepumpe',
              'Brunnenbohrung für Wärmepumpe je Meter',
              'Wärmepumpenstrom laufende Kosten',
              'co2online - Wärmepumpe Kosten 2026',
              'co2online - Wasser-Wasser-Wärmepumpe Kosten 2026',
          )
          for needle in expected_main:
              if needle not in main: raise SystemExit(f'Missing Wärmepumpe signal: {needle}')

          for needle in ('Wärmepumpe Kosten in München 2026', 'Erdwärmepumpe mit Erdsonde komplett', 'Wasser-Wasser-Wärmepumpe komplett', 'Brunnenbohrungen für Wasser-Wasser-Wärmepumpe'):
              if needle not in city: raise SystemExit(f'Missing München Wärmepumpe signal: {needle}')

          for needle in ('co2online - Wärmepumpe Kosten 2026', 'co2online - Wasser-Wasser-Wärmepumpe Kosten 2026'):
              if needle not in quellen: raise SystemExit(f'Missing Wärmepumpe source: {needle}')

          for needle in ('/kosten/waermepumpe/leistung/erdwaermepumpe-mit-erdsonde-komplett', '/kosten/waermepumpe/leistung/wasser-wasser-waermepumpe-komplett', '/kosten/waermepumpe/leistung/brunnenbohrung-fuer-waermepumpe-je-meter'):
              if needle not in sitemap: raise SystemExit(f'Missing Wärmepumpe URL: {needle}')
          PY
