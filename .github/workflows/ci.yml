name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify custom consent stays analytics-only
        shell: bash
        run: |
          set -euo pipefail
          consent_file='components/consent-manager.tsx'

          grep -q 'analytics_storage' "$consent_file"
          grep -q 'baukostenradar-consent-v2' "$consent_file"
          grep -q 'baukostenradar-consent-v1' "$consent_file"

          if grep -Eq 'ad_storage|ad_user_data|ad_personalization|consent_marketing' "$consent_file"; then
            echo 'Custom consent must not grant or manage advertising consent signals before certified CMP integration.' >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.de

      - name: Verify catalog hubs in production runtime
        shell: bash
        run: |
          set -euo pipefail

          HOSTNAME=127.0.0.1 PORT=3001 NEXT_PUBLIC_SITE_URL=https://example.de node .next/standalone/server.js > /tmp/baukostenradar-ci-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -sS --fail 'http://127.0.0.1:3001/ratgeber' -o /tmp/ratgeber.html; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo 'Production runtime did not become ready.' >&2
            cat /tmp/baukostenradar-ci-server.log >&2 || true
            exit 1
          fi

          curl -sS --fail 'http://127.0.0.1:3001/quellen' -o /tmp/quellen.html

          require_contains() {
            local file="$1"
            local needle="$2"
            local label="$3"
            if ! grep -Fq "$needle" "$file"; then
              echo "MISSING: $label" >&2
              echo "Expected in $file: $needle" >&2
              exit 1
            fi
          }

          for guide in \
            '/ratgeber/balkon-sanieren-kosten-pro-qm' \
            '/ratgeber/garage-bauen-kosten' \
            '/ratgeber/carport-kosten' \
            '/ratgeber/schornstein-sanieren-kosten' \
            '/ratgeber/kamin-bauen-kosten'; do
            require_contains /tmp/ratgeber.html "$guide" "Ratgeber hub link $guide"
          done

          for source in \
            'MyHammer - Garage bauen Kosten 2026' \
            'MyHammer - Carport bauen Kosten 2026' \
            'MyHammer - Schornstein sanieren Kosten 2026' \
            'MyHammer - Kaminbau Kosten 2026'; do
            require_contains /tmp/quellen.html "$source" "active source $source"
          done
