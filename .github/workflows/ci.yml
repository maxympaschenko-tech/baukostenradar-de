name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify custom consent stays analytics-only
        shell: bash
        run: |
          set -euo pipefail
          consent_file='components/consent-manager.tsx'

          grep -q 'analytics_storage' "$consent_file"
          grep -q 'baukostenradar-consent-v2' "$consent_file"
          grep -q 'baukostenradar-consent-v1' "$consent_file"

          if grep -Eq 'ad_storage|ad_user_data|ad_personalization|consent_marketing' "$consent_file"; then
            echo 'Custom consent must not grant or manage advertising consent signals before certified CMP integration.' >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.de

      - name: Verify catalog hubs in production runtime
        shell: bash
        run: |
          set -euo pipefail

          HOSTNAME=127.0.0.1 PORT=3001 NEXT_PUBLIC_SITE_URL=https://example.de node .next/standalone/server.js > /tmp/baukostenradar-ci-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -sS --fail 'http://127.0.0.1:3001/ratgeber' -o /tmp/ratgeber.html; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo 'Production runtime did not become ready.' >&2
            cat /tmp/baukostenradar-ci-server.log >&2 || true
            exit 1
          fi

          curl -sS --fail 'http://127.0.0.1:3001/quellen' -o /tmp/quellen.html
          curl -sS --fail 'http://127.0.0.1:3001/sitemap.xml' -o /tmp/sitemap.xml

          require_contains() {
            local file="$1"
            local needle="$2"
            local label="$3"
            if ! grep -Fq "$needle" "$file"; then
              echo "MISSING: $label" >&2
              echo "Expected in $file: $needle" >&2
              exit 1
            fi
          }

          for guide in \
            '/ratgeber/balkon-sanieren-kosten-pro-qm' \
            '/ratgeber/garage-bauen-kosten' \
            '/ratgeber/carport-kosten' \
            '/ratgeber/schornstein-sanieren-kosten' \
            '/ratgeber/kamin-bauen-kosten' \
            '/ratgeber/zaun-bauen-kosten-pro-meter' \
            '/ratgeber/pool-bauen-kosten' \
            '/ratgeber/terrasse-bauen-kosten'; do
            require_contains /tmp/ratgeber.html "$guide" "Ratgeber hub link $guide"
          done

          for source in \
            'MyHammer - Garage bauen Kosten 2026' \
            'MyHammer - Carport bauen Kosten 2026' \
            'MyHammer - Schornstein sanieren Kosten 2026' \
            'MyHammer - Kaminbau Kosten 2026' \
            'MyHammer - Zaunbau Kosten 2026' \
            'MyHammer - Pool bauen Kosten 2026' \
            'Aroundhome - Pool bauen lassen Kosten 2026' \
            'MyHammer - Terrassenbau Kosten 2026' \
            'Aroundhome - Terrasse Kosten 2026' \
            'Blauarbeit - Holzterrasse Kosten 2026' \
            'Blauarbeit - WPC-Terrasse Kosten 2026' \
            'MyHammer - Erhöhte Terrasse Kosten 2026' \
            'MyHammer - Dachterrasse Kosten 2026'; do
            require_contains /tmp/quellen.html "$source" "active source $source"
          done

          require_contains /tmp/sitemap.xml 'https://example.de/kosten/zaunbau</loc>' 'Zaunbau sitemap service'
          require_contains /tmp/sitemap.xml 'https://example.de/ratgeber/zaun-bauen-kosten-pro-meter</loc>' 'Zaunbau sitemap guide'
          require_contains /tmp/sitemap.xml 'https://example.de/kosten/poolbau</loc>' 'Poolbau sitemap service'
          require_contains /tmp/sitemap.xml 'https://example.de/ratgeber/pool-bauen-kosten</loc>' 'Poolbau sitemap guide'
          require_contains /tmp/sitemap.xml 'https://example.de/kosten/terrassenbau</loc>' 'Terrassenbau sitemap service'
          require_contains /tmp/sitemap.xml 'https://example.de/ratgeber/terrasse-bauen-kosten</loc>' 'Terrassenbau sitemap guide'

          check_fence_item() {
            local item="$1"
            local guide="$2"
            local output="/tmp/ci-zaunbau-${item}.html"
            local local_url="http://127.0.0.1:3001/kosten/zaunbau/leistung/${item}"
            local canonical="https://example.de/kosten/zaunbau/leistung/${item}"
            curl -sS --fail "$local_url" -o "$output"
            require_contains /tmp/sitemap.xml "${canonical}</loc>" "Zaunbau sitemap item $item"
            require_contains "$output" 'Passender Ratgeber' "Zaunbau guide CTA $item"
            require_contains "$output" "/ratgeber/${guide}" "Zaunbau guide mapping $item"
          }

          check_fence_item 'zaun-bauen-lassen-standardspanne' 'zaun-bauen-kosten-pro-meter'
          check_fence_item 'maschendrahtzaun-material' 'maschendrahtzaun-kosten-pro-meter'
          check_fence_item 'holzzaun-material' 'holzzaun-kosten-pro-meter'
          check_fence_item 'sichtschutzzaun-holz-komplett' 'sichtschutzzaun-kosten-pro-meter'
          check_fence_item 'kunststoffzaun-material' 'sichtschutzzaun-kosten-pro-meter'
          check_fence_item 'sichtschutzzaun-kunststoff-komplett' 'sichtschutzzaun-kosten-pro-meter'
          check_fence_item 'metallzaun-oder-doppelstabmatten-material' 'doppelstabmattenzaun-kosten-pro-meter'
          check_fence_item 'schmiedeeisen-zaun-material' 'zaun-bauen-kosten-pro-meter'
          check_fence_item 'zaunmontage-einfach-holz-kunststoff-oder-matten' 'zaun-bauen-kosten-pro-meter'
          check_fence_item 'maschendrahtzaun-montieren' 'maschendrahtzaun-kosten-pro-meter'
          check_fence_item 'sichtschutzzaun-montieren' 'sichtschutzzaun-kosten-pro-meter'
          check_fence_item 'maschendrahtzaun-20-meter-beispiel' 'maschendrahtzaun-kosten-pro-meter'
          check_fence_item 'holzzaun-20-meter-beispiel' 'holzzaun-kosten-pro-meter'
          check_fence_item 'metallzaun-20-meter-beispiel' 'doppelstabmattenzaun-kosten-pro-meter'
          check_fence_item 'sichtschutzzaun-holz-20-meter-beispiel' 'sichtschutzzaun-kosten-pro-meter'
          check_fence_item 'sichtschutzzaun-kunststoff-20-meter-beispiel' 'sichtschutzzaun-kosten-pro-meter'

          check_pool_item() {
            local item="$1"
            local guide="$2"
            local output="/tmp/ci-poolbau-${item}.html"
            local local_url="http://127.0.0.1:3001/kosten/poolbau/leistung/${item}"
            local canonical="https://example.de/kosten/poolbau/leistung/${item}"
            curl -sS --fail "$local_url" -o "$output"
            require_contains /tmp/sitemap.xml "${canonical}</loc>" "Poolbau sitemap item $item"
            require_contains "$output" 'Passender Ratgeber' "Poolbau guide CTA $item"
            require_contains "$output" "/ratgeber/${guide}" "Poolbau guide mapping $item"
          }

          check_pool_item 'pool-bauen-lassen-gesamtprojekt' 'pool-bauen-kosten'
          check_pool_item 'materialkosten-poolbau' 'pool-bauen-kosten'
          check_pool_item 'arbeitskosten-poolbauer' 'pool-bauen-kosten'
          check_pool_item 'erdarbeiten-mit-abtransport' 'pool-erdarbeiten-kosten'
          check_pool_item 'stahlwandpool-freistehend' 'pool-bauen-kosten'
          check_pool_item 'stahlwandpool-teilversenkt' 'pool-bauen-kosten'
          check_pool_item 'gfk-fertigbecken-poolart' 'gfk-pool-kosten'
          check_pool_item 'gfk-pool-4-x-3-m-komplett' 'gfk-pool-kosten'
          check_pool_item 'gfk-pool-6-x-3-m-komplett' 'gfk-pool-kosten'
          check_pool_item 'gfk-pool-8-x-4-m-komplett' 'gfk-pool-kosten'
          check_pool_item 'styroporpool-durch-fachfirma' 'pool-bauen-kosten'
          check_pool_item 'betonpool-4-x-3-m-komplett' 'betonpool-kosten'
          check_pool_item 'betonpool-6-x-3-m-komplett' 'betonpool-kosten'
          check_pool_item 'betonpool-8-x-4-m-komplett' 'betonpool-kosten'
          check_pool_item 'edelstahlpool-6-x-3-m' 'pool-bauen-kosten'
          check_pool_item 'naturpool-oder-schwimmteich' 'pool-bauen-kosten'
          check_pool_item 'filteranlage' 'pooltechnik-kosten'
          check_pool_item 'poolpumpe' 'pooltechnik-kosten'
          check_pool_item 'verrohrung-skimmer-und-duesen' 'pooltechnik-kosten'
          check_pool_item 'poolbetrieb-jaehrlich' 'pool-betriebskosten'
          check_pool_item 'poolbetrieb-beheizt-intensiv-jaehrlich' 'pool-betriebskosten'

          check_terrace_item() {
            local item="$1"
            local guide="$2"
            local output="/tmp/ci-terrassenbau-${item}.html"
            local local_url="http://127.0.0.1:3001/kosten/terrassenbau/leistung/${item}"
            local canonical="https://example.de/kosten/terrassenbau/leistung/${item}"
            curl -sS --fail "$local_url" -o "$output"
            require_contains /tmp/sitemap.xml "${canonical}</loc>" "Terrassenbau sitemap item $item"
            require_contains "$output" 'Passender Ratgeber' "Terrassenbau guide CTA $item"
            require_contains "$output" "/ratgeber/${guide}" "Terrassenbau guide mapping $item"
          }

          check_terrace_item 'terrasse-bauen-lassen-gesamtprojekt' 'terrasse-bauen-kosten'
          check_terrace_item 'terrasse-20-quadratmeter-komplett' 'terrasse-bauen-kosten'
          check_terrace_item 'planung-terrassenbau' 'terrasse-bauen-kosten'
          check_terrace_item 'fundament-inkl-bodenaushub' 'terrasse-unterbau-kosten'
          check_terrace_item 'montage-terrassenbau' 'terrasse-bauen-kosten'
          check_terrace_item 'terrassenbauer-stundensatz' 'terrasse-bauen-kosten'
          check_terrace_item 'holzterrasse-komplett' 'holzterrasse-kosten'
          check_terrace_item 'holzterrasse-laerche-oder-douglasie-komplett' 'holzterrasse-kosten'
          check_terrace_item 'holzdielen-material' 'holzterrasse-kosten'
          check_terrace_item 'holzterrasse-unterkonstruktion' 'terrasse-unterbau-kosten'
          check_terrace_item 'wpc-terrasse-komplett' 'wpc-terrasse-kosten'
          check_terrace_item 'wpc-terrasse-20-quadratmeter-komplett' 'wpc-terrasse-kosten'
          check_terrace_item 'wpc-hohlkammerdiele-material' 'wpc-terrasse-kosten'
          check_terrace_item 'wpc-vollprofil-material' 'wpc-terrasse-kosten'
          check_terrace_item 'wpc-coextrudiert-material' 'wpc-terrasse-kosten'
          check_terrace_item 'steinterrasse-fundament-und-pflasterarbeiten' 'terrasse-pflastern-kosten'
          check_terrace_item 'natursteinterrasse-20-quadratmeter-komplett' 'terrasse-pflastern-kosten'
          check_terrace_item 'erhoehte-terrasse-fachbetrieb' 'terrasse-bauen-kosten'
          check_terrace_item 'dachterrasse-gesamtprojekt' 'dachterrasse-kosten'
          check_terrace_item 'dachterrasse-kosten-pro-quadratmeter' 'dachterrasse-kosten'
