name: Verify production fetch throttle

on:
  pull_request:
    paths:
      - 'scripts/hostinger-verify.sh'
      - '.github/workflows/verify-production-fetch-throttle.yml'
  workflow_dispatch:

jobs:
  verify-throttle-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify retry backoff contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'attempts="${3:-6}"' scripts/hostinger-verify.sh
          grep -q 'sleep $((3 + attempt \* 2))' scripts/hostinger-verify.sh
