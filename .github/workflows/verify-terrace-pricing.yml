name: Verify Terrassenbau pricing cluster

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-terrace-cluster:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure resilient live fetches
        shell: bash
        run: |
          cat > ~/.curlrc <<'EOF'
          retry = 6
          retry-all-errors
          retry-delay = 5
          connect-timeout = 10
          max-time = 30
          EOF

      - name: Fetch Terrassenbau production pages
        shell: bash
        run: |
          set -euo pipefail
          fetch_until_contains() {
            local base_url="$1" output="$2" needle="$3" label="$4"
            for attempt in 1 2 3 4 5 6; do
              if curl -sSL --fail -H 'Cache-Control: no-cache' \
                "${base_url}?verify=${GITHUB_SHA}-${attempt}" -o "$output"; then
                if grep -Fq "$needle" "$output"; then
                  return 0
                fi
              fi
              if [ "$attempt" -eq 6 ]; then
                echo "MISSING after retries: $label" >&2
                echo "Expected in $output: $needle" >&2
                return 1
              fi
              sleep 10
            done
          }

          curl -sSL --fail 'https://baukostenradar.de/kosten/terrassenbau' -o /tmp/terrassenbau.html
          curl -sSL --fail 'https://baukostenradar.de/kosten/terrassenbau/berlin' -o /tmp/terrassenbau-berlin.html
          fetch_until_contains \
            'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html \
            '/ratgeber/terrasse-bauen-kosten' 'Terrassenbau guide directory'
          fetch_until_contains \
            'https://baukostenradar.de/quellen' /tmp/quellen.html \
            'MyHammer - Terrassenbau Kosten 2026' 'Terrassenbau source directory'
          curl -sSL --fail 'https://baukostenradar.de/sitemap.xml' -o /tmp/sitemap.xml

      - name: Verify category, city and source signals
        shell: bash
        run: |
          set -euo pipefail
          require_contains() {
            local file="$1"; local needle="$2"; local label="$3"
            if ! grep -Fq "$needle" "$file"; then
              echo "MISSING: $label" >&2
              echo "Expected in $file: $needle" >&2
              exit 1
            fi
          }

          for needle in \
            'Terrasse bauen lassen Gesamtprojekt' \
            'Fundament inkl. Bodenaushub' \
            'Holzterrasse komplett' \
            'WPC Terrasse komplett' \
            'Steinterrasse Fundament und Pflasterarbeiten' \
            'Erhöhte Terrasse Fachbetrieb' \
            'Dachterrasse Gesamtprojekt'; do
            require_contains /tmp/terrassenbau.html "$needle" "Terrassenbau item: $needle"
          done

          require_contains /tmp/terrassenbau-berlin.html 'Terrassenbau' 'Terrassenbau Berlin city page'
          require_contains /tmp/quellen.html 'MyHammer - Terrassenbau Kosten 2026' 'MyHammer Terrassenbau source'
          require_contains /tmp/quellen.html 'Aroundhome - Terrasse Kosten 2026' 'Aroundhome Terrasse source'
          require_contains /tmp/quellen.html 'Blauarbeit - Holzterrasse Kosten 2026' 'Blauarbeit Holzterrasse source'
          require_contains /tmp/quellen.html 'Blauarbeit - WPC-Terrasse Kosten 2026' 'Blauarbeit WPC source'
          require_contains /tmp/quellen.html 'MyHammer - Erhöhte Terrasse Kosten 2026' 'MyHammer erhöhte Terrasse source'
          require_contains /tmp/quellen.html 'MyHammer - Dachterrasse Kosten 2026' 'MyHammer Dachterrasse source'
          ! grep -qi 'noindex' /tmp/terrassenbau.html

      - name: Verify five Terrassenbau guides
        shell: bash
        run: |
          set -euo pipefail
          require_contains() {
            local file="$1"; local needle="$2"; local label="$3"
            if ! grep -Fq "$needle" "$file"; then
              echo "MISSING: $label" >&2
              echo "Expected in $file: $needle" >&2
              exit 1
            fi
          }
          check_guide() {
            local slug="$1"; local item="$2"
            local url="https://baukostenradar.de/ratgeber/${slug}"
            local output="/tmp/${slug}.html"
            require_contains /tmp/sitemap.xml "${url}</loc>" "guide sitemap $slug"
            require_contains /tmp/ratgeber.html "/ratgeber/${slug}" "guide directory $slug"
            curl -sSL --fail "$url" -o "$output"
            require_contains "$output" "$url" "canonical $slug"
            require_contains "$output" '"@type":"Article"' "Article schema $slug"
            require_contains "$output" 'FAQPage' "FAQ schema $slug"
            require_contains "$output" '/kosten/terrassenbau' "Terrassenbau service link $slug"
            require_contains "$output" 'gewerk=terrassenbau' "calculator service $slug"
            require_contains "$output" "leistung=${item}" "calculator item $slug"
            ! grep -qi 'noindex' "$output"
          }

          check_guide 'terrasse-bauen-kosten' 'terrasse-bauen-lassen-gesamtprojekt'
          check_guide 'holzterrasse-kosten' 'holzterrasse-komplett'
          check_guide 'wpc-terrasse-kosten' 'wpc-terrasse-komplett'
          check_guide 'terrasse-unterbau-kosten' 'fundament-inkl-bodenaushub'
          check_guide 'dachterrasse-kosten' 'dachterrasse-gesamtprojekt'

      - name: Verify all price-detail mappings and sitemap expansion
        shell: bash
        run: |
          set -euo pipefail
          check_item() {
            local item="$1"; local guide="$2"
            local url="https://baukostenradar.de/kosten/terrassenbau/leistung/${item}"
            local output="/tmp/terrassenbau-${item}.html"
            grep -Fq "${url}</loc>" /tmp/sitemap.xml || { echo "Missing sitemap URL: $item" >&2; exit 1; }
            curl -sSL --fail "$url" -o "$output"
            grep -Fq 'Passender Ratgeber' "$output" || { echo "Missing guide CTA: $item" >&2; exit 1; }
            grep -Fq "/ratgeber/${guide}" "$output" || { echo "Wrong guide mapping: $item -> $guide" >&2; exit 1; }
            ! grep -qi 'noindex' "$output"
          }

          grep -Fq 'https://baukostenradar.de/kosten/terrassenbau</loc>' /tmp/sitemap.xml
          grep -Fq 'https://baukostenradar.de/kosten/terrassenbau/berlin</loc>' /tmp/sitemap.xml

          check_item 'terrasse-bauen-lassen-gesamtprojekt' 'terrasse-bauen-kosten'
          check_item 'terrasse-20-quadratmeter-komplett' 'terrasse-bauen-kosten'
          check_item 'planung-terrassenbau' 'terrasse-bauen-kosten'
          check_item 'fundament-inkl-bodenaushub' 'terrasse-unterbau-kosten'
          check_item 'montage-terrassenbau' 'terrasse-bauen-kosten'
          check_item 'terrassenbauer-stundensatz' 'terrasse-bauen-kosten'
          check_item 'holzterrasse-komplett' 'holzterrasse-kosten'
          check_item 'holzterrasse-laerche-oder-douglasie-komplett' 'holzterrasse-kosten'
          check_item 'holzdielen-material' 'holzterrasse-kosten'
          check_item 'holzterrasse-unterkonstruktion' 'terrasse-unterbau-kosten'
          check_item 'wpc-terrasse-komplett' 'wpc-terrasse-kosten'
          check_item 'wpc-terrasse-20-quadratmeter-komplett' 'wpc-terrasse-kosten'
          check_item 'wpc-hohlkammerdiele-material' 'wpc-terrasse-kosten'
          check_item 'wpc-vollprofil-material' 'wpc-terrasse-kosten'
          check_item 'wpc-coextrudiert-material' 'wpc-terrasse-kosten'
          check_item 'steinterrasse-fundament-und-pflasterarbeiten' 'terrasse-pflastern-kosten'
          check_item 'natursteinterrasse-20-quadratmeter-komplett' 'terrasse-pflastern-kosten'
          check_item 'erhoehte-terrasse-fachbetrieb' 'terrasse-bauen-kosten'
          check_item 'dachterrasse-gesamtprojekt' 'dachterrasse-kosten'
          check_item 'dachterrasse-kosten-pro-quadratmeter' 'dachterrasse-kosten'
