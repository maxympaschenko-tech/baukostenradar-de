name: Verify production

on:
  workflow_run:
    workflows: ["Deploy to Ukraine.com.ua"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: uageek.ftp.tools
      REMOTE_USER: uageek
      REMOTE_PATH: /home/uageek/baukostenradar.de/www
    steps:
      - name: Configure SSH
        shell: bash
        env:
          REMOTE_KEY: ${{ secrets.REMOTE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$REMOTE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 -H "$REMOTE_HOST" >> ~/.ssh/known_hosts

      - name: Verify remote deployment files
        shell: bash
        run: |
          set -euo pipefail
          ssh -p 22 "$REMOTE_USER@$REMOTE_HOST" "
            test -f '$REMOTE_PATH/server.js';
            test -f '$REMOTE_PATH/package.json';
            test -d '$REMOTE_PATH/.next';
          "

      - name: Verify deployed commit is expected or newer
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -sS --fail 'https://baukostenradar.de/api/version' -o /tmp/version.json
          deployed_sha=$(jq -r '.sha // empty' /tmp/version.json)
          echo "Expected SHA: $EXPECTED_SHA"
          echo "Deployed SHA: $deployed_sha"

          if [[ "$deployed_sha" == "$EXPECTED_SHA" ]]; then
            echo "Production is running the expected commit."
            exit 0
          fi

          compare=$(curl -sS --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/compare/$EXPECTED_SHA...$deployed_sha")
          compare_status=$(printf '%s' "$compare" | jq -r '.status // empty')
          echo "GitHub compare status: $compare_status"

          if [[ "$compare_status" == "ahead" ]]; then
            echo "Production has already advanced to a newer descendant commit."
            exit 0
          fi

          echo "Production is neither the expected commit nor a newer descendant." >&2
          exit 1

      - name: Verify version endpoint
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail 'https://baukostenradar.de/api/version' -o /tmp/version.json
          jq -e '.service == "BauKostenRadar" and (.sha | length > 7) and .sha != "development"' /tmp/version.json >/dev/null

      - name: Verify canonical production site
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/home.html -w '%{http_code}' --connect-timeout 10 --max-time 20 'https://baukostenradar.de/' || true)
            echo "Attempt $i: HTTP $code"
            if [[ "$code" == "200" ]] && grep -qi 'BauKostenRadar' /tmp/home.html; then
              success=1
              break
            fi
            sleep 5
          done
          test "$success" = "1"
          grep -q 'GTM-WCPZ9WFT' /tmp/home.html
          grep -q 'vXOTcob1kFIZony7RPFaEkolb_RX3iMjOJkWlS-LH38' /tmp/home.html

      - name: Verify favicon
        shell: bash
        run: |
          set -euo pipefail
          grep -qi 'rel="icon"' /tmp/home.html
          grep -qi 'icon.svg' /tmp/home.html
          code=$(curl -sS -o /tmp/icon.svg -w '%{http_code}' --connect-timeout 10 --max-time 20 'https://baukostenradar.de/icon.svg')
          echo "Favicon HTTP: $code"
          test "$code" = "200"
          grep -q '<svg' /tmp/icon.svg

      - name: Verify retired lead routes stay removed
        shell: bash
        run: |
          set -euo pipefail
          api_code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 'https://baukostenradar.de/api/project-request')
          page_code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 'https://baukostenradar.de/angebot')
          echo "Retired API HTTP: $api_code"
          echo "Retired page HTTP: $page_code"
          test "$api_code" = "404"
          test "$page_code" = "404"

      - name: Verify www redirects to apex
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 'https://www.baukostenradar.de/')
          location=$(curl -sSI --connect-timeout 10 --max-time 20 'https://www.baukostenradar.de/' | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}' | tail -1)
          echo "www HTTP: $code"
          echo "Location: $location"
          [[ "$code" == "308" || "$code" == "301" ]]
          [[ "$location" == "https://baukostenradar.de" || "$location" == "https://baukostenradar.de/" ]]

      - name: Verify legal pages are noindex
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail 'https://baukostenradar.de/impressum' -o /tmp/impressum.html
          curl -sS --fail 'https://baukostenradar.de/datenschutz' -o /tmp/datenschutz.html
          grep -qi 'noindex' /tmp/impressum.html
          grep -qi 'noindex' /tmp/datenschutz.html

      - name: Verify robots blocks API routes
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail 'https://baukostenradar.de/robots.txt' -o /tmp/robots.txt
          grep -q 'Disallow: /api/' /tmp/robots.txt

      - name: Verify sitemap excludes non-indexable pages
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail 'https://baukostenradar.de/sitemap.xml' -o /tmp/sitemap.xml
          for path in '/impressum' '/datenschutz' '/angebot'; do
            if grep -q "$path" /tmp/sitemap.xml; then
              echo "$path must not be present in sitemap.xml" >&2
              exit 1
            fi
          done

      - name: Verify representative SEO templates
        shell: bash
        run: |
          set -euo pipefail

          curl -sS --fail 'https://baukostenradar.de/kosten/maler' -o /tmp/service.html
          curl -sS --fail 'https://baukostenradar.de/staedte/berlin' -o /tmp/city.html
          curl -sS --fail 'https://baukostenradar.de/kosten/maler/berlin' -o /tmp/local.html
          curl -sS --fail 'https://baukostenradar.de/ratgeber/sanierungskosten-pro-qm' -o /tmp/guide.html

          grep -q 'https://baukostenradar.de/kosten/maler' /tmp/service.html
          grep -q 'https://baukostenradar.de/staedte/berlin' /tmp/city.html
          grep -q 'https://baukostenradar.de/kosten/maler/berlin' /tmp/local.html
          grep -q 'https://baukostenradar.de/ratgeber/sanierungskosten-pro-qm' /tmp/guide.html

          for page in /tmp/service.html /tmp/city.html /tmp/local.html /tmp/guide.html; do
            if grep -qi 'noindex' "$page"; then
              echo "Unexpected noindex in $page" >&2
              exit 1
            fi
          done

          grep -q 'BreadcrumbList' /tmp/city.html
          grep -q 'BreadcrumbList' /tmp/local.html

          for path in \
            '/kosten/maler' \
            '/staedte/berlin' \
            '/kosten/maler/berlin' \
            '/ratgeber/sanierungskosten-pro-qm'; do
            grep -q "$path" /tmp/sitemap.xml
          done
