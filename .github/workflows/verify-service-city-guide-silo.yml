name: Verify service city guide silo

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-service-city-guide-silo:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Discover current service and city matrix from sitemap
        shell: bash
        run: |
          set -euo pipefail
          source scripts/hostinger-verify.sh

          fetch_hostinger 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml

          python3 - <<'PY'
          import re
          from pathlib import Path

          sitemap = Path('/tmp/sitemap.xml').read_text(encoding='utf-8')
          cities = ('berlin', 'hamburg', 'muenchen', 'koeln', 'frankfurt', 'stuttgart', 'duesseldorf', 'leipzig')
          pattern = re.compile(r'https://baukostenradar\.de/kosten/([a-z0-9-]+)/(' + '|'.join(cities) + r')</loc>')
          pairs = set(pattern.findall(sitemap))
          services = sorted({service for service, city in pairs if city == 'berlin'})

          if len(services) < 22:
              raise SystemExit(f'Service catalog regressed: {len(services)} current services, expected at least 22')

          missing = [f'{service}/{city}' for service in services for city in cities if (service, city) not in pairs]
          if missing:
              raise SystemExit('Missing service-city sitemap URLs: ' + ', '.join(missing[:20]))

          expected = len(services) * len(cities)
          relevant_pairs = {(service, city) for service, city in pairs if service in services}
          if len(relevant_pairs) != expected:
              raise SystemExit(f'Service-city sitemap matrix mismatch: {len(relevant_pairs)} != {expected}')

          Path('/tmp/services.txt').write_text('\n'.join(services) + '\n', encoding='utf-8')
          print(f'Discovered {len(services)} services and {expected} service-city sitemap URLs')
          PY

      - name: Verify primary guide on every current trade page
        shell: bash
        run: |
          set -euo pipefail
          source scripts/hostinger-verify.sh

          checked=0
          while IFS= read -r service; do
            [ -n "$service" ] || continue
            output="/tmp/trade-${service}.html"
            url="https://baukostenradar.de/kosten/${service}"
            fetch_hostinger "$url" "$output"

            grep -q "$url" "$output" || { echo "Canonical/service URL missing: ${service}"; exit 1; }
            grep -q 'Passender Ratgeber' "$output" || { echo "Primary guide block missing: ${service}"; exit 1; }
            grep -Eq '/ratgeber/[a-z0-9-]+' "$output" || { echo "Primary guide link missing: ${service}"; exit 1; }
            ! grep -qi 'noindex' "$output" || { echo "Unexpected noindex: ${service}"; exit 1; }
            checked=$((checked + 1))
          done < /tmp/services.txt

          service_count=$(wc -l < /tmp/services.txt | tr -d ' ')
          test "$checked" -eq "$service_count"
          echo "Verified primary guide signal on ${checked} current trade pages"

      - name: Verify representative local page for every service
        shell: bash
        run: |
          set -euo pipefail
          source scripts/hostinger-verify.sh

          cities=(berlin hamburg muenchen koeln frankfurt stuttgart duesseldorf leipzig)
          checked=0
          index=0
          while IFS= read -r service; do
            [ -n "$service" ] || continue
            city="${cities[$((index % ${#cities[@]}))]}"
            output="/tmp/local-${service}-${city}.html"
            url="https://baukostenradar.de/kosten/${service}/${city}"
            fetch_hostinger "$url" "$output"

            grep -q "$url" "$output" || { echo "Local canonical URL missing: ${service}/${city}"; exit 1; }
            grep -q 'Passender Ratgeber' "$output" || { echo "Local guide block missing: ${service}/${city}"; exit 1; }
            grep -Eq '/ratgeber/[a-z0-9-]+' "$output" || { echo "Local guide link missing: ${service}/${city}"; exit 1; }
            grep -q 'Regionalfaktor' "$output" || { echo "Regional factor missing: ${service}/${city}"; exit 1; }
            ! grep -qi 'noindex' "$output" || { echo "Unexpected local noindex: ${service}/${city}"; exit 1; }

            checked=$((checked + 1))
            index=$((index + 1))
          done < /tmp/services.txt

          service_count=$(wc -l < /tmp/services.txt | tr -d ' ')
          test "$checked" -eq "$service_count"
          echo "Verified ${checked} representative local pages across all 8 cities"

      - name: Verify all current local trade pages are in sitemap
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          from pathlib import Path

          sitemap = Path('/tmp/sitemap.xml').read_text(encoding='utf-8')
          services = [line.strip() for line in Path('/tmp/services.txt').read_text(encoding='utf-8').splitlines() if line.strip()]
          cities = ('berlin', 'hamburg', 'muenchen', 'koeln', 'frankfurt', 'stuttgart', 'duesseldorf', 'leipzig')

          for service in services:
              for city in cities:
                  url = f'https://baukostenradar.de/kosten/{service}/{city}</loc>'
                  if url not in sitemap:
                      raise SystemExit(f'Missing local trade sitemap URL: {service}/{city}')

          print(f'Verified {len(services) * len(cities)} current local trade sitemap URLs')
          PY
