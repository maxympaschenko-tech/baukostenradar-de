name: Verify service city guide silo

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-service-city-guide-silo:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify primary guide on all trade pages
        shell: bash
        run: |
          set -euo pipefail

          declare -A guides=(
            [badsanierung]='/ratgeber/bad-komplett-sanieren-kosten'
            [maler]='/ratgeber/maler-kosten-pro-qm'
            [fliesenleger]='/ratgeber/fliesenleger-kosten-pro-qm'
            [elektriker]='/ratgeber/elektrik-erneuern-altbau'
            [dachsanierung]='/ratgeber/dach-sanieren-kosten-pro-qm'
            [bodenleger]='/ratgeber/bodenleger-kosten-pro-qm'
            [trockenbau]='/ratgeber/trockenbau-kosten-pro-qm'
            [sanitaer]='/ratgeber/sanitaer-kosten'
            [waermepumpe]='/ratgeber/waermepumpe-kosten-2026'
            [photovoltaik]='/ratgeber/photovoltaik-kosten-2026'
            [daemmung]='/ratgeber/daemmung-kosten-pro-qm'
            [kellerabdichtung]='/ratgeber/kellerabdichtung-aussen-oder-innen-kosten'
            [fenster]='/ratgeber/fenster-austauschen-kosten-haus'
            [heizung]='/ratgeber/heizung-erneuern-kosten'
            [fassade]='/ratgeber/fassade-sanieren-kosten'
            [garten]='/ratgeber/garten-anlegen-kosten'
            [tueren]='/ratgeber/6-innentueren-austauschen-kosten'
            [estrich]='/ratgeber/estrich-100-qm-kosten'
            [abriss-entsorgung]='/ratgeber/haus-abreissen-kosten'
            [maurer]='/ratgeber/innenwand-mauern-kosten'
            [treppen]='/ratgeber/14-treppenstufen-renovieren-kosten'
            [kueche]='/ratgeber/kueche-10-qm-renovieren-kosten'
          )

          test "${#guides[@]}" -eq 22

          for service in "${!guides[@]}"; do
            output="/tmp/trade-${service}.html"
            curl -sS --fail "https://baukostenradar.de/kosten/${service}" -o "$output"
            grep -q "https://baukostenradar.de/kosten/${service}" "$output"
            grep -q "${guides[$service]}" "$output"
            ! grep -qi 'noindex' "$output"
          done

      - name: Verify all 176 local trade pages
        shell: bash
        run: |
          set -euo pipefail

          services=(
            badsanierung maler fliesenleger elektriker dachsanierung
            bodenleger trockenbau sanitaer waermepumpe photovoltaik
            daemmung kellerabdichtung fenster heizung fassade garten
            tueren estrich abriss-entsorgung maurer treppen kueche
          )
          cities=(berlin hamburg muenchen koeln frankfurt stuttgart duesseldorf leipzig)

          declare -A guides=(
            [badsanierung]='/ratgeber/bad-komplett-sanieren-kosten'
            [maler]='/ratgeber/maler-kosten-pro-qm'
            [fliesenleger]='/ratgeber/fliesenleger-kosten-pro-qm'
            [elektriker]='/ratgeber/elektrik-erneuern-altbau'
            [dachsanierung]='/ratgeber/dach-sanieren-kosten-pro-qm'
            [bodenleger]='/ratgeber/bodenleger-kosten-pro-qm'
            [trockenbau]='/ratgeber/trockenbau-kosten-pro-qm'
            [sanitaer]='/ratgeber/sanitaer-kosten'
            [waermepumpe]='/ratgeber/waermepumpe-kosten-2026'
            [photovoltaik]='/ratgeber/photovoltaik-kosten-2026'
            [daemmung]='/ratgeber/daemmung-kosten-pro-qm'
            [kellerabdichtung]='/ratgeber/kellerabdichtung-aussen-oder-innen-kosten'
            [fenster]='/ratgeber/fenster-austauschen-kosten-haus'
            [heizung]='/ratgeber/heizung-erneuern-kosten'
            [fassade]='/ratgeber/fassade-sanieren-kosten'
            [garten]='/ratgeber/garten-anlegen-kosten'
            [tueren]='/ratgeber/6-innentueren-austauschen-kosten'
            [estrich]='/ratgeber/estrich-100-qm-kosten'
            [abriss-entsorgung]='/ratgeber/haus-abreissen-kosten'
            [maurer]='/ratgeber/innenwand-mauern-kosten'
            [treppen]='/ratgeber/14-treppenstufen-renovieren-kosten'
            [kueche]='/ratgeber/kueche-10-qm-renovieren-kosten'
          )

          checked=0
          for service in "${services[@]}"; do
            for city in "${cities[@]}"; do
              output="/tmp/local-${service}-${city}.html"
              url="https://baukostenradar.de/kosten/${service}/${city}"
              curl -sS --fail "$url" -o "$output"
              grep -q "$url" "$output"
              grep -q "${guides[$service]}" "$output"
              grep -q 'Passender Ratgeber' "$output"
              grep -q 'Regionalfaktor' "$output"
              ! grep -qi 'noindex' "$output"
              checked=$((checked + 1))
            done
          done

          test "$checked" -eq 176

      - name: Verify all local trade pages are in sitemap
        shell: bash
        run: |
          set -euo pipefail

          curl -sS --fail 'https://baukostenradar.de/sitemap.xml' -o /tmp/sitemap.xml

          services='badsanierung|maler|fliesenleger|elektriker|dachsanierung|bodenleger|trockenbau|sanitaer|waermepumpe|photovoltaik|daemmung|kellerabdichtung|fenster|heizung|fassade|garten|tueren|estrich|abriss-entsorgung|maurer|treppen|kueche'
          cities='berlin|hamburg|muenchen|koeln|frankfurt|stuttgart|duesseldorf|leipzig'
          count=$(grep -oE "https://baukostenradar.de/kosten/(${services})/(${cities})</loc>" /tmp/sitemap.xml | wc -l | tr -d ' ')
          test "$count" -eq 176

      - name: Verify referenced primary guides resolve
        shell: bash
        run: |
          set -euo pipefail

          guides=(
            bad-komplett-sanieren-kosten
            maler-kosten-pro-qm
            fliesenleger-kosten-pro-qm
            elektrik-erneuern-altbau
            dach-sanieren-kosten-pro-qm
            bodenleger-kosten-pro-qm
            trockenbau-kosten-pro-qm
            sanitaer-kosten
            waermepumpe-kosten-2026
            photovoltaik-kosten-2026
            daemmung-kosten-pro-qm
            kellerabdichtung-aussen-oder-innen-kosten
            fenster-austauschen-kosten-haus
            heizung-erneuern-kosten
            fassade-sanieren-kosten
            garten-anlegen-kosten
            6-innentueren-austauschen-kosten
            estrich-100-qm-kosten
            haus-abreissen-kosten
            innenwand-mauern-kosten
            14-treppenstufen-renovieren-kosten
            kueche-10-qm-renovieren-kosten
          )

          test "${#guides[@]}" -eq 22

          for guide in "${guides[@]}"; do
            output="/tmp/guide-${guide}.html"
            curl -sS --fail "https://baukostenradar.de/ratgeber/${guide}" -o "$output"
            ! grep -qi 'noindex' "$output"
          done
