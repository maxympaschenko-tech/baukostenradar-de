name: Verify expanded Fliesenleger guide cluster

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-fliesen-guide-cluster:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hostinger-verifier

      - name: Verify exact Fliesenleger price-item guide mappings
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            curl -sS --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 15 --max-time 60 -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' -H 'User-Agent: BauKostenRadar-CI/1.0' "$1" -o "$2"
          }
          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/kosten/fliesenleger' /tmp/fliesenleger.html
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html

          mappings=$(cat <<'EOF'
          standard-fliesen-verlegen|fliesen-verlegen-kosten-pro-qm
          grossformat-ab-80-x-80-cm|grossformat-fliesen-verlegen-kosten
          mosaik-fliesen-verlegen|mosaik-fliesen-verlegen-kosten-pro-qm
          naturstein-verlegen|naturstein-verlegen-kosten-pro-qm
          fliese-auf-fliese-verlegen|fliese-auf-fliese-kosten-pro-qm
          untergrund-ausgleichen|fliesen-untergrund-ausgleichen-kosten
          silikonfugen-ziehen|silikonfugen-kosten-pro-meter
          fliesen-sockelleisten-anbringen|fliesen-sockelleisten-kosten-pro-meter
          fliesenleger-stundensatz|fliesenleger-stundensatz
          EOF
          )

          checked=0
          while IFS='|' read -r item guide; do
            item="${item#${item%%[![:space:]]*}}"
            [ -n "$item" ] || continue
            item_url="https://baukostenradar.de/kosten/fliesenleger/leistung/${item}"
            guide_url="https://baukostenradar.de/ratgeber/${guide}"
            item_output="/tmp/fliesen-item-${item}.html"
            guide_output="/tmp/fliesen-guide-${guide}.html"
            grep -q "${item_url}</loc>" /tmp/sitemap.xml
            grep -q "/kosten/fliesenleger/leistung/${item}" /tmp/fliesenleger.html
            fetch "$item_url" "$item_output"
            grep -q 'Passender Ratgeber' "$item_output"
            grep -q "/ratgeber/${guide}" "$item_output"
            ! grep -qi 'noindex' "$item_output"
            grep -q "${guide_url}</loc>" /tmp/sitemap.xml
            grep -q "/ratgeber/${guide}" /tmp/ratgeber.html
            fetch "$guide_url" "$guide_output"
            grep -q "$guide_url" "$guide_output"
            grep -q '"@type":"Article"' "$guide_output"
            grep -q '/kosten/fliesenleger' "$guide_output"
            grep -q 'gewerk=fliesenleger' "$guide_output"
            ! grep -qi 'noindex' "$guide_output"
            checked=$((checked + 1))
          done <<< "$mappings"
          test "$checked" -eq 9
          echo "Verified ${checked} exact Fliesenleger price-item guide mappings"

      - name: Verify expanded Fliesenleger guide silo
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            curl -sS --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 15 --max-time 60 -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' -H 'User-Agent: BauKostenRadar-CI/1.0' "$1" -o "$2"
          }
          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html
          guides=(
            fliesenleger-kosten-pro-qm
            fliesenleger-stundensatz
            fliesen-verlegen-kosten-pro-qm
            fliese-auf-fliese-kosten-pro-qm
            fliesen-untergrund-ausgleichen-kosten
            grossformat-fliesen-verlegen-kosten
            mosaik-fliesen-verlegen-kosten-pro-qm
            naturstein-verlegen-kosten-pro-qm
            silikonfugen-kosten-pro-meter
            fliesen-sockelleisten-kosten-pro-meter
          )
          for source in "${guides[@]}"; do
            guide_url="https://baukostenradar.de/ratgeber/${source}"
            output="/tmp/fliesen-silo-${source}.html"
            grep -q "${guide_url}</loc>" /tmp/sitemap.xml
            grep -q "/ratgeber/${source}" /tmp/ratgeber.html
            fetch "$guide_url" "$output"
            grep -q '"@type":"Article"' "$output"
            ! grep -qi 'noindex' "$output"
            for target in "${guides[@]}"; do
              [ "$source" = "$target" ] && continue
              grep -q "/ratgeber/${target}" "$output" || { echo "${source} missing Fliesen peer ${target}"; exit 1; }
            done
          done
          test "${#guides[@]}" -eq 10
          echo "Verified ${#guides[@]} Fliesenleger guides and full peer-link silo"

      - name: Verify new Fliesenleger calculator presets and price anchors
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            curl -sS --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 15 --max-time 60 -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' -H 'User-Agent: BauKostenRadar-CI/1.0' "$1" -o "$2"
          }
          checks=$(cat <<'EOF'
          fliese-auf-fliese-kosten-pro-qm|fliese-auf-fliese-verlegen|50-80
          fliesen-untergrund-ausgleichen-kosten|untergrund-ausgleichen|10-30
          silikonfugen-kosten-pro-meter|silikonfugen-ziehen|3-8
          fliesen-sockelleisten-kosten-pro-meter|fliesen-sockelleisten-anbringen|5-10
          fliesenleger-stundensatz|fliesenleger-stundensatz|45-70
          EOF
          )
          checked=0
          while IFS='|' read -r guide preset price_token; do
            guide="${guide#${guide%%[![:space:]]*}}"
            [ -n "$guide" ] || continue
            output="/tmp/fliesen-preset-${guide}.html"
            fetch "https://baukostenradar.de/ratgeber/${guide}" "$output"
            grep -q "leistung=${preset}" "$output"
            grep -q "$price_token" "$output"
            checked=$((checked + 1))
          done <<< "$checks"
          test "$checked" -eq 5
          echo "Verified ${checked} new Fliesenleger calculator presets and price anchors"
