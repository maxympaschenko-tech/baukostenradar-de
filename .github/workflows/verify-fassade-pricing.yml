name: Verify Fassade pricing expansion

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-fassade-pricing:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Fassade pages and source catalog
        shell: bash
        run: |
          set -euo pipefail
          source scripts/hostinger-verify.sh
          fetch_hostinger 'https://baukostenradar.de/kosten/fassade' /tmp/main.html
          fetch_hostinger 'https://baukostenradar.de/kosten/fassade/muenchen' /tmp/city.html
          fetch_hostinger 'https://baukostenradar.de/quellen' /tmp/quellen.html
          fetch_hostinger 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml

      - name: Verify expanded source-backed Fassade data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from html.parser import HTMLParser

          class TextParser(HTMLParser):
              def __init__(self): super().__init__(); self.parts = []
              def handle_data(self, data):
                  value = data.strip()
                  if value: self.parts.append(value)

          def text(path):
              parser = TextParser()
              with open(path, encoding='utf-8') as handle: parser.feed(handle.read())
              return re.sub(r'\s+', ' ', ' '.join(parser.parts))

          main = text('/tmp/main.html')
          city = text('/tmp/city.html')
          quellen = text('/tmp/quellen.html')
          sitemap = open('/tmp/sitemap.xml', encoding='utf-8').read()

          expected_main = (
              '26 Preispositionen', '9 geprüfte Quellen',
              'Außenfassade Standardputz inkl. Arbeit',
              'Mineralischer Fassadenputz',
              'Edelputz für Außenfassade',
              'Einfamilienhaus Fassade neu verputzen ohne Dämmung',
              'Einfamilienhaus Fassade verputzen mit Dämmung',
              'Fassade streichen komplett inkl. Material und Arbeit',
              'Fassade 100 m² komplett streichen',
              'Sichtmauerwerk Fugen auskratzen und neu verfugen',
              'Risse im Fassadenmauerwerk verpressen',
              'Klinkerriemchen als Fassadenverblendung',
              'Verblendmauerwerk aus Klinker',
              'MyHammer - Außenfassade verputzen Kosten 2026',
              'MyHammer - Fassade streichen Kosten 2026',
              'Blauarbeit - Mauerwerk sanieren Kosten 2026',
              'Blauarbeit - Verblendmauerwerk Kosten 2026',
          )
          for needle in expected_main:
              if needle not in main: raise SystemExit(f'Missing Fassade signal: {needle}')

          for needle in ('Fassade Kosten in München 2026', 'Außenfassade Standardputz inkl. Arbeit', 'Fassade streichen komplett inkl. Material und Arbeit', 'Risse im Fassadenmauerwerk verpressen', 'Klinkerriemchen als Fassadenverblendung'):
              if needle not in city: raise SystemExit(f'Missing München Fassade signal: {needle}')

          for needle in ('MyHammer - Außenfassade verputzen Kosten 2026', 'MyHammer - Fassade streichen Kosten 2026', 'Blauarbeit - Mauerwerk sanieren Kosten 2026', 'Blauarbeit - Verblendmauerwerk Kosten 2026'):
              if needle not in quellen: raise SystemExit(f'Missing Fassade source: {needle}')

          for needle in ('/kosten/fassade/leistung/aussenfassade-standardputz-inkl-arbeit', '/kosten/fassade/leistung/fassade-streichen-komplett-inkl-material-und-arbeit', '/kosten/fassade/leistung/risse-im-fassadenmauerwerk-verpressen', '/kosten/fassade/leistung/klinkerriemchen-als-fassadenverblendung', '/kosten/fassade/leistung/verblendmauerwerk-aus-klinker'):
              if needle not in sitemap: raise SystemExit(f'Missing Fassade URL: {needle}')
          PY
