name: Verify Perimeterdämmung guide

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-perimeterdaemmung-guide:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hostinger-verifier

      - name: Verify Perimeterdämmung mappings and runtime contracts
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --location "$1" -o "$2"
          }

          guide='perimeterdaemmung-keller-kosten'
          guide_url="https://baukostenradar.de/ratgeber/${guide}"
          items=(
            perimeterdaemmung-keller-komplett
            xps-perimeterdaemmung-keller
            schaumglas-perimeterdaemmung-keller
            kleber-und-befestigung-perimeterdaemmung
            verlegung-perimeterdaemmung-fachbetrieb
          )

          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/kosten/kellerbau' /tmp/kellerbau.html
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html
          fetch "$guide_url" /tmp/guide.html

          grep -q "${guide_url}</loc>" /tmp/sitemap.xml
          grep -q "/ratgeber/${guide}" /tmp/ratgeber.html
          grep -q "$guide_url" /tmp/guide.html
          grep -q '"@type":"Article"' /tmp/guide.html
          grep -q '/kosten/kellerbau' /tmp/guide.html
          grep -q '/kosten/kellerbau/berlin' /tmp/guide.html
          grep -q 'gewerk=kellerbau' /tmp/guide.html
          grep -q 'leistung=perimeterdaemmung-keller-komplett' /tmp/guide.html
          grep -q '40-120' /tmp/guide.html
          ! grep -qi 'noindex' /tmp/guide.html

          checked=0
          for item in "${items[@]}"; do
            item_url="https://baukostenradar.de/kosten/kellerbau/leistung/${item}"
            output="/tmp/${item}.html"
            grep -q "${item_url}</loc>" /tmp/sitemap.xml
            grep -q "/kosten/kellerbau/leistung/${item}" /tmp/kellerbau.html
            fetch "$item_url" "$output"
            grep -q 'id="ratgeber"' "$output"
            grep -q "/ratgeber/${guide}" "$output" || { echo "Wrong Perimeterdämmung mapping for ${item}"; exit 1; }
            ! grep -qi 'noindex' "$output"
            checked=$((checked + 1))
          done

          test "$checked" -eq 5
          echo "Verified ${checked} Perimeterdämmung price-item mappings"

      - name: Verify Kellerbau peer links include Perimeterdämmung
        shell: bash
        run: |
          set -euo pipefail

          peers=(
            kellerbau-kosten
            fertigkeller-kosten
            massivkeller-wohnkeller-kosten
            keller-80-100-120-qm-kosten
            kellerbau-erdarbeiten-weisse-wanne-kosten
          )

          for peer in "${peers[@]}"; do
            curl -sS --fail --location "https://baukostenradar.de/ratgeber/${peer}" -o "/tmp/${peer}.html"
            grep -q '/ratgeber/perimeterdaemmung-keller-kosten' "/tmp/${peer}.html" || { echo "${peer} missing Perimeterdämmung peer link"; exit 1; }
          done

          echo "Verified ${#peers[@]} Kellerbau peer links"
