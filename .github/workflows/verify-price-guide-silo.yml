name: Verify price guide silo

on:
  workflow_run:
    workflows: ["Deploy to Ukraine.com.ua"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-price-guide-silo:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all live long-tail price pages are indexed
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail 'https://baukostenradar.de/sitemap.xml' -o /tmp/sitemap.xml

          mapfile -t services < <(
            grep -oE 'https://baukostenradar\.de/kosten/[^<]+' /tmp/sitemap.xml \
              | sed 's#https://baukostenradar.de/kosten/##' \
              | grep -Ev '/|^$' \
              | sort -u
          )

          test "${#services[@]}" -gt 0
          checked=0

          for service in "${services[@]}"; do
            curl -sS --fail "https://baukostenradar.de/kosten/${service}" -o "/tmp/service-${service}.html"
            mapfile -t detail_paths < <(
              grep -oE "/kosten/${service}/leistung/[a-z0-9-]+" "/tmp/service-${service}.html" | sort -u
            )

            if [ "${#detail_paths[@]}" -eq 0 ]; then
              echo "No price detail links found for ${service}" >&2
              exit 1
            fi

            for path in "${detail_paths[@]}"; do
              grep -q "https://baukostenradar.de${path}" /tmp/sitemap.xml || {
                echo "Missing from sitemap: ${path}" >&2
                exit 1
              }
              checked=$((checked + 1))
            done
          done

          indexed_count=$(grep -oE 'https://baukostenradar\.de/kosten/[^<]+/leistung/[^<]+' /tmp/sitemap.xml | sort -u | wc -l | tr -d ' ')
          echo "Long-tail price URLs in sitemap: ${indexed_count}; live detail links checked: ${checked}"
          test "$indexed_count" -eq "$checked"

      - name: Verify contextual guide mapping for every trade
        shell: bash
        run: |
          set -euo pipefail

          check_guide() {
            local service="$1"
            local item="$2"
            local guide="$3"
            local output="/tmp/${service}-${item}.html"
            curl -sS --fail "https://baukostenradar.de/kosten/${service}/leistung/${item}" -o "$output"
            grep -q 'Passender Ratgeber' "$output"
            grep -q "/ratgeber/${guide}" "$output"
            if grep -qi 'noindex' "$output"; then
              echo "Unexpected noindex for ${service}/${item}" >&2
              exit 1
            fi
            curl -sS --fail -o /dev/null "https://baukostenradar.de/ratgeber/${guide}"
          }

          check_guide 'badsanierung' 'bad-sanierung-komplett' 'bad-komplett-sanieren-kosten'
          check_guide 'maler' 'waende-streichen' 'waende-streichen-kosten-pro-qm'
          check_guide 'fliesenleger' 'standard-fliesen-verlegen' 'fliesen-verlegen-kosten-pro-qm'
          check_guide 'elektriker' 'steckdose-installieren' 'steckdose-installieren-kosten'
          check_guide 'dachsanierung' 'neueindeckung-inkl-lattung' 'dach-neu-eindecken-kosten-pro-qm'
          check_guide 'bodenleger' 'vinylboden-klick-inkl-material' 'vinylboden-verlegen-kosten-pro-qm'
          check_guide 'trockenbau' 'trockenbauwand-beidseitig-beplankt' 'trockenbauwand-kosten-pro-qm'
          check_guide 'sanitaer' 'sanitaerobjekte-armaturen-fuer-8-m2-bad' 'sanitaerobjekte-bad-kosten'
          check_guide 'waermepumpe' 'luft-wasser-waermepumpe-komplett' 'luft-wasser-waermepumpe-kosten'
          check_guide 'photovoltaik' 'pv-anlage-5-kwp-inkl-installation' 'photovoltaik-5-kwp-kosten'
          check_guide 'daemmung' 'innendaemmung' 'innendaemmung-kosten-pro-qm'
          check_guide 'fenster' 'fenster-mit-2-fach-verglasung' 'fenster-2-fach-verglasung-kosten'
          check_guide 'heizung' 'fussbodenheizung-nachruesten' 'fussbodenheizung-100-qm-kosten'
          check_guide 'fassade' 'putz-fassade-neu' 'putzfassade-kosten-pro-qm'
          check_guide 'garten' 'doppelstabmattenzaun-inkl-montage' 'doppelstabmattenzaun-kosten-pro-meter'
          check_guide 'tueren' 'innentuer-mit-zarge-inkl-montage' 'innentuer-einbauen-kosten'
          check_guide 'estrich' 'zementestrich-verlegen' 'zementestrich-kosten-pro-qm'
          check_guide 'maurer' 'mauerarbeiten-fertige-wand' 'innenwand-mauern-kosten'
          check_guide 'treppen' 'holzstufe-schleifen-und-versiegeln' '14-treppenstufen-renovieren-kosten'
          check_guide 'kueche' 'kuechen-renovierung-ohne-moebel' 'kueche-10-qm-renovieren-kosten'
          check_guide 'abriss-entsorgung' 'einfamilienhaus-komplett-abreissen' 'haus-abreissen-kosten'

      - name: Verify specialist contextual overrides
        shell: bash
        run: |
          set -euo pipefail

          curl -sS --fail 'https://baukostenradar.de/kosten/maler/leistung/fassade-streichen-inkl-vorarbeiten' -o /tmp/maler-fassade.html
          grep -q '/ratgeber/fassade-streichen-kosten-pro-qm' /tmp/maler-fassade.html

          curl -sS --fail 'https://baukostenradar.de/kosten/maurer/leistung/klinker-verblendmauerwerk' -o /tmp/maurer-klinker.html
          grep -q '/ratgeber/klinkerfassade-kosten-pro-qm' /tmp/maurer-klinker.html

          curl -sS --fail 'https://baukostenradar.de/kosten/fliesenleger/leistung/verbundabdichtung-bad' -o /tmp/fliesen-bad.html
          grep -q '/ratgeber/bad-komplett-sanieren-kosten' /tmp/fliesen-bad.html

          curl -sS --fail 'https://baukostenradar.de/kosten/daemmung/leistung/dachdaemmung-aufsparren' -o /tmp/daemmung-aufsparren.html
          grep -q '/ratgeber/aufsparrendaemmung-kosten-pro-qm' /tmp/daemmung-aufsparren.html

          curl -sS --fail 'https://baukostenradar.de/kosten/daemmung/leistung/dachdaemmung-zwischensparren' -o /tmp/daemmung-zwischensparren.html
          grep -q '/ratgeber/zwischensparrendaemmung-kosten-pro-qm' /tmp/daemmung-zwischensparren.html

      - name: Verify hourly prices use the labor-rate guide
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            'elektriker/elektriker-stundensatz' \
            'trockenbau/trockenbauer-stundensatz' \
            'sanitaer/sanitaerinstallateur-stundensatz' \
            'heizung/heizungsinstallateur-stundensatz' \
            'fassade/fassadenbauer-stundensatz' \
            'garten/gartenpflege' \
            'maurer/maurer-stundensatz'; do
            curl -sS --fail "https://baukostenradar.de/kosten/${path%/*}/leistung/${path#*/}" -o /tmp/hourly.html
            grep -q '/ratgeber/handwerker-stundensaetze' /tmp/hourly.html
          done
