name: Verify expanded Maler guide cluster

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-maler-guide-cluster:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hostinger-verifier

      - name: Verify exact Maler price-item guide mappings
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --location \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 15 --max-time 60 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              -H 'User-Agent: BauKostenRadar-CI/1.0' \
              "$1" -o "$2"
          }

          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/kosten/maler' /tmp/maler.html
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html

          mappings=$(cat <<'EOF'
          waende-streichen|waende-streichen-kosten-pro-qm
          tapezieren-inkl-tapete|tapezieren-kosten-pro-qm
          innenputz-glaetten-q3|innenputz-q3-kosten-pro-qm
          maler-stundensatz|maler-stundensatz
          alte-tapeten-entfernen|tapeten-entfernen-kosten-pro-qm
          vlies-oder-mustertapete-tapezieren|tapezieren-kosten-pro-qm
          innentuer-inkl-zarge-lackieren|innentuer-lackieren-kosten
          fensterrahmen-lackieren|fensterrahmen-lackieren-kosten
          EOF
          )

          checked=0
          while IFS='|' read -r item guide; do
            item="${item#${item%%[![:space:]]*}}"
            [ -n "$item" ] || continue

            item_url="https://baukostenradar.de/kosten/maler/leistung/${item}"
            guide_url="https://baukostenradar.de/ratgeber/${guide}"
            item_output="/tmp/maler-item-${item}.html"
            guide_output="/tmp/maler-guide-${guide}.html"

            grep -q "${item_url}</loc>" /tmp/sitemap.xml || { echo "Maler item missing in sitemap: ${item}"; exit 1; }
            grep -q "/kosten/maler/leistung/${item}" /tmp/maler.html || { echo "Maler item missing on category: ${item}"; exit 1; }

            fetch "$item_url" "$item_output"
            grep -q 'Passender Ratgeber' "$item_output"
            grep -q "/ratgeber/${guide}" "$item_output" || { echo "Wrong Maler guide mapping: ${item} -> ${guide}"; exit 1; }
            ! grep -qi 'noindex' "$item_output"

            grep -q "${guide_url}</loc>" /tmp/sitemap.xml || { echo "Maler guide missing in sitemap: ${guide}"; exit 1; }
            grep -q "/ratgeber/${guide}" /tmp/ratgeber.html || { echo "Maler guide missing from hub: ${guide}"; exit 1; }

            fetch "$guide_url" "$guide_output"
            grep -q "$guide_url" "$guide_output"
            grep -q '"@type":"Article"' "$guide_output"
            grep -q '/kosten/maler' "$guide_output"
            grep -q 'gewerk=maler' "$guide_output"
            ! grep -qi 'noindex' "$guide_output"

            checked=$((checked + 1))
          done <<< "$mappings"

          test "$checked" -eq 8
          echo "Verified ${checked} exact Maler price-item guide mappings"

      - name: Verify expanded Maler guide silo
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --location \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 15 --max-time 60 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              -H 'User-Agent: BauKostenRadar-CI/1.0' \
              "$1" -o "$2"
          }

          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html

          guides=(
            maler-kosten-pro-qm
            maler-stundensatz
            waende-streichen-kosten-pro-qm
            tapezieren-kosten-pro-qm
            tapeten-entfernen-kosten-pro-qm
            innenputz-q3-kosten-pro-qm
            innentuer-lackieren-kosten
            fensterrahmen-lackieren-kosten
          )

          for source in "${guides[@]}"; do
            guide_url="https://baukostenradar.de/ratgeber/${source}"
            output="/tmp/maler-silo-${source}.html"

            grep -q "${guide_url}</loc>" /tmp/sitemap.xml || { echo "Maler guide missing in sitemap: ${source}"; exit 1; }
            grep -q "/ratgeber/${source}" /tmp/ratgeber.html || { echo "Maler guide missing from hub: ${source}"; exit 1; }

            fetch "$guide_url" "$output"
            grep -q "$guide_url" "$output"
            grep -q '"@type":"Article"' "$output"
            ! grep -qi 'noindex' "$output"

            for target in "${guides[@]}"; do
              [ "$source" = "$target" ] && continue
              grep -q "/ratgeber/${target}" "$output" || { echo "${source} missing Maler peer ${target}"; exit 1; }
            done
          done

          test "${#guides[@]}" -eq 8
          echo "Verified ${#guides[@]} Maler guides and full peer-link silo"

      - name: Verify new Maler calculator presets and price anchors
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --location \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 15 --max-time 60 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              -H 'User-Agent: BauKostenRadar-CI/1.0' \
              "$1" -o "$2"
          }

          checks=$(cat <<'EOF'
          maler-stundensatz|maler-stundensatz|40-65
          tapeten-entfernen-kosten-pro-qm|alte-tapeten-entfernen|5-20
          innentuer-lackieren-kosten|innentuer-inkl-zarge-lackieren|170-250
          fensterrahmen-lackieren-kosten|fensterrahmen-lackieren|70-150
          EOF
          )

          checked=0
          while IFS='|' read -r guide preset price_token; do
            guide="${guide#${guide%%[![:space:]]*}}"
            [ -n "$guide" ] || continue
            output="/tmp/maler-preset-${guide}.html"
            fetch "https://baukostenradar.de/ratgeber/${guide}" "$output"
            grep -q "leistung=${preset}" "$output" || { echo "Missing calculator preset ${preset} on ${guide}"; exit 1; }
            grep -q "$price_token" "$output" || { echo "Missing price anchor ${price_token} on ${guide}"; exit 1; }
            checked=$((checked + 1))
          done <<< "$checks"

          test "$checked" -eq 4
          echo "Verified ${checked} new Maler calculator presets and price anchors"
