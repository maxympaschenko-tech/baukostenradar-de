name: Verify expanded electrical guide cluster

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-electrical-guide-cluster:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hostinger-verifier

      - name: Verify exact electrical price-item guide mappings
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            curl -sS --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 15 --max-time 60 -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' -H 'User-Agent: BauKostenRadar-CI/1.0' "$1" -o "$2"
          }
          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/kosten/elektriker' /tmp/elektriker.html
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html

          mappings=$(cat <<'EOF'
          steckdose-installieren|steckdose-installieren-kosten
          lichtschalter-austauschen|lichtschalter-austauschen-kosten
          sicherungskasten-erneuern|sicherungskasten-erneuern-kosten
          komplett-neuinstallation|elektro-neuinstallation-kosten
          elektriker-anfahrt|elektriker-anfahrt-kosten
          fi-schutzschalter-nachruesten|fi-schutzschalter-nachruesten-kosten
          elektroinstallation-neubau|elektroinstallation-neubau-kosten-pro-qm
          smart-home-einrichtung|smart-home-einrichtung-kosten
          e-auto-wallbox-installieren|wallbox-installieren-kosten
          EOF
          )

          checked=0
          while IFS='|' read -r item guide; do
            item="${item#${item%%[![:space:]]*}}"
            [ -n "$item" ] || continue
            item_url="https://baukostenradar.de/kosten/elektriker/leistung/${item}"
            guide_url="https://baukostenradar.de/ratgeber/${guide}"
            item_output="/tmp/elektriker-item-${item}.html"
            guide_output="/tmp/elektriker-guide-${guide}.html"
            grep -q "${item_url}</loc>" /tmp/sitemap.xml
            grep -q "/kosten/elektriker/leistung/${item}" /tmp/elektriker.html
            fetch "$item_url" "$item_output"
            grep -q 'Passender Ratgeber' "$item_output"
            grep -q "/ratgeber/${guide}" "$item_output"
            ! grep -qi 'noindex' "$item_output"
            grep -q "${guide_url}</loc>" /tmp/sitemap.xml
            grep -q "/ratgeber/${guide}" /tmp/ratgeber.html
            fetch "$guide_url" "$guide_output"
            grep -q "$guide_url" "$guide_output"
            grep -q '"@type":"Article"' "$guide_output"
            grep -q '/kosten/elektriker' "$guide_output"
            grep -q 'gewerk=elektriker' "$guide_output"
            ! grep -qi 'noindex' "$guide_output"
            checked=$((checked + 1))
          done <<< "$mappings"
          test "$checked" -eq 9
          echo "Verified ${checked} exact electrical price-item guide mappings"

      - name: Verify electrical hourly-rate mapping
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail --location 'https://baukostenradar.de/kosten/elektriker/leistung/elektriker-stundensatz' -o /tmp/rate.html
          grep -q '/ratgeber/handwerker-stundensaetze' /tmp/rate.html
          ! grep -qi 'noindex' /tmp/rate.html

      - name: Verify expanded electrical guide silo
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            curl -sS --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 15 --max-time 60 -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' -H 'User-Agent: BauKostenRadar-CI/1.0' "$1" -o "$2"
          }
          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html
          guides=(
            elektrik-erneuern-altbau
            elektrik-erneuern-100-qm-kosten
            elektro-neuinstallation-kosten
            elektroinstallation-neubau-kosten-pro-qm
            sicherungskasten-erneuern-kosten
            fi-schutzschalter-nachruesten-kosten
            steckdose-installieren-kosten
            lichtschalter-austauschen-kosten
            elektriker-anfahrt-kosten
            smart-home-einrichtung-kosten
            wallbox-installieren-kosten
          )
          for source in "${guides[@]}"; do
            guide_url="https://baukostenradar.de/ratgeber/${source}"
            output="/tmp/electrical-silo-${source}.html"
            grep -q "${guide_url}</loc>" /tmp/sitemap.xml
            grep -q "/ratgeber/${source}" /tmp/ratgeber.html
            fetch "$guide_url" "$output"
            grep -q '"@type":"Article"' "$output"
            ! grep -qi 'noindex' "$output"
            for target in "${guides[@]}"; do
              [ "$source" = "$target" ] && continue
              grep -q "/ratgeber/${target}" "$output" || { echo "${source} missing electrical peer ${target}"; exit 1; }
            done
          done
          test "${#guides[@]}" -eq 11
          echo "Verified ${#guides[@]} electrical guides and full peer-link silo"

      - name: Verify new electrical calculator presets and price anchors
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            curl -sS --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 15 --max-time 60 -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' -H 'User-Agent: BauKostenRadar-CI/1.0' "$1" -o "$2"
          }
          checks=$(cat <<'EOF'
          elektriker-anfahrt-kosten|elektriker-anfahrt|30-70
          fi-schutzschalter-nachruesten-kosten|fi-schutzschalter-nachruesten|150-300
          elektroinstallation-neubau-kosten-pro-qm|elektroinstallation-neubau|80-150
          smart-home-einrichtung-kosten|smart-home-einrichtung|500-3.000
          wallbox-installieren-kosten|e-auto-wallbox-installieren|1.200-2.500
          EOF
          )
          checked=0
          while IFS='|' read -r guide preset price_token; do
            guide="${guide#${guide%%[![:space:]]*}}"
            [ -n "$guide" ] || continue
            output="/tmp/electrical-preset-${guide}.html"
            fetch "https://baukostenradar.de/ratgeber/${guide}" "$output"
            grep -q "leistung=${preset}" "$output"
            grep -q "$price_token" "$output"
            checked=$((checked + 1))
          done <<< "$checks"
          test "$checked" -eq 5
          echo "Verified ${checked} new electrical calculator presets and price anchors"
