name: Verify expanded Trockenbau guide cluster

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-trockenbau-guide-cluster:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hostinger-verifier

      - name: Verify exact Trockenbau price-item guide mappings
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            curl -sS --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 15 --max-time 60 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              -H 'User-Agent: BauKostenRadar-CI/1.0' "$1" -o "$2"
          }
          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/kosten/trockenbau' /tmp/trockenbau.html
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html

          mappings=$(cat <<'EOF'
          trockenbauwand-beidseitig-beplankt|trockenbauwand-kosten-pro-qm
          verspachtelung-q4|verspachtelung-q4-kosten-pro-qm
          trockenbauer-stundensatz|trockenbauer-stundensatz
          trockenbauwand-einfach-inkl-material|trockenbauwand-kosten-pro-qm
          trennwand-aus-holz|trennwand-holz-kosten-pro-qm
          vorsatzschale|vorsatzschale-kosten-pro-qm
          decke-abhaengen|decke-abhaengen-kosten-pro-qm
          dachschraege-verkleiden|dachschraege-verkleiden-kosten-pro-qm
          spanndecke|spanndecke-kosten-pro-qm
          verspachtelung-q3|verspachtelung-q3-kosten-pro-qm
          EOF
          )

          checked=0
          while IFS='|' read -r item guide; do
            item="${item#${item%%[![:space:]]*}}"
            [ -n "$item" ] || continue
            item_url="https://baukostenradar.de/kosten/trockenbau/leistung/${item}"
            guide_url="https://baukostenradar.de/ratgeber/${guide}"
            item_output="/tmp/trockenbau-item-${item}.html"
            guide_output="/tmp/trockenbau-guide-${guide}.html"
            grep -q "${item_url}</loc>" /tmp/sitemap.xml || { echo "Trockenbau item missing in sitemap: ${item}"; exit 1; }
            grep -q "/kosten/trockenbau/leistung/${item}" /tmp/trockenbau.html || { echo "Trockenbau item missing on category: ${item}"; exit 1; }
            fetch "$item_url" "$item_output"
            grep -q 'Passender Ratgeber' "$item_output"
            grep -q "/ratgeber/${guide}" "$item_output" || { echo "Wrong Trockenbau mapping: ${item} -> ${guide}"; exit 1; }
            ! grep -qi 'noindex' "$item_output"
            grep -q "${guide_url}</loc>" /tmp/sitemap.xml || { echo "Trockenbau guide missing in sitemap: ${guide}"; exit 1; }
            grep -q "/ratgeber/${guide}" /tmp/ratgeber.html || { echo "Trockenbau guide missing from hub: ${guide}"; exit 1; }
            fetch "$guide_url" "$guide_output"
            grep -q "$guide_url" "$guide_output"
            grep -q '"@type":"Article"' "$guide_output"
            grep -q '/kosten/trockenbau' "$guide_output"
            grep -q 'gewerk=trockenbau' "$guide_output"
            ! grep -qi 'noindex' "$guide_output"
            checked=$((checked + 1))
          done <<< "$mappings"
          test "$checked" -eq 10
          echo "Verified ${checked} exact Trockenbau price-item guide mappings"

      - name: Verify 10-guide Trockenbau silo
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            curl -sS --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 15 --max-time 60 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              -H 'User-Agent: BauKostenRadar-CI/1.0' "$1" -o "$2"
          }
          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html
          guides=(
            trockenbau-kosten-pro-qm
            trockenbauer-stundensatz
            trockenbauwand-kosten-pro-qm
            trennwand-holz-kosten-pro-qm
            vorsatzschale-kosten-pro-qm
            decke-abhaengen-kosten-pro-qm
            dachschraege-verkleiden-kosten-pro-qm
            spanndecke-kosten-pro-qm
            verspachtelung-q3-kosten-pro-qm
            verspachtelung-q4-kosten-pro-qm
          )
          for source in "${guides[@]}"; do
            guide_url="https://baukostenradar.de/ratgeber/${source}"
            output="/tmp/trockenbau-silo-${source}.html"
            grep -q "${guide_url}</loc>" /tmp/sitemap.xml || { echo "Trockenbau guide missing in sitemap: ${source}"; exit 1; }
            grep -q "/ratgeber/${source}" /tmp/ratgeber.html || { echo "Trockenbau guide missing from hub: ${source}"; exit 1; }
            fetch "$guide_url" "$output"
            grep -q "$guide_url" "$output"
            grep -q '"@type":"Article"' "$output"
            ! grep -qi 'noindex' "$output"
            for target in "${guides[@]}"; do
              [ "$source" = "$target" ] && continue
              grep -q "/ratgeber/${target}" "$output" || { echo "${source} missing Trockenbau peer ${target}"; exit 1; }
            done
          done
          test "${#guides[@]}" -eq 10
          echo "Verified ${#guides[@]} Trockenbau guides and full peer-link silo"

      - name: Verify Trockenbau calculator presets and price anchors
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            curl -sS --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 15 --max-time 60 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              -H 'User-Agent: BauKostenRadar-CI/1.0' "$1" -o "$2"
          }
          checks=$(cat <<'EOF'
          trockenbauer-stundensatz|trockenbauer-stundensatz|45-70
          trennwand-holz-kosten-pro-qm|trennwand-aus-holz|50-90
          vorsatzschale-kosten-pro-qm|vorsatzschale|30-60
          decke-abhaengen-kosten-pro-qm|decke-abhaengen|40-90
          dachschraege-verkleiden-kosten-pro-qm|dachschraege-verkleiden|40-80
          spanndecke-kosten-pro-qm|spanndecke|120-130
          verspachtelung-q3-kosten-pro-qm|verspachtelung-q3|8-15
          EOF
          )
          checked=0
          while IFS='|' read -r guide preset price_token; do
            guide="${guide#${guide%%[![:space:]]*}}"
            [ -n "$guide" ] || continue
            output="/tmp/trockenbau-preset-${guide}.html"
            fetch "https://baukostenradar.de/ratgeber/${guide}" "$output"
            grep -q "leistung=${preset}" "$output" || { echo "Missing calculator preset ${preset} on ${guide}"; exit 1; }
            grep -q "$price_token" "$output" || { echo "Missing price anchor ${price_token} on ${guide}"; exit 1; }
            grep -q "/kosten/trockenbau/leistung/${preset}" "$output" || { echo "Missing price detail ${preset} on ${guide}"; exit 1; }
            checked=$((checked + 1))
          done <<< "$checks"
          test "$checked" -eq 7
          echo "Verified ${checked} Trockenbau calculator presets and price anchors"
