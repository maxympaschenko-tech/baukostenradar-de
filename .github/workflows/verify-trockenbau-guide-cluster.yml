name: Verify Trockenbau guide cluster

on:
  workflow_run:
    workflows: ["Deploy to Ukraine.com.ua"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-trockenbau-guide-cluster:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact Trockenbau price-item guide mappings
        shell: bash
        run: |
          set -euo pipefail

          curl -sS --fail 'https://baukostenradar.de/sitemap.xml' -o /tmp/sitemap.xml
          curl -sS --fail 'https://baukostenradar.de/kosten/trockenbau' -o /tmp/trockenbau.html
          curl -sS --fail 'https://baukostenradar.de/ratgeber' -o /tmp/ratgeber.html

          grep -q 'https://baukostenradar.de/kosten/trockenbau' /tmp/trockenbau.html
          ! grep -qi 'noindex' /tmp/trockenbau.html

          mappings=$(cat <<'EOF'
          trockenbauwand-beidseitig-beplankt|trockenbauwand-kosten-pro-qm
          verspachtelung-q4|verspachtelung-q4-kosten-pro-qm
          EOF
          )

          checked=0
          while IFS='|' read -r item guide; do
            item="${item#${item%%[![:space:]]*}}"
            [ -n "$item" ] || continue

            item_url="https://baukostenradar.de/kosten/trockenbau/leistung/${item}"
            guide_url="https://baukostenradar.de/ratgeber/${guide}"
            item_output="/tmp/trockenbau-item-${item}.html"
            guide_output="/tmp/trockenbau-guide-${guide}.html"

            grep -q "${item_url}</loc>" /tmp/sitemap.xml || { echo "Trockenbau item missing in sitemap: ${item}"; exit 1; }
            grep -q "/kosten/trockenbau/leistung/${item}" /tmp/trockenbau.html || { echo "Trockenbau item missing on category: ${item}"; exit 1; }

            curl -sS --fail "$item_url" -o "$item_output"
            grep -q 'Passender Ratgeber' "$item_output"
            grep -q "/ratgeber/${guide}" "$item_output" || { echo "Wrong Trockenbau guide mapping: ${item} -> ${guide}"; exit 1; }
            ! grep -qi 'noindex' "$item_output"

            grep -q "${guide_url}</loc>" /tmp/sitemap.xml
            grep -q "/ratgeber/${guide}" /tmp/ratgeber.html

            curl -sS --fail "$guide_url" -o "$guide_output"
            grep -q "$guide_url" "$guide_output"
            grep -q '"@type":"Article"' "$guide_output"
            grep -q '/kosten/trockenbau' "$guide_output"
            grep -q '/kosten/trockenbau/berlin' "$guide_output"
            grep -q 'gewerk=trockenbau' "$guide_output"
            grep -q "leistung=${item}" "$guide_output"
            ! grep -qi 'noindex' "$guide_output"

            checked=$((checked + 1))
          done <<< "$mappings"

          test "$checked" -eq 2
          echo "Verified ${checked} exact Trockenbau price-item guide mappings"

      - name: Verify Trockenbau parent guide and calculator
        shell: bash
        run: |
          set -euo pipefail

          guide='trockenbau-kosten-pro-qm'
          guide_url="https://baukostenradar.de/ratgeber/${guide}"

          curl -sS --fail 'https://baukostenradar.de/sitemap.xml' -o /tmp/sitemap.xml
          curl -sS --fail 'https://baukostenradar.de/ratgeber' -o /tmp/ratgeber.html
          curl -sS --fail "$guide_url" -o /tmp/trockenbau-parent.html

          grep -q "${guide_url}</loc>" /tmp/sitemap.xml
          grep -q "/ratgeber/${guide}" /tmp/ratgeber.html
          grep -q "$guide_url" /tmp/trockenbau-parent.html
          grep -q '"@type":"Article"' /tmp/trockenbau-parent.html
          grep -q '/kosten/trockenbau' /tmp/trockenbau-parent.html
          grep -q '/kosten/trockenbau/berlin' /tmp/trockenbau-parent.html
          grep -q 'gewerk=trockenbau' /tmp/trockenbau-parent.html
          grep -q 'leistung=trockenbauwand-beidseitig-beplankt' /tmp/trockenbau-parent.html
          ! grep -qi 'noindex' /tmp/trockenbau-parent.html

      - name: Verify Trockenbau guide hub and internal-link silo
        shell: bash
        run: |
          set -euo pipefail

          curl -sS --fail 'https://baukostenradar.de/sitemap.xml' -o /tmp/sitemap.xml
          curl -sS --fail 'https://baukostenradar.de/ratgeber' -o /tmp/ratgeber.html

          guides=(
            trockenbau-kosten-pro-qm
            trockenbauwand-kosten-pro-qm
            verspachtelung-q4-kosten-pro-qm
          )

          for source in "${guides[@]}"; do
            guide_url="https://baukostenradar.de/ratgeber/${source}"
            grep -q "${guide_url}</loc>" /tmp/sitemap.xml || { echo "Trockenbau cluster guide missing in sitemap: ${source}"; exit 1; }
            grep -q "/ratgeber/${source}" /tmp/ratgeber.html || { echo "Trockenbau cluster guide missing from hub: ${source}"; exit 1; }

            curl -sS --fail "$guide_url" -o "/tmp/${source}.html"
            grep -q "$guide_url" "/tmp/${source}.html"
            grep -q '"@type":"Article"' "/tmp/${source}.html"
            ! grep -qi 'noindex' "/tmp/${source}.html"

            for target in "${guides[@]}"; do
              [ "$source" = "$target" ] && continue
              grep -q "/ratgeber/${target}" "/tmp/${source}.html" || { echo "${source} missing Trockenbau peer ${target}"; exit 1; }
            done
          done

          echo "Verified Trockenbau hub visibility and full peer-link silo"
