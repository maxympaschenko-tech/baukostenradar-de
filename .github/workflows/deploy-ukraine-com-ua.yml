name: Deploy to Ukraine.com.ua

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: uageek.ftp.tools
      REMOTE_USER: uageek
      REMOTE_PATH: /home/uageek/baukostenradar.de/www
      PRODUCTION_HOST: www.baukostenradar.de

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check deploy configuration
        id: deploy_config
        env:
          REMOTE_KEY: ${{ secrets.REMOTE_KEY }}
          ADMTOOLS_TOKEN: ${{ secrets.ADMTOOLS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$REMOTE_KEY" ]]; then
            echo "REMOTE_KEY is required for production deploy." >&2
            exit 1
          fi
          if [[ -z "$ADMTOOLS_TOKEN" ]]; then
            echo "ADMTOOLS_TOKEN is required for production restart." >&2
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://baukostenradar.de
          NEXT_PUBLIC_GIT_SHA: ${{ github.sha }}

      - name: Assemble standalone bundle
        shell: bash
        run: |
          if [[ -d public ]]; then
            cp -R public .next/standalone/public
          fi
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          cat > .next/standalone/package.json <<'JSON'
          {
            "name": "baukostenradar-production",
            "private": true,
            "scripts": {
              "start": "HOSTNAME=$HOST PORT=$PORT node server.js"
            }
          }
          JSON

      - name: Configure SSH
        shell: bash
        env:
          REMOTE_KEY: ${{ secrets.REMOTE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$REMOTE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 -H "$REMOTE_HOST" >> ~/.ssh/known_hosts

      - name: Deploy standalone bundle
        shell: bash
        run: |
          ssh -p 22 "$REMOTE_USER@$REMOTE_HOST" "mkdir -p '$REMOTE_PATH'"
          rsync -az --delete -e 'ssh -p 22' --exclude='.env*' .next/standalone/ "$REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/"

      - name: Restart application through adm.tools API
        shell: bash
        env:
          ADMTOOLS_TOKEN: ${{ secrets.ADMTOOLS_TOKEN }}
        run: |
          set -euo pipefail

          # GitHub secret must contain the raw token. Be tolerant if an older
          # secret was saved as "Bearer <token>" and never print the token.
          token="$(printf '%s' "$ADMTOOLS_TOKEN" | tr -d '\r\n')"
          if [[ "$token" == Bearer\ * ]]; then
            token="${token#Bearer }"
          fi
          if [[ -z "$token" ]]; then
            echo "ADMTOOLS_TOKEN is empty after normalization." >&2
            exit 1
          fi

          api_post() {
            local path="$1"
            local post_data="$2"
            local output="$3"
            curl --silent --show-error \
              --connect-timeout 15 \
              --max-time 30 \
              -o "$output" \
              -w '%{http_code}' \
              -X POST "https://adm.tools/action/${path}/" \
              -H "Authorization: Bearer $token" \
              -d "$post_data" || true
          }

          services_file=$(mktemp)
          services_code=$(api_post 'get_services' 'type=host' "$services_file")
          if [[ ! "$services_code" =~ ^2 ]]; then
            echo "ADM.TOOLS get_services returned HTTP ${services_code}." >&2
            if [[ "$services_code" == "401" || "$services_code" == "403" ]]; then
              echo "Refresh the ADMTOOLS_TOKEN secret and check API IP restrictions in adm.tools." >&2
            fi
            exit 1
          fi

          host_id=$(jq -r --arg domain 'baukostenradar.de' '
            [
              .. | objects
              | select((tojson | contains($domain)))
              | (.host_id // .id // empty)
              | tostring
            ][0] // empty
          ' "$services_file")

          if [[ -z "$host_id" ]]; then
            echo "Could not resolve ADM.TOOLS host id from get_services." >&2
            exit 1
          fi

          echo "Resolved ADM.TOOLS host id."

          # Prefer the current web-application systemd API documented by the hoster.
          info_file=$(mktemp)
          info_code=$(api_post 'hosting/account/app/systemd/info' "host_id=$host_id" "$info_file")
          systemd_id=""
          if [[ "$info_code" =~ ^2 ]]; then
            systemd_id=$(jq -r '[.. | objects | (.systemd_id? // empty) | tostring][0] // empty' "$info_file" 2>/dev/null || true)
          fi

          if [[ -n "$systemd_id" ]]; then
            restart_file=$(mktemp)
            restart_code=$(api_post 'hosting/account/app/systemd/restart' "systemd_id=$systemd_id" "$restart_file")
            if [[ "$restart_code" =~ ^2 ]] && jq -e '.result == true' "$restart_file" >/dev/null 2>&1; then
              echo "Web application restart requested through systemd API."
              exit 0
            fi
            echo "Systemd restart endpoint did not confirm success (HTTP ${restart_code}); trying legacy Node.js reload." >&2
          else
            echo "No systemd_id returned (HTTP ${info_code}); trying legacy Node.js reload." >&2
          fi

          # Compatibility fallback for hosting accounts still exposed through the legacy Node.js API.
          legacy_file=$(mktemp)
          legacy_code=$(api_post 'hosting/account/nodejs/reload' "host_id=$host_id" "$legacy_file")
          if [[ "$legacy_code" =~ ^2 ]] && jq -e '.result == true' "$legacy_file" >/dev/null 2>&1; then
            echo "Node.js application restart requested through legacy API."
            exit 0
          fi

          echo "ADM.TOOLS restart failed through both current and legacy APIs (legacy HTTP ${legacy_code})." >&2
          exit 1

      - name: Verify exact production commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /tmp/version.json -w '%{http_code}' --connect-timeout 10 --max-time 20 'https://baukostenradar.de/api/version' || true)
            deployed_sha=$(jq -r '.sha // empty' /tmp/version.json 2>/dev/null || true)
            if [[ "$code" == "200" && "$deployed_sha" == "$EXPECTED_SHA" ]]; then
              echo "Production is running commit $EXPECTED_SHA."
              exit 0
            fi
            echo "Attempt $i: HTTP $code, deployed SHA '$deployed_sha'; waiting for app restart..."
            sleep 5
          done
          echo "Production version verification failed. Expected $EXPECTED_SHA." >&2
          exit 1
