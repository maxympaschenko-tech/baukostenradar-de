name: Verify Pooltechnik guide

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-pooltechnik-guide:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hostinger-verifier

      - name: Verify Pooltechnik mappings and runtime contracts
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --location "$1" -o "$2"
          }

          guide='pooltechnik-kosten'
          guide_url="https://baukostenradar.de/ratgeber/${guide}"
          items=(
            filteranlage
            poolpumpe
            verrohrung-skimmer-und-duesen
          )

          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/kosten/poolbau' /tmp/pool.html
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html
          fetch "$guide_url" /tmp/guide.html

          grep -q "${guide_url}</loc>" /tmp/sitemap.xml
          grep -q "/ratgeber/${guide}" /tmp/ratgeber.html
          grep -q "$guide_url" /tmp/guide.html
          grep -q '"@type":"Article"' /tmp/guide.html
          grep -q '/kosten/poolbau' /tmp/guide.html
          grep -q '/kosten/poolbau/berlin' /tmp/guide.html
          grep -q 'gewerk=poolbau' /tmp/guide.html
          grep -q 'leistung=filteranlage' /tmp/guide.html
          grep -q '400-2.500' /tmp/guide.html
          grep -q '200-1.500' /tmp/guide.html
          grep -q '300-1.200' /tmp/guide.html
          ! grep -qi 'noindex' /tmp/guide.html

          checked=0
          for item in "${items[@]}"; do
            item_url="https://baukostenradar.de/kosten/poolbau/leistung/${item}"
            output="/tmp/${item}.html"
            grep -q "${item_url}</loc>" /tmp/sitemap.xml
            grep -q "/kosten/poolbau/leistung/${item}" /tmp/pool.html
            fetch "$item_url" "$output"
            grep -q 'id="ratgeber"' "$output"
            grep -q "/ratgeber/${guide}" "$output" || { echo "Wrong Pooltechnik mapping for ${item}"; exit 1; }
            ! grep -qi 'noindex' "$output"
            checked=$((checked + 1))
          done

          test "$checked" -eq 3
          echo "Verified ${checked} Pooltechnik price-item mappings"

      - name: Verify six-guide Pool peer silo
        shell: bash
        run: |
          set -euo pipefail

          guides=(
            pool-bauen-kosten
            gfk-pool-kosten
            betonpool-kosten
            pool-erdarbeiten-kosten
            pool-betriebskosten
            pooltechnik-kosten
          )

          for source in "${guides[@]}"; do
            curl -sS --fail --location "https://baukostenradar.de/ratgeber/${source}" -o "/tmp/${source}.html"
            for target in "${guides[@]}"; do
              [ "$source" = "$target" ] && continue
              grep -q "/ratgeber/${target}" "/tmp/${source}.html" || { echo "${source} missing Pool peer ${target}"; exit 1; }
            done
          done

          echo "Verified six-guide Pool peer silo"
