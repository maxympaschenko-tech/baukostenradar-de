name: Verify heating guide cluster

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-heating-guide-cluster:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact heating price-item guide mappings
        shell: bash
        run: |
          set -euo pipefail

          curl -sS --fail 'https://baukostenradar.de/sitemap.xml' -o /tmp/sitemap.xml
          curl -sS --fail 'https://baukostenradar.de/kosten/heizung' -o /tmp/heizung.html
          curl -sS --fail 'https://baukostenradar.de/ratgeber' -o /tmp/ratgeber.html

          grep -q 'https://baukostenradar.de/kosten/heizung' /tmp/heizung.html
          ! grep -qi 'noindex' /tmp/heizung.html

          mappings=$(cat <<'EOF'
          gasheizung-austauschen|gasheizung-austauschen-kosten
          heizkoerper-montieren|heizkoerper-montieren-kosten
          fussbodenheizung-nachruesten|fussbodenheizung-100-qm-kosten
          thermostat-installieren|thermostat-installieren-kosten
          heizungswartung|heizungswartung-kosten
          EOF
          )

          checked=0
          while IFS='|' read -r item guide; do
            item="${item#${item%%[![:space:]]*}}"
            [ -n "$item" ] || continue

            echo "Checking Heizung ${item} -> ${guide}"
            item_url="https://baukostenradar.de/kosten/heizung/leistung/${item}"
            guide_url="https://baukostenradar.de/ratgeber/${guide}"
            item_output="/tmp/heizung-item-${item}.html"
            guide_output="/tmp/heizung-guide-${guide}.html"

            grep -q "${item_url}</loc>" /tmp/sitemap.xml || { echo "Heating item missing in sitemap: ${item}"; exit 1; }
            grep -q "/kosten/heizung/leistung/${item}" /tmp/heizung.html || { echo "Heating item missing on category: ${item}"; exit 1; }

            curl -sS --fail "$item_url" -o "$item_output"
            grep -q 'Passender Ratgeber' "$item_output" || { echo "Ratgeber block missing: ${item}"; exit 1; }
            grep -q "/ratgeber/${guide}" "$item_output" || { echo "Wrong heating guide mapping: ${item} -> ${guide}"; exit 1; }
            ! grep -qi 'noindex' "$item_output"

            grep -q "${guide_url}</loc>" /tmp/sitemap.xml || { echo "Heating guide missing in sitemap: ${guide}"; exit 1; }
            grep -q "/ratgeber/${guide}" /tmp/ratgeber.html || { echo "Heating guide missing from hub: ${guide}"; exit 1; }

            curl -sS --fail "$guide_url" -o "$guide_output"
            grep -q "$guide_url" "$guide_output" || { echo "Canonical missing: ${guide}"; exit 1; }
            grep -q '"@type":"Article"' "$guide_output" || { echo "Article schema missing: ${guide}"; exit 1; }
            grep -q '/kosten/heizung' "$guide_output" || { echo "Heating service link missing: ${guide}"; exit 1; }
            grep -q '/kosten/heizung/berlin' "$guide_output" || { echo "Heating Berlin link missing: ${guide}"; exit 1; }
            grep -q 'gewerk=heizung' "$guide_output" || { echo "Heating calculator service missing: ${guide}"; exit 1; }
            grep -q "leistung=${item}" "$guide_output" || { echo "Exact heating calculator item missing: ${guide} expected ${item}"; exit 1; }
            ! grep -qi 'noindex' "$guide_output"

            checked=$((checked + 1))
          done <<< "$mappings"

          test "$checked" -eq 5
          echo "Verified ${checked} exact heating price-item guide mappings"

      - name: Verify heating hourly-rate guide mapping
        shell: bash
        run: |
          set -euo pipefail

          item='heizungsinstallateur-stundensatz'
          item_url="https://baukostenradar.de/kosten/heizung/leistung/${item}"
          guide='handwerker-stundensaetze'
          guide_url="https://baukostenradar.de/ratgeber/${guide}"

          curl -sS --fail 'https://baukostenradar.de/sitemap.xml' -o /tmp/sitemap.xml
          curl -sS --fail 'https://baukostenradar.de/kosten/heizung' -o /tmp/heizung.html
          curl -sS --fail "$item_url" -o /tmp/heizung-rate-item.html
          curl -sS --fail "$guide_url" -o /tmp/rates-guide.html

          grep -q "${item_url}</loc>" /tmp/sitemap.xml
          grep -q "/kosten/heizung/leistung/${item}" /tmp/heizung.html
          grep -q 'Passender Ratgeber' /tmp/heizung-rate-item.html
          grep -q "/ratgeber/${guide}" /tmp/heizung-rate-item.html
          ! grep -qi 'noindex' /tmp/heizung-rate-item.html

          grep -q "${guide_url}</loc>" /tmp/sitemap.xml
          grep -q "$guide_url" /tmp/rates-guide.html
          grep -q '"@type":"Article"' /tmp/rates-guide.html
          ! grep -qi 'noindex' /tmp/rates-guide.html

      - name: Verify heating guide hub and internal-link silo
        shell: bash
        run: |
          set -euo pipefail

          curl -sS --fail 'https://baukostenradar.de/sitemap.xml' -o /tmp/sitemap.xml
          curl -sS --fail 'https://baukostenradar.de/ratgeber' -o /tmp/ratgeber.html

          guides=(
            heizung-erneuern-kosten
            fussbodenheizung-100-qm-kosten
            gasheizung-austauschen-kosten
            heizkoerper-montieren-kosten
            thermostat-installieren-kosten
            heizungswartung-kosten
          )

          for source in "${guides[@]}"; do
            guide_url="https://baukostenradar.de/ratgeber/${source}"
            grep -q "${guide_url}</loc>" /tmp/sitemap.xml || { echo "Heating cluster guide missing in sitemap: ${source}"; exit 1; }
            grep -q "/ratgeber/${source}" /tmp/ratgeber.html || { echo "Heating cluster guide missing from hub: ${source}"; exit 1; }

            curl -sS --fail "$guide_url" -o "/tmp/${source}.html"
            grep -q "$guide_url" "/tmp/${source}.html" || { echo "Canonical missing: ${source}"; exit 1; }
            grep -q '"@type":"Article"' "/tmp/${source}.html" || { echo "Article schema missing: ${source}"; exit 1; }
            ! grep -qi 'noindex' "/tmp/${source}.html"

            for target in "${guides[@]}"; do
              [ "$source" = "$target" ] && continue
              grep -q "/ratgeber/${target}" "/tmp/${source}.html" || { echo "${source} missing heating peer ${target}"; exit 1; }
            done
          done
