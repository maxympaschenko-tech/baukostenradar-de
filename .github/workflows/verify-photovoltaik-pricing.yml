name: Verify Photovoltaik pricing expansion

on:
  workflow_run:
    workflows: ["Deploy to Ukraine.com.ua"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-photovoltaik-pricing:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Photovoltaik production pages
        shell: bash
        run: |
          set -euo pipefail
          fetch_with_retry() {
            local url="$1" output="$2"
            for i in 1 2 3 4 5; do
              if curl -sS --fail --connect-timeout 10 --max-time 25 "$url" -o "$output"; then return 0; fi
              [[ "$i" == "5" ]] && return 1
              sleep 4
            done
          }
          fetch_with_retry 'https://baukostenradar.de/kosten/photovoltaik' /tmp/main.html
          fetch_with_retry 'https://baukostenradar.de/kosten/photovoltaik/muenchen' /tmp/city.html
          fetch_with_retry 'https://baukostenradar.de/quellen' /tmp/quellen.html
          fetch_with_retry 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml

      - name: Verify source-backed Photovoltaik data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from html.parser import HTMLParser

          class TextParser(HTMLParser):
              def __init__(self): super().__init__(); self.parts = []
              def handle_data(self, data):
                  value = data.strip()
                  if value: self.parts.append(value)

          def text(path):
              parser = TextParser()
              with open(path, encoding='utf-8') as handle: parser.feed(handle.read())
              return re.sub(r'\s+', ' ', ' '.join(parser.parts))

          main = text('/tmp/main.html')
          city = text('/tmp/city.html')
          quellen = text('/tmp/quellen.html')
          sitemap = open('/tmp/sitemap.xml', encoding='utf-8').read()

          expected_main = (
              '19 Preispositionen', '6 geprüfte Quellen',
              'PV-Anlage 4 kWp inkl. Montage',
              'PV-Anlage 20 kWp inkl. Installation',
              'PV-Anlage 25 kWp inkl. Installation',
              'PV-Anlage 5 kWp mit 5 kWh Speicher',
              'Stromspeicher 5 kWh', 'Stromspeicher 10 kWh', 'Stromspeicher 15 kWh',
              'PV-Wechselrichter Standard', 'Hybrid-Wechselrichter',
              'Smart Meter für PV-Anlage', 'Notstrom- oder Backup-Box',
              'PV-Speicher Full-Backup Ersatzstrom', 'Photovoltaik laufende Betriebskosten',
              'Energie-Experten - Photovoltaikanlage Kosten 2026',
              'Energie-Experten - Stromspeicher Preise 2026',
              'Energie-Experten - Wechselrichter Kosten 2026',
          )
          for needle in expected_main:
              if needle not in main: raise SystemExit(f'Missing Photovoltaik signal: {needle}')

          for needle in ('Photovoltaik Kosten in München 2026', 'PV-Anlage 20 kWp inkl. Installation', 'Stromspeicher 10 kWh', 'Hybrid-Wechselrichter', 'PV-Speicher Full-Backup Ersatzstrom'):
              if needle not in city: raise SystemExit(f'Missing München Photovoltaik signal: {needle}')

          for needle in ('Energie-Experten - Photovoltaikanlage Kosten 2026', 'Energie-Experten - Stromspeicher Preise 2026', 'Energie-Experten - Wechselrichter Kosten 2026'):
              if needle not in quellen: raise SystemExit(f'Missing Photovoltaik source: {needle}')

          for needle in ('/kosten/photovoltaik/leistung/pv-anlage-20-kwp-inkl-installation', '/kosten/photovoltaik/leistung/stromspeicher-10-kwh', '/kosten/photovoltaik/leistung/hybrid-wechselrichter'):
              if needle not in sitemap: raise SystemExit(f'Missing Photovoltaik URL: {needle}')
          PY
