name: Verify hosting workflow migration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-hosting-workflow-migration:
    name: Lightweight repository safeguards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject legacy deployment workflow references
        shell: bash
        run: |
          set -euo pipefail

          legacy='Deploy to Ukraine'
          legacy+='.com.ua'

          mapfile -t stale_files < <(
            grep -RIl --include='*.yml' --include='*.yaml' \
              "$legacy" .github/workflows || true
          )

          if (( ${#stale_files[@]} > 0 )); then
            echo 'Legacy Ukraine.com.ua deployment workflow references remain:' >&2
            printf ' - %s\n' "${stale_files[@]}" >&2
            exit 1
          fi

          echo 'All workflows are detached from the legacy Ukraine.com.ua deploy workflow.'

      - name: Verify unique Ratgeber slugs
        id: guide-check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-guide-link-integrity.mjs --duplicates-only 2>&1 | tee /tmp/guide-integrity.log

      - name: Upload guide integrity diagnostics
        if: ${{ steps.guide-check.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: guide-integrity-diagnostics
          path: /tmp/guide-integrity.log
          retention-days: 1

      - name: Fail on duplicate Ratgeber slugs
        if: ${{ steps.guide-check.outcome == 'failure' }}
        run: exit 1
