name: Verify expanded Sanitär guide cluster

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-sanitaer-guide-cluster:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hostinger-verifier

      - name: Verify exact Sanitär price-item guide mappings
        shell: bash
        run: |
          set -euo pipefail
          source scripts/hostinger-verify.sh

          fetch_hostinger 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch_hostinger 'https://baukostenradar.de/kosten/sanitaer' /tmp/sanitaer.html
          fetch_hostinger 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html

          mappings=$(cat <<'EOF'
          sanitaerobjekte-armaturen-fuer-8-m2-bad|sanitaerobjekte-bad-kosten
          demontage-entsorgung-altbad|bad-entkernen-kosten
          stand-wc-1-1-tauschen-inkl-keramik|wc-austauschen-kosten
          stand-wc-mit-neuem-aufputzspuelkasten-tauschen|wc-austauschen-kosten
          wand-wc-tauschen-bei-vorhandenem-vorwandelement|wc-austauschen-kosten
          dusch-wc-einbauen|dusch-wc-kosten
          bodengleiche-dusche-inkl-abdichtung-ablauf-und-verfliesung|bodengleiche-dusche-kosten
          klassische-duschwanne-komplett-einbauen|bodengleiche-dusche-kosten
          badewanne-durch-duschkabine-ersetzen-komplett|badewanne-durch-dusche-ersetzen-kosten
          sanitaer-anfahrt|sanitaer-anfahrt-kosten
          wasserhahn-montieren|wasserhahn-montieren-kosten
          wc-montieren|wc-austauschen-kosten
          spuelkasten-reparieren|spuelkasten-reparieren-kosten
          waschbecken-montieren|waschbecken-montieren-kosten
          dusche-einbauen|dusche-einbauen-kosten
          badewanne-einbauen|badewanne-einbauen-kosten
          rohrverstopfung-beseitigen|rohrverstopfung-beseitigen-kosten
          haenge-wc-modern-inkl-montage|wc-austauschen-kosten
          waschtisch-armatur-inkl-montage|wasserhahn-montieren-kosten
          EOF
          )

          checked=0
          while IFS='|' read -r item guide; do
            item="${item#${item%%[![:space:]]*}}"
            [ -n "$item" ] || continue
            item_url="https://baukostenradar.de/kosten/sanitaer/leistung/${item}"
            guide_url="https://baukostenradar.de/ratgeber/${guide}"
            item_output="/tmp/sanitaer-item-${item}.html"
            guide_output="/tmp/sanitaer-guide-${guide}.html"

            grep -q "${item_url}</loc>" /tmp/sitemap.xml || { echo "Sanitär item missing in sitemap: ${item}"; exit 1; }
            grep -q "/kosten/sanitaer/leistung/${item}" /tmp/sanitaer.html || { echo "Sanitär item missing on category: ${item}"; exit 1; }
            fetch_hostinger "$item_url" "$item_output"
            grep -q 'Passender Ratgeber\|id="ratgeber"' "$item_output" || { echo "Ratgeber block missing: ${item}"; exit 1; }
            grep -q "/ratgeber/${guide}" "$item_output" || { echo "Wrong Sanitär mapping: ${item} -> ${guide}"; exit 1; }
            ! grep -qi 'noindex' "$item_output"

            grep -q "${guide_url}</loc>" /tmp/sitemap.xml || { echo "Sanitär guide missing in sitemap: ${guide}"; exit 1; }
            grep -q "/ratgeber/${guide}" /tmp/ratgeber.html || { echo "Sanitär guide missing from hub: ${guide}"; exit 1; }
            fetch_hostinger "$guide_url" "$guide_output"
            grep -q "$guide_url" "$guide_output"
            grep -q '"@type":"Article"' "$guide_output"
            grep -q '/kosten/sanitaer' "$guide_output"
            ! grep -qi 'noindex' "$guide_output"
            checked=$((checked + 1))
          done <<< "$mappings"

          test "$checked" -eq 19
          echo "Verified ${checked} Sanitär price-item guide mappings"

      - name: Verify 14-guide Sanitär peer silo
        shell: bash
        run: |
          set -euo pipefail
          source scripts/hostinger-verify.sh

          fetch_hostinger 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch_hostinger 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html

          guides=(
            sanitaer-kosten
            sanitaer-anfahrt-kosten
            wasserhahn-montieren-kosten
            waschbecken-montieren-kosten
            wc-austauschen-kosten
            spuelkasten-reparieren-kosten
            dusch-wc-kosten
            dusche-einbauen-kosten
            bodengleiche-dusche-kosten
            badewanne-einbauen-kosten
            badewanne-durch-dusche-ersetzen-kosten
            rohrverstopfung-beseitigen-kosten
            sanitaerobjekte-bad-kosten
            bad-entkernen-kosten
          )

          for source in "${guides[@]}"; do
            guide_url="https://baukostenradar.de/ratgeber/${source}"
            output="/tmp/sanitaer-silo-${source}.html"
            grep -q "${guide_url}</loc>" /tmp/sitemap.xml || { echo "Sanitär guide missing in sitemap: ${source}"; exit 1; }
            grep -q "/ratgeber/${source}" /tmp/ratgeber.html || { echo "Sanitär guide missing from hub: ${source}"; exit 1; }
            fetch_hostinger "$guide_url" "$output"
            grep -q "$guide_url" "$output"
            grep -q '"@type":"Article"' "$output"
            ! grep -qi 'noindex' "$output"

            for target in "${guides[@]}"; do
              [ "$source" = "$target" ] && continue
              grep -q "/ratgeber/${target}" "$output" || { echo "${source} missing Sanitär peer ${target}"; exit 1; }
            done
          done

          echo "Verified 14-guide Sanitär peer-link silo"

      - name: Verify exact calculators on new Sanitär guides
        shell: bash
        run: |
          set -euo pipefail
          source scripts/hostinger-verify.sh

          checks=$(cat <<'EOF'
          sanitaer-anfahrt-kosten|sanitaer-anfahrt
          wasserhahn-montieren-kosten|wasserhahn-montieren
          spuelkasten-reparieren-kosten|spuelkasten-reparieren
          waschbecken-montieren-kosten|waschbecken-montieren
          dusche-einbauen-kosten|dusche-einbauen
          badewanne-einbauen-kosten|badewanne-einbauen
          rohrverstopfung-beseitigen-kosten|rohrverstopfung-beseitigen
          EOF
          )

          while IFS='|' read -r guide item; do
            [ -n "$guide" ] || continue
            output="/tmp/sanitaer-calculator-${guide}.html"
            fetch_hostinger "https://baukostenradar.de/ratgeber/${guide}" "$output"
            grep -q 'gewerk=sanitaer' "$output" || { echo "Sanitär calculator service missing: ${guide}"; exit 1; }
            grep -q "leistung=${item}" "$output" || { echo "Exact Sanitär calculator missing: ${guide} -> ${item}"; exit 1; }
            grep -q "/kosten/sanitaer/leistung/${item}" "$output" || { echo "Sanitär price-detail missing: ${guide}"; exit 1; }
          done <<< "$checks"

          grep -q '/kosten/sanitaer/leistung/waschtisch-armatur-inkl-montage' /tmp/sanitaer-calculator-wasserhahn-montieren-kosten.html
          grep -q '/ratgeber/bodengleiche-dusche-kosten' /tmp/sanitaer-calculator-dusche-einbauen-kosten.html

          echo "Verified 7 new Sanitär calculator presets and scope links"
