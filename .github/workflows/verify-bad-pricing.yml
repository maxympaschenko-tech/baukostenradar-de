name: Verify Bad pricing expansion

on:
  workflow_run:
    workflows: ["Deploy to Ukraine.com.ua"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-bad-pricing:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Bad pages and source catalog
        shell: bash
        run: |
          set -euo pipefail

          fetch_with_retry() {
            local url="$1"
            local output="$2"
            for i in 1 2 3 4 5; do
              if curl -sS --fail --connect-timeout 10 --max-time 25 "$url" -o "$output"; then
                return 0
              fi
              if [[ "$i" == "5" ]]; then
                return 1
              fi
              sleep 4
            done
          }

          fetch_with_retry 'https://baukostenradar.de/kosten/badsanierung' /tmp/bad.html
          fetch_with_retry 'https://baukostenradar.de/kosten/badsanierung/muenchen' /tmp/bad-muenchen.html
          fetch_with_retry 'https://baukostenradar.de/quellen' /tmp/quellen.html
          fetch_with_retry 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml

      - name: Verify expanded source-backed Bad data
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import re
          from html.parser import HTMLParser

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []

              def handle_data(self, data):
                  value = data.strip()
                  if value:
                      self.parts.append(value)

          def text(path):
              parser = TextParser()
              with open(path, encoding='utf-8') as handle:
                  parser.feed(handle.read())
              return re.sub(r'\s+', ' ', ' '.join(parser.parts))

          bad = text('/tmp/bad.html')
          muenchen = text('/tmp/bad-muenchen.html')
          quellen = text('/tmp/quellen.html')
          with open('/tmp/sitemap.xml', encoding='utf-8') as handle:
              sitemap = handle.read()

          expected_main = (
              '14 Preispositionen',
              '4 geprüfte Quellen',
              'Bad-Teilsanierung',
              'Demontage & Entsorgung altes Bad',
              'Rohinstallation Wasser & Elektro',
              'Trockenbau & Vorwandelemente',
              'Sanitärobjekte WC, Dusche & Waschtisch',
              'Badezimmer abdichten',
              'Waschtisch inkl. Anschluss',
              'Hänge-WC modern inkl. Montage',
              'Ebenerdige Dusche / Walk-in',
              'Badewanne austauschen',
              'Aroundhome - Badsanierung Preise 2026',
          )
          for needle in expected_main:
              if needle not in bad:
                  raise SystemExit(f'Missing Bad production signal: {needle}')

          expected_city = (
              'Badsanierung Kosten in München 2026',
              'Bad-Teilsanierung',
              'Rohinstallation Wasser & Elektro',
              'Badezimmer abdichten',
              'Ebenerdige Dusche / Walk-in',
              'Badewanne austauschen',
          )
          for needle in expected_city:
              if needle not in muenchen:
                  raise SystemExit(f'Missing München Bad production signal: {needle}')

          if 'Aroundhome - Badsanierung Preise 2026' not in quellen:
              raise SystemExit('Missing Bad source in central source catalog')

          sitemap_needles = (
              '/kosten/badsanierung/leistung/bad-teilsanierung',
              '/kosten/badsanierung/leistung/badezimmer-abdichten',
              '/kosten/badsanierung/leistung/ebenerdige-dusche-walk-in',
              '/kosten/badsanierung/leistung/badewanne-austauschen',
          )
          for needle in sitemap_needles:
              if needle not in sitemap:
                  raise SystemExit(f'Missing Bad detail URL in sitemap: {needle}')
          PY
