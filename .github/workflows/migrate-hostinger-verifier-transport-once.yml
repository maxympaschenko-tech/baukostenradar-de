name: One-off migrate Hostinger verifier transport

on:
  push:
    branches:
      - ci/finish-live-fetch-migration-2
    paths:
      - 'scripts/migrate-hostinger-verifier-transport.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/finish-live-fetch-migration-2
          fetch-depth: 0

      - name: Apply mechanical transport setup
        run: python3 scripts/migrate-hostinger-verifier-transport.py

      - name: Validate generated workflow diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          changed=$(git diff --name-only -- '.github/workflows/*.yml' '.github/workflows/*.yaml' | wc -l | tr -d ' ')
          echo "Migrated workflow files: ${changed}"
          test "$changed" -ge 1

      - name: Store generated workflow blobs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p tmp
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          files = subprocess.check_output(
              ["git", "diff", "--name-only", "--", ".github/workflows/*.yml", ".github/workflows/*.yaml"],
              text=True,
          ).splitlines()
          if not files:
              raise SystemExit("No generated workflow files found")

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          manifest = []
          for path in files:
              raw = Path(path).read_bytes()
              payload = json.dumps({
                  "content": base64.b64encode(raw).decode("ascii"),
                  "encoding": "base64",
              }).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs",
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request) as response:
                  result = json.load(response)
              manifest.append({"path": path, "sha": result["sha"]})
              print(f"Stored {path} -> {result['sha']}")

          Path("tmp/hostinger-verifier-blobs.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Stored {len(manifest)} workflow blobs")
          PY

      - name: Commit blob manifest only
        shell: bash
        run: |
          set -euo pipefail
          git restore .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/hostinger-verifier-blobs.json
          git commit -m 'Store generated Hostinger verifier blob manifest'
          git push origin HEAD:ci/finish-live-fetch-migration-2
