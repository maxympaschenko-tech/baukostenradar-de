name: Verify Abriss guide cluster

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-abriss-guide-cluster:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact Abriss price-item guide mappings
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 45 "$1" -o "$2"
          }

          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/kosten/abriss-entsorgung' /tmp/abriss.html
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html

          ! grep -qi 'noindex' /tmp/abriss.html

          mappings=$(cat <<'EOF'
          einfamilienhaus-komplett-abreissen|haus-abreissen-kosten
          abbruch-nach-umbautem-raum|abbruch-kosten-pro-m3
          innenabbruch-einfamilienhaus|innenabbruch-einfamilienhaus-kosten
          industriehalle-abbrechen|industriehalle-abbrechen-kosten-pro-qm
          bauschuttcontainer-30-m3|bauschuttcontainer-30-m3-kosten
          EOF
          )

          checked=0
          while IFS='|' read -r item guide; do
            item="${item#${item%%[![:space:]]*}}"
            [ -n "$item" ] || continue

            item_url="https://baukostenradar.de/kosten/abriss-entsorgung/leistung/${item}"
            guide_url="https://baukostenradar.de/ratgeber/${guide}"
            item_output="/tmp/abriss-item-${item}.html"
            guide_output="/tmp/abriss-guide-${guide}.html"

            grep -q "${item_url}</loc>" /tmp/sitemap.xml || { echo "Abriss item missing in sitemap: ${item}"; exit 1; }
            grep -q "/kosten/abriss-entsorgung/leistung/${item}" /tmp/abriss.html || { echo "Abriss item missing on category: ${item}"; exit 1; }

            fetch "$item_url" "$item_output"
            grep -q 'Passender Ratgeber' "$item_output"
            grep -q "/ratgeber/${guide}" "$item_output" || { echo "Wrong Abriss guide mapping: ${item} -> ${guide}"; exit 1; }
            ! grep -qi 'noindex' "$item_output"

            grep -q "${guide_url}</loc>" /tmp/sitemap.xml
            grep -q "/ratgeber/${guide}" /tmp/ratgeber.html

            fetch "$guide_url" "$guide_output"
            grep -q "$guide_url" "$guide_output"
            grep -q '"@type":"Article"' "$guide_output"
            grep -q '/kosten/abriss-entsorgung' "$guide_output"
            grep -q '/kosten/abriss-entsorgung/berlin' "$guide_output"
            grep -q 'gewerk=abriss-entsorgung' "$guide_output"
            grep -q "leistung=${item}" "$guide_output"
            ! grep -qi 'noindex' "$guide_output"

            checked=$((checked + 1))
          done <<< "$mappings"

          test "$checked" -eq 5
          echo "Verified ${checked} exact Abriss price-item guide mappings"

      - name: Verify full Abriss hub and peer-link silo
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 45 "$1" -o "$2"
          }

          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html

          guides=(
            haus-abreissen-kosten
            abbruch-kosten-pro-m3
            innenabbruch-einfamilienhaus-kosten
            industriehalle-abbrechen-kosten-pro-qm
            bauschuttcontainer-30-m3-kosten
          )

          for source in "${guides[@]}"; do
            guide_url="https://baukostenradar.de/ratgeber/${source}"
            grep -q "${guide_url}</loc>" /tmp/sitemap.xml || { echo "Abriss guide missing in sitemap: ${source}"; exit 1; }
            grep -q "/ratgeber/${source}" /tmp/ratgeber.html || { echo "Abriss guide missing from hub: ${source}"; exit 1; }

            fetch "$guide_url" "/tmp/${source}.html"
            grep -q "$guide_url" "/tmp/${source}.html"
            grep -q '"@type":"Article"' "/tmp/${source}.html"
            ! grep -qi 'noindex' "/tmp/${source}.html"

            for target in "${guides[@]}"; do
              [ "$source" = "$target" ] && continue
              grep -q "/ratgeber/${target}" "/tmp/${source}.html" || { echo "${source} missing Abriss peer ${target}"; exit 1; }
            done
          done

          echo "Verified Abriss hub visibility and full five-guide peer-link silo"
