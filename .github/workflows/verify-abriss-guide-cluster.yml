name: Verify expanded Abriss guide cluster

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-abriss-guide-cluster:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hostinger-verifier

      - name: Verify 15 Abriss price-item guide mappings
        shell: bash
        run: |
          set -euo pipefail

          curl -sS --fail 'https://baukostenradar.de/sitemap.xml' -o /tmp/sitemap.xml
          curl -sS --fail 'https://baukostenradar.de/kosten/abriss-entsorgung' -o /tmp/abriss.html
          curl -sS --fail 'https://baukostenradar.de/ratgeber' -o /tmp/ratgeber.html
          ! grep -qi 'noindex' /tmp/abriss.html

          mappings=$(cat <<'EOF'
          einfamilienhaus-komplett-abreissen|haus-abreissen-kosten|einfamilienhaus-komplett-abreissen
          abbruch-nach-umbautem-raum|abbruch-kosten-pro-m3|abbruch-nach-umbautem-raum
          innenabbruch-einfamilienhaus|innenabbruch-einfamilienhaus-kosten|innenabbruch-einfamilienhaus
          industriehalle-abbrechen|industriehalle-abbrechen-kosten-pro-qm|industriehalle-abbrechen
          bauschuttcontainer-30-m3|bauschuttcontainer-30-m3-kosten|bauschuttcontainer-30-m3
          hausabriss-standard-je-quadratmeter|haus-abreissen-kosten|einfamilienhaus-komplett-abreissen
          hausabriss-mit-keller|haus-abreissen-kosten|einfamilienhaus-komplett-abreissen
          hausabriss-mit-schadstoffbelastung|haus-abreissen-kosten|einfamilienhaus-komplett-abreissen
          entkernung-und-vorarbeiten|innenabbruch-einfamilienhaus-kosten|innenabbruch-einfamilienhaus
          schadstoffgutachten-vor-abriss|haus-abreissen-kosten|einfamilienhaus-komplett-abreissen
          abrissgenehmigung-oder-anzeige|haus-abreissen-kosten|einfamilienhaus-komplett-abreissen
          bauschutt-entsorgen|bauschutt-entsorgen-kosten|bauschutt-entsorgen
          bauschuttcontainer-5-kubikmeter-komplett|bauschutt-entsorgen-kosten|bauschutt-entsorgen
          baumischabfallcontainer-5-kubikmeter-komplett|bauschutt-entsorgen-kosten|bauschutt-entsorgen
          bauabfall-kombisack-1-kubikmeter|bauschutt-entsorgen-kosten|bauschutt-entsorgen
          EOF
          )

          checked=0
          while IFS='|' read -r item guide calculator_item; do
            item="${item#${item%%[![:space:]]*}}"
            [ -n "$item" ] || continue

            item_url="https://baukostenradar.de/kosten/abriss-entsorgung/leistung/${item}"
            guide_url="https://baukostenradar.de/ratgeber/${guide}"
            item_output="/tmp/abriss-item-${item}.html"
            guide_output="/tmp/abriss-guide-${guide}.html"

            grep -q "${item_url}</loc>" /tmp/sitemap.xml || { echo "Abriss item missing in sitemap: ${item}"; exit 1; }
            grep -q "/kosten/abriss-entsorgung/leistung/${item}" /tmp/abriss.html || { echo "Abriss item missing on category: ${item}"; exit 1; }

            curl -sS --fail "$item_url" -o "$item_output"
            grep -q 'Passender Ratgeber' "$item_output" || { echo "Ratgeber block missing: ${item}"; exit 1; }
            grep -q "/ratgeber/${guide}" "$item_output" || { echo "Wrong Abriss guide mapping: ${item} -> ${guide}"; exit 1; }
            ! grep -qi 'noindex' "$item_output"

            grep -q "${guide_url}</loc>" /tmp/sitemap.xml || { echo "Abriss guide missing in sitemap: ${guide}"; exit 1; }
            grep -q "/ratgeber/${guide}" /tmp/ratgeber.html || { echo "Abriss guide missing from hub: ${guide}"; exit 1; }

            curl -sS --fail "$guide_url" -o "$guide_output"
            grep -q "$guide_url" "$guide_output" || { echo "Canonical missing: ${guide}"; exit 1; }
            grep -q '"@type":"Article"' "$guide_output" || { echo "Article schema missing: ${guide}"; exit 1; }
            grep -q '/kosten/abriss-entsorgung' "$guide_output" || { echo "Abriss service link missing: ${guide}"; exit 1; }
            grep -q '/kosten/abriss-entsorgung/berlin' "$guide_output" || { echo "Abriss Berlin link missing: ${guide}"; exit 1; }
            grep -q 'gewerk=abriss-entsorgung' "$guide_output" || { echo "Abriss calculator missing: ${guide}"; exit 1; }
            grep -q "leistung=${calculator_item}" "$guide_output" || { echo "Primary calculator item missing: ${guide} expected ${calculator_item}"; exit 1; }
            ! grep -qi 'noindex' "$guide_output"

            checked=$((checked + 1))
          done <<< "$mappings"

          test "$checked" -eq 15
          echo "Verified ${checked} Abriss price-item guide mappings"

      - name: Verify six-guide Abriss peer silo
        shell: bash
        run: |
          set -euo pipefail

          guides=(
            haus-abreissen-kosten
            abbruch-kosten-pro-m3
            innenabbruch-einfamilienhaus-kosten
            industriehalle-abbrechen-kosten-pro-qm
            bauschuttcontainer-30-m3-kosten
            bauschutt-entsorgen-kosten
          )

          for source in "${guides[@]}"; do
            curl -sS --fail "https://baukostenradar.de/ratgeber/${source}" -o "/tmp/abriss-silo-${source}.html"
            grep -q '"@type":"Article"' "/tmp/abriss-silo-${source}.html"
            ! grep -qi 'noindex' "/tmp/abriss-silo-${source}.html"

            for target in "${guides[@]}"; do
              [ "$source" = "$target" ] && continue
              grep -q "/ratgeber/${target}" "/tmp/abriss-silo-${source}.html" || { echo "${source} missing Abriss peer ${target}"; exit 1; }
            done
          done

          test "${#guides[@]}" -eq 6
          echo "Verified six-guide Abriss peer silo"

      - name: Verify new Abriss price-detail coverage
        shell: bash
        run: |
          set -euo pipefail

          curl -sS --fail 'https://baukostenradar.de/ratgeber/bauschutt-entsorgen-kosten' -o /tmp/bauschutt-guide.html
          for item in \
            bauschutt-entsorgen \
            bauschuttcontainer-5-kubikmeter-komplett \
            baumischabfallcontainer-5-kubikmeter-komplett \
            bauabfall-kombisack-1-kubikmeter; do
            grep -q "/kosten/abriss-entsorgung/leistung/${item}" /tmp/bauschutt-guide.html || { echo "Bauschutt guide missing price detail ${item}"; exit 1; }
          done

          curl -sS --fail 'https://baukostenradar.de/ratgeber/haus-abreissen-kosten' -o /tmp/hausabriss-guide.html
          for item in \
            hausabriss-standard-je-quadratmeter \
            hausabriss-mit-keller \
            hausabriss-mit-schadstoffbelastung \
            schadstoffgutachten-vor-abriss \
            abrissgenehmigung-oder-anzeige; do
            grep -q "/kosten/abriss-entsorgung/leistung/${item}" /tmp/hausabriss-guide.html || { echo "Hausabriss guide missing price detail ${item}"; exit 1; }
          done

          curl -sS --fail 'https://baukostenradar.de/ratgeber/innenabbruch-einfamilienhaus-kosten' -o /tmp/innenabbruch-guide.html
          grep -q '/kosten/abriss-entsorgung/leistung/entkernung-und-vorarbeiten' /tmp/innenabbruch-guide.html
          echo "Verified new Abriss price-detail links"
