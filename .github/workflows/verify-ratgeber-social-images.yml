name: Verify Ratgeber social images

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-ratgeber-social-images:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hostinger-verifier
      - name: Fetch representative guide pages
        shell: bash
        run: |
          set -euo pipefail

          fetch_with_retry() {
            local url="$1"
            local output="$2"
            for i in 1 2 3 4 5; do
              if curl -sS --fail --connect-timeout 10 --max-time 30 "$url" -o "$output"; then
                return 0
              fi
              if [[ "$i" == "5" ]]; then
                return 1
              fi
              sleep 4
            done
          }

          fetch_with_retry 'https://baukostenradar.de/ratgeber/sanierungskosten-pro-qm' /tmp/guide-a.html
          fetch_with_retry 'https://baukostenradar.de/ratgeber/bad-komplett-sanieren-kosten' /tmp/guide-b.html

      - name: Extract social image URLs
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from html.parser import HTMLParser

          class MetaParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.values = {}

              def handle_starttag(self, tag, attrs):
                  if tag != "meta":
                      return
                  data = dict(attrs)
                  key = data.get("property") or data.get("name")
                  if key and data.get("content"):
                      self.values[key] = data["content"]

          for label in ("a", "b"):
              parser = MetaParser()
              with open(f"/tmp/guide-{label}.html", encoding="utf-8") as handle:
                  parser.feed(handle.read())

              for key in ("og:image", "twitter:image"):
                  if key not in parser.values:
                      raise SystemExit(f"Missing {key} on guide {label}")
                  value = parser.values[key]
                  if not value.startswith("https://baukostenradar.de/"):
                      raise SystemExit(f"Unexpected {key} host on guide {label}: {value}")
                  filename = key.replace(":", "-")
                  with open(f"/tmp/{label}-{filename}-url.txt", "w", encoding="utf-8") as handle:
                      handle.write(value)
          PY

          test "$(cat /tmp/a-og-image-url.txt)" != "$(cat /tmp/b-og-image-url.txt)"
          test "$(cat /tmp/a-twitter-image-url.txt)" != "$(cat /tmp/b-twitter-image-url.txt)"

      - name: Verify representative page-specific PNG output
        shell: bash
        run: |
          set -euo pipefail

          fetch_image() {
            local url="$1"
            local prefix="$2"

            # Intentionally bypass the Hostinger verifier curl wrapper here.
            # Dynamic Next.js social-image routes should reuse their normal cache
            # instead of receiving a fresh ci_verify cache-buster on every PNG GET.
            /usr/bin/curl -q -sS --fail --location \
              --retry 5 --retry-delay 7 --retry-all-errors \
              --connect-timeout 15 --max-time 60 \
              -H 'User-Agent: BauKostenRadar-Production-Verify/1.0' \
              -D "${prefix}.headers" "$url" -o "${prefix}.png"

            grep -qi '^content-type: image/png' "${prefix}.headers"
            test "$(wc -c < "${prefix}.png")" -gt 10000
          }

          # Exercise both Next.js image route types while generating only two
          # full PNGs: OG from guide A and Twitter from a different guide B.
          fetch_image "$(cat /tmp/a-og-image-url.txt)" /tmp/guide-a-og
          sleep 5
          fetch_image "$(cat /tmp/b-twitter-image-url.txt)" /tmp/guide-b-twitter

          guide_a_sha=$(sha256sum /tmp/guide-a-og.png | awk '{print $1}')
          guide_b_sha=$(sha256sum /tmp/guide-b-twitter.png | awk '{print $1}')

          echo "Guide A OG SHA: $guide_a_sha"
          echo "Guide B Twitter SHA: $guide_b_sha"

          test "$guide_a_sha" != "$guide_b_sha"
