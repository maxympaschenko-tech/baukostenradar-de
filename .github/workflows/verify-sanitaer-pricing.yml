name: Verify Sanitär pricing expansion

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-sanitaer-pricing:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Sanitär production pages
        shell: bash
        run: |
          set -euo pipefail
          source scripts/hostinger-verify.sh

          fetch_hostinger 'https://baukostenradar.de/kosten/sanitaer' /tmp/main.html
          fetch_hostinger 'https://baukostenradar.de/kosten/sanitaer/muenchen' /tmp/city.html
          fetch_hostinger 'https://baukostenradar.de/quellen' /tmp/quellen.html
          fetch_hostinger 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml

      - name: Verify source-backed Sanitär data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from html.parser import HTMLParser

          class TextParser(HTMLParser):
              def __init__(self): super().__init__(); self.parts = []
              def handle_data(self, data):
                  value = data.strip()
                  if value: self.parts.append(value)

          def text(path):
              parser = TextParser()
              with open(path, encoding='utf-8') as handle: parser.feed(handle.read())
              return re.sub(r'\s+', ' ', ' '.join(parser.parts))

          main = text('/tmp/main.html')
          city = text('/tmp/city.html')
          quellen = text('/tmp/quellen.html')
          sitemap = open('/tmp/sitemap.xml', encoding='utf-8').read()

          expected_main = (
              '23 Preispositionen', '7 geprüfte Quellen',
              'Stand-WC 1:1 tauschen inkl. Keramik',
              'Stand-WC mit neuem Aufputzspülkasten tauschen',
              'Wand-WC tauschen bei vorhandenem Vorwandelement',
              'Dusch-WC einbauen',
              'Bodengleiche Dusche inkl. Abdichtung Ablauf und Verfliesung',
              'Klassische Duschwanne komplett einbauen',
              'Badewanne durch Duschkabine ersetzen komplett',
              'WC oder Dusche versetzen mit neuer Leitungsführung',
          )
          for needle in expected_main:
              if needle not in main: raise SystemExit(f'Missing Sanitär signal: {needle}')

          for needle in ('Sanitär Kosten in München 2026', 'Dusch-WC einbauen', 'Bodengleiche Dusche inkl. Abdichtung Ablauf und Verfliesung', 'WC oder Dusche versetzen mit neuer Leitungsführung'):
              if needle not in city: raise SystemExit(f'Missing München Sanitär signal: {needle}')

          for needle in ('Blauarbeit - Toilette einbauen Kosten 2026', 'Blauarbeit - Bad, Küche & Sanitär 2026', 'MyHammer - Duschkabine einbauen Kosten 2026'):
              if needle not in quellen: raise SystemExit(f'Missing Sanitär source: {needle}')

          for needle in (
              '/kosten/sanitaer/leistung/dusch-wc-einbauen',
              '/kosten/sanitaer/leistung/bodengleiche-dusche-inkl-abdichtung-ablauf-und-verfliesung',
              '/kosten/sanitaer/leistung/wc-oder-dusche-versetzen-mit-neuer-leitungsfuehrung',
          ):
              if needle not in sitemap: raise SystemExit(f'Missing Sanitär URL: {needle}')
          PY
