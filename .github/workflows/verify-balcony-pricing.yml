name: Verify Balkon pricing and guide cluster

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-balcony-cluster:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure resilient live fetches
        shell: bash
        run: |
          cat > ~/.curlrc <<'EOF'
          retry = 6
          retry-all-errors
          retry-delay = 5
          connect-timeout = 10
          max-time = 30
          EOF

      - name: Fetch Balkon production pages
        shell: bash
        run: |
          set -euo pipefail
          fetch_until_contains() {
            local base_url="$1" output="$2" needle="$3" label="$4"
            for attempt in 1 2 3 4 5 6; do
              if curl -sSL --fail -H 'Cache-Control: no-cache' \
                "${base_url}?verify=${GITHUB_SHA}-${attempt}" -o "$output"; then
                if grep -Fq "$needle" "$output"; then
                  return 0
                fi
              fi
              if [ "$attempt" -eq 6 ]; then
                echo "MISSING after retries: $label" >&2
                echo "Expected in $output: $needle" >&2
                return 1
              fi
              sleep 10
            done
          }

          curl -sSL --fail 'https://baukostenradar.de/kosten/balkon' -o /tmp/balkon.html
          curl -sSL --fail 'https://baukostenradar.de/kosten/balkon/berlin' -o /tmp/balkon-berlin.html
          fetch_until_contains \
            'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html \
            '/ratgeber/balkon-sanieren-kosten-pro-qm' 'Balkon guide directory'
          fetch_until_contains \
            'https://baukostenradar.de/quellen' /tmp/quellen.html \
            'Clean Invoice - Balkon sanieren Kosten 2026' 'Balkon source directory'
          curl -sSL --fail 'https://baukostenradar.de/sitemap.xml' -o /tmp/sitemap.xml

      - name: Verify Balkon category, city and sources
        shell: bash
        run: |
          set -euo pipefail
          require_contains() {
            local file="$1"; local needle="$2"; local label="$3"
            if ! grep -Fq "$needle" "$file"; then
              echo "MISSING: $label" >&2
              echo "Expected in $file: $needle" >&2
              exit 1
            fi
          }
          for needle in \
            'Balkonsanierung komplett inkl. Betonsanierung' \
            'Balkonabdichtung Flüssigkunststoff komplett' \
            'Balkon oder Terrasse fliesen inkl. Material' \
            'Balkongeländer Aluminium inkl. Montage' \
            'Balkongeländer Edelstahl inkl. Montage' \
            'Balkongeländer Glas inkl. Montage'; do
            require_contains /tmp/balkon.html "$needle" "Balkon category item: $needle"
          done
          require_contains /tmp/balkon-berlin.html 'Balkon' 'Berlin Balkon city page'
          require_contains /tmp/quellen.html 'Clean Invoice - Balkon sanieren Kosten 2026' 'Clean Invoice Balkon source'
          require_contains /tmp/quellen.html 'MyHammer - Balkon abdichten Kosten 2026' 'MyHammer Balkon source'
          require_contains /tmp/quellen.html 'Blauarbeit - Balkon und Terrasse fliesen Kosten 2026' 'Blauarbeit Balkon source'
          if grep -qi 'noindex' /tmp/balkon.html; then
            echo 'UNEXPECTED NOINDEX: Balkon category' >&2
            exit 1
          fi

      - name: Verify Balkon guides and mappings
        shell: bash
        run: |
          set -euo pipefail
          require_contains() {
            local file="$1"; local needle="$2"; local label="$3"
            if ! grep -Fq "$needle" "$file"; then
              echo "MISSING: $label" >&2
              echo "Expected in $file: $needle" >&2
              exit 1
            fi
          }
          check_guide() {
            local slug="$1"; local item="$2"
            local output="/tmp/${slug}.html"
            local url="https://baukostenradar.de/ratgeber/${slug}"
            require_contains /tmp/sitemap.xml "${url}</loc>" "guide sitemap URL $slug"
            require_contains /tmp/ratgeber.html "/ratgeber/${slug}" "guide hub link $slug"
            curl -sSL --fail "$url" -o "$output"
            require_contains "$output" "$url" "canonical $slug"
            require_contains "$output" '"@type":"Article"' "Article schema $slug"
            require_contains "$output" 'FAQPage' "FAQ schema $slug"
            require_contains "$output" '/kosten/balkon' "Balkon service link $slug"
            require_contains "$output" 'gewerk=balkon' "calculator service preset $slug"
            require_contains "$output" "leistung=${item}" "calculator item preset $slug"
            if grep -qi 'noindex' "$output"; then
              echo "UNEXPECTED NOINDEX: $slug" >&2
              exit 1
            fi
          }
          check_guide 'balkon-sanieren-kosten-pro-qm' 'balkonsanierung-komplett-inkl-betonsanierung'
          check_guide 'balkon-abdichten-kosten-pro-qm' 'balkonabdichtung-fluessigkunststoff-komplett'
          check_guide 'balkon-fliesen-kosten-pro-qm' 'balkon-oder-terrasse-fliesen-inkl-material'
          check_guide 'balkongelaender-kosten-pro-meter' 'balkongelaender-aluminium-inkl-montage'

      - name: Verify price-detail links and sitemap expansion
        shell: bash
        run: |
          set -euo pipefail
          check_item() {
            local item="$1"; local guide="$2"
            local url="https://baukostenradar.de/kosten/balkon/leistung/${item}"
            local output="/tmp/${item}.html"
            grep -Fq "${url}</loc>" /tmp/sitemap.xml || { echo "Missing price URL in sitemap: $item" >&2; exit 1; }
            curl -sSL --fail "$url" -o "$output"
            grep -Fq 'Passender Ratgeber' "$output" || { echo "Missing guide CTA: $item" >&2; exit 1; }
            grep -Fq "/ratgeber/${guide}" "$output" || { echo "Wrong guide mapping: $item -> $guide" >&2; exit 1; }
            if grep -qi 'noindex' "$output"; then
              echo "UNEXPECTED NOINDEX: $item" >&2
              exit 1
            fi
          }
          grep -Fq 'https://baukostenradar.de/kosten/balkon</loc>' /tmp/sitemap.xml
          grep -Fq 'https://baukostenradar.de/kosten/balkon/berlin</loc>' /tmp/sitemap.xml
          check_item 'balkonsanierung-komplett-inkl-betonsanierung' 'balkon-sanieren-kosten-pro-qm'
          check_item 'balkonabdichtung-fluessigkunststoff-komplett' 'balkon-abdichten-kosten-pro-qm'
          check_item 'balkon-oder-terrasse-fliesen-inkl-material' 'balkon-fliesen-kosten-pro-qm'
          check_item 'balkongelaender-aluminium-inkl-montage' 'balkongelaender-kosten-pro-meter'
