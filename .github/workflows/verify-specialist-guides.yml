name: Verify specialist guides

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-specialist-guides:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify all specialist guides are indexed
        shell: bash
        run: |
          set -euo pipefail
          source scripts/hostinger-verify.sh

          guides=(
            maler-kosten-pro-qm
            fliesenleger-kosten-pro-qm
            bodenleger-kosten-pro-qm
            trockenbau-kosten-pro-qm
            sanitaer-kosten
            luft-wasser-waermepumpe-kosten
            photovoltaik-kosten-2026
            daemmung-kosten-pro-qm
            fassade-sanieren-kosten
            garten-anlegen-kosten
            zaun-bauen-kosten-pro-meter
          )

          fetch_hostinger 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          total=$(grep -oE 'https://baukostenradar.de/ratgeber/[a-z0-9-]+</loc>' /tmp/sitemap.xml | sort -u | wc -l | tr -d ' ')
          echo "Indexed guides: ${total}"
          test "$total" -ge 38

          for guide in "${guides[@]}"; do
            grep -q "https://baukostenradar.de/ratgeber/${guide}</loc>" /tmp/sitemap.xml || { echo "Specialist guide missing from sitemap: ${guide}"; exit 1; }
            output="/tmp/guide-${guide}.html"
            fetch_hostinger "https://baukostenradar.de/ratgeber/${guide}" "$output"
            grep -q "https://baukostenradar.de/ratgeber/${guide}" "$output" || { echo "Canonical guide URL missing: ${guide}"; exit 1; }
            grep -q '"@type":"Article"' "$output" || { echo "Article schema missing: ${guide}"; exit 1; }
            grep -q 'Passende Kosten in allen 8 Städten vergleichen' "$output" || { echo "Eight-city comparison missing: ${guide}"; exit 1; }
            grep -q 'Lokale Gewerkseiten' "$output" || { echo "Local trade links missing: ${guide}"; exit 1; }
            ! grep -qi 'noindex' "$output" || { echo "Unexpected noindex: ${guide}"; exit 1; }
          done

      - name: Verify dedicated service city and price links
        shell: bash
        run: |
          set -euo pipefail
          source scripts/hostinger-verify.sh

          check_mapping() {
            local service="$1"
            local service_guide="$2"
            local item="$3"
            local item_guide="$4"

            echo "Checking specialist mapping: ${service} -> ${service_guide}; ${item} -> ${item_guide}"

            fetch_hostinger "https://baukostenradar.de/kosten/${service}" /tmp/service.html
            grep -Fq "/ratgeber/${service_guide}" /tmp/service.html || {
              echo "Service guide mapping missing: ${service} -> ${service_guide}" >&2
              exit 1
            }

            fetch_hostinger "https://baukostenradar.de/kosten/${service}/berlin" /tmp/city.html
            grep -Fq "/ratgeber/${service_guide}" /tmp/city.html || {
              echo "City guide continuity missing: ${service}/berlin -> ${service_guide}" >&2
              exit 1
            }

            fetch_hostinger "https://baukostenradar.de/kosten/${service}/leistung/${item}" /tmp/item.html
            grep -Fq "/ratgeber/${item_guide}" /tmp/item.html || {
              echo "Price-detail guide mapping missing: ${service}/${item} -> ${item_guide}" >&2
              exit 1
            }
            grep -q 'id="ratgeber"' /tmp/item.html || {
              echo "Price-detail guide section missing: ${service}/${item}" >&2
              exit 1
            }
          }

          check_mapping maler maler-kosten-pro-qm waende-streichen waende-streichen-kosten-pro-qm
          check_mapping fliesenleger fliesenleger-kosten-pro-qm standard-fliesen-verlegen fliesen-verlegen-kosten-pro-qm
          check_mapping bodenleger bodenleger-kosten-pro-qm vinylboden-klick-inkl-material vinylboden-verlegen-kosten-pro-qm
          check_mapping trockenbau trockenbau-kosten-pro-qm trockenbauwand-beidseitig-beplankt trockenbauwand-kosten-pro-qm
          check_mapping sanitaer sanitaer-kosten sanitaerobjekte-armaturen-fuer-8-m2-bad sanitaerobjekte-bad-kosten
          check_mapping waermepumpe luft-wasser-waermepumpe-kosten luft-wasser-waermepumpe-komplett luft-wasser-waermepumpe-kosten
          check_mapping photovoltaik photovoltaik-10-kwp-kosten pv-anlage-10-kwp-inkl-installation photovoltaik-10-kwp-kosten
          check_mapping daemmung daemmung-kosten-pro-qm innendaemmung innendaemmung-kosten-pro-qm
          check_mapping fassade fassade-sanieren-kosten putz-fassade-neu putzfassade-kosten-pro-qm
          check_mapping garten garten-anlegen-kosten einfahrt-pflastern einfahrt-pflastern-kosten
          check_mapping zaunbau zaun-bauen-kosten-pro-meter metallzaun-oder-doppelstabmatten-material doppelstabmattenzaun-kosten-pro-meter

      - name: Verify specialist reverse silo and calculators
        shell: bash
        run: |
          set -euo pipefail
          source scripts/hostinger-verify.sh

          declare -A services=(
            [maler-kosten-pro-qm]=maler
            [fliesenleger-kosten-pro-qm]=fliesenleger
            [bodenleger-kosten-pro-qm]=bodenleger
            [trockenbau-kosten-pro-qm]=trockenbau
            [sanitaer-kosten]=sanitaer
            [luft-wasser-waermepumpe-kosten]=waermepumpe
            [photovoltaik-kosten-2026]=photovoltaik
            [daemmung-kosten-pro-qm]=daemmung
            [fassade-sanieren-kosten]=fassade
            [garten-anlegen-kosten]=garten
            [zaun-bauen-kosten-pro-meter]=zaunbau
          )

          for guide in "${!services[@]}"; do
            service="${services[$guide]}"
            fetch_hostinger "https://baukostenradar.de/ratgeber/${guide}" /tmp/guide.html
            grep -q "/kosten/${service}/berlin" /tmp/guide.html || { echo "Berlin reverse silo missing: ${guide} -> ${service}"; exit 1; }
            grep -q "/kosten/${service}/muenchen" /tmp/guide.html || { echo "München reverse silo missing: ${guide} -> ${service}"; exit 1; }
            grep -q "/rechner/handwerkerkosten?gewerk=${service}" /tmp/guide.html || { echo "Calculator link missing: ${guide} -> ${service}"; exit 1; }
          done
