name: Verify current Küche and Treppen guides

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-current-guides:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hostinger-verifier
      - name: Fetch hubs and sitemap
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL --fail 'https://baukostenradar.de/sitemap.xml' -o /tmp/sitemap.xml
          curl -sSL --fail 'https://baukostenradar.de/ratgeber' -o /tmp/ratgeber.html
          curl -sSL --fail 'https://baukostenradar.de/kosten/kueche' -o /tmp/kueche.html
          curl -sSL --fail 'https://baukostenradar.de/kosten/treppen' -o /tmp/treppen.html

      - name: Verify new guide pages and internal links
        shell: bash
        run: |
          set -euo pipefail

          require_contains() {
            local file="$1"
            local needle="$2"
            local label="$3"
            if ! grep -Fq "$needle" "$file"; then
              echo "MISSING: $label" >&2
              echo "Expected in $file: $needle" >&2
              exit 1
            fi
          }

          require_noindex_absent() {
            local file="$1"
            local label="$2"
            if grep -qi 'noindex' "$file"; then
              echo "UNEXPECTED NOINDEX: $label" >&2
              exit 1
            fi
          }

          check_guide() {
            local slug="$1"
            local service="$2"
            local item="$3"
            local output="/tmp/${slug}.html"
            local url="https://baukostenradar.de/ratgeber/${slug}"

            echo "Checking guide: $slug"
            require_contains /tmp/sitemap.xml "${url}</loc>" "guide sitemap URL $slug"
            require_contains /tmp/ratgeber.html "/ratgeber/${slug}" "guide hub link $slug"
            curl -sSL --fail "$url" -o "$output"
            require_contains "$output" "$url" "canonical URL $slug"
            require_contains "$output" '"@type":"Article"' "Article schema $slug"
            require_contains "$output" 'FAQPage' "FAQ schema $slug"
            require_contains "$output" "/kosten/${service}" "service link $slug"
            require_contains "$output" "gewerk=${service}" "calculator service preset $slug"
            require_contains "$output" "leistung=${item}" "calculator item preset $slug"
            require_noindex_absent "$output" "$slug"
          }

          check_guide 'kuechensanierung-komplett-kosten' 'kueche' 'kuechensanierung-komplett'
          check_guide 'kuechenmontage-laufender-meter-kosten' 'kueche' 'kuechenmontage-je-laufendem-meter'
          check_guide 'betontreppe-kosten-2026' 'treppen' 'fertigteil-betontreppe-inkl-einbau'
          check_guide 'treppengelaender-edelstahl-kosten' 'treppen' 'treppengelaender-edelstahl-10-m-inkl-montage'

      - name: Verify price-detail to guide links
        shell: bash
        run: |
          set -euo pipefail

          require_contains() {
            local file="$1"
            local needle="$2"
            local label="$3"
            if ! grep -Fq "$needle" "$file"; then
              echo "MISSING: $label" >&2
              echo "Expected in $file: $needle" >&2
              exit 1
            fi
          }

          check_item() {
            local service="$1"
            local item="$2"
            local guide="$3"
            local output="/tmp/${service}-${item}.html"
            local url="https://baukostenradar.de/kosten/${service}/leistung/${item}"

            echo "Checking price item: $service/$item"
            require_contains /tmp/sitemap.xml "${url}</loc>" "price sitemap URL $service/$item"
            curl -sSL --fail "$url" -o "$output"
            require_contains "$output" 'Passender Ratgeber' "guide CTA $service/$item"
            require_contains "$output" "/ratgeber/${guide}" "guide mapping $service/$item -> $guide"
            if grep -qi 'noindex' "$output"; then
              echo "UNEXPECTED NOINDEX: $service/$item" >&2
              exit 1
            fi
          }

          check_item 'kueche' 'kuechensanierung-komplett' 'kuechensanierung-komplett-kosten'
          check_item 'kueche' 'kuechenmontage-je-laufendem-meter' 'kuechenmontage-laufender-meter-kosten'
          check_item 'treppen' 'fertigteil-betontreppe-inkl-einbau' 'betontreppe-kosten-2026'
          check_item 'treppen' 'treppengelaender-edelstahl-10-m-inkl-montage' 'treppengelaender-edelstahl-kosten'
