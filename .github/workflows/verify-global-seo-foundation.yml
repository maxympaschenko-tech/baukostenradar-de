name: Verify global SEO foundation

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-global-seo:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch global SEO resources
        shell: bash
        run: |
          set -euo pipefail

          fetch_with_retry() {
            local url="$1"
            local output="$2"
            for i in 1 2 3 4 5; do
              if curl -sS --fail --connect-timeout 10 --max-time 25 "$url" -o "$output"; then
                return 0
              fi
              if [[ "$i" == "5" ]]; then
                return 1
              fi
              sleep 4
            done
          }

          fetch_with_retry 'https://baukostenradar.de/' /tmp/home.html
          fetch_with_retry 'https://baukostenradar.de/kosten' /tmp/costs.html
          fetch_with_retry 'https://baukostenradar.de/robots.txt' /tmp/robots.txt
          fetch_with_retry 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml

      - name: Verify homepage site-name structured data
        shell: bash
        run: |
          set -euo pipefail

          grep -q '"@type":"WebSite"' /tmp/home.html
          grep -q '"@id":"https://baukostenradar.de/#website"' /tmp/home.html
          grep -q '"url":"https://baukostenradar.de/"' /tmp/home.html
          grep -q '"name":"BauKostenRadar"' /tmp/home.html
          grep -q '"inLanguage":"de-DE"' /tmp/home.html
          grep -q '"publisher":{"@id":"https://baukostenradar.de/#organization"}' /tmp/home.html
          grep -q '"@type":"Organization"' /tmp/home.html
          grep -q '"@id":"https://baukostenradar.de/#organization"' /tmp/home.html

          if grep -q '"@type":"WebSite"' /tmp/costs.html; then
            echo 'WebSite site-name structured data must remain homepage-only.' >&2
            exit 1
          fi

          if grep -q 'SearchAction' /tmp/home.html; then
            echo 'Homepage must not emit obsolete/unneeded WebSite SearchAction markup.' >&2
            exit 1
          fi

      - name: Verify branded social preview metadata and images
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from html.parser import HTMLParser

          class MetaParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.values = {}

              def handle_starttag(self, tag, attrs):
                  if tag != "meta":
                      return
                  data = dict(attrs)
                  key = data.get("property") or data.get("name")
                  if key and data.get("content"):
                      self.values[key] = data["content"]

          parser = MetaParser()
          with open('/tmp/home.html', encoding='utf-8') as handle:
              parser.feed(handle.read())

          expected = {
              'og:image',
              'og:image:width',
              'og:image:height',
              'og:image:alt',
              'twitter:card',
              'twitter:image',
              'twitter:image:alt',
          }
          missing = sorted(expected - parser.values.keys())
          if missing:
              raise SystemExit(f"Missing social metadata: {', '.join(missing)}")

          if parser.values['og:image:width'] != '1200' or parser.values['og:image:height'] != '630':
              raise SystemExit('Open Graph image dimensions must be 1200x630')
          if parser.values['twitter:card'] != 'summary_large_image':
              raise SystemExit('Twitter card must be summary_large_image')
          if 'BauKostenRadar' not in parser.values['og:image:alt']:
              raise SystemExit('Open Graph image alt must identify BauKostenRadar')
          if 'BauKostenRadar' not in parser.values['twitter:image:alt']:
              raise SystemExit('Twitter image alt must identify BauKostenRadar')

          with open('/tmp/og-image-url.txt', 'w', encoding='utf-8') as handle:
              handle.write(parser.values['og:image'])
          with open('/tmp/twitter-image-url.txt', 'w', encoding='utf-8') as handle:
              handle.write(parser.values['twitter:image'])
          PY

          og_url=$(cat /tmp/og-image-url.txt)
          twitter_url=$(cat /tmp/twitter-image-url.txt)
          echo "Open Graph image: $og_url"
          echo "Twitter image: $twitter_url"

          [[ "$og_url" == https://baukostenradar.de/* ]]
          [[ "$twitter_url" == https://baukostenradar.de/* ]]

          curl -sS --fail --connect-timeout 10 --max-time 30 -D /tmp/og.headers "$og_url" -o /tmp/og.png
          curl -sS --fail --connect-timeout 10 --max-time 30 -D /tmp/twitter.headers "$twitter_url" -o /tmp/twitter.png

          grep -qi '^content-type: image/png' /tmp/og.headers
          grep -qi '^content-type: image/png' /tmp/twitter.headers
          test "$(wc -c < /tmp/og.png)" -gt 10000
          test "$(wc -c < /tmp/twitter.png)" -gt 10000

      - name: Verify robots points to canonical sitemap
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'User-agent: \*' /tmp/robots.txt
          grep -q 'Allow: /' /tmp/robots.txt
          grep -q 'Disallow: /api/' /tmp/robots.txt
          grep -q 'Sitemap: https://baukostenradar.de/sitemap.xml' /tmp/robots.txt

      - name: Verify sitemap contains canonical indexable URLs and accurate freshness signals
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<loc>https://baukostenradar.de</loc>' /tmp/sitemap.xml
          grep -q '<loc>https://baukostenradar.de/kosten</loc>' /tmp/sitemap.xml
          grep -q '<loc>https://baukostenradar.de/rechner</loc>' /tmp/sitemap.xml
          grep -q '<loc>https://baukostenradar.de/ratgeber</loc>' /tmp/sitemap.xml
          grep -q '<loc>https://baukostenradar.de/staedte</loc>' /tmp/sitemap.xml
          grep -q '<loc>https://baukostenradar.de/kosten/maler/berlin</loc>' /tmp/sitemap.xml
          grep -q '<loc>https://baukostenradar.de/kosten/maler/leistung/waende-streichen</loc>' /tmp/sitemap.xml
          grep -q '<loc>https://baukostenradar.de/ratgeber/sanierungskosten-pro-qm</loc>' /tmp/sitemap.xml

          for forbidden in '/impressum' '/datenschutz' '/angebot' '/api/'; do
            if grep -q "$forbidden" /tmp/sitemap.xml; then
              echo "Non-indexable path found in sitemap: $forbidden" >&2
              exit 1
            fi
          done

          if grep -Eq '<priority>|<changefreq>' /tmp/sitemap.xml; then
            echo 'Sitemap must not contain ignored priority/changefreq signals.' >&2
            exit 1
          fi

          python - <<'PY'
          from datetime import date
          import re
          import xml.etree.ElementTree as ET

          path = '/tmp/sitemap.xml'
          root = ET.parse(path).getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          entries = {}
          lastmods = []

          for node in root.findall('sm:url', ns):
              loc = node.findtext('sm:loc', default='', namespaces=ns)
              lastmod = node.findtext('sm:lastmod', default='', namespaces=ns)
              entries[loc] = lastmod or None
              if lastmod:
                  if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', lastmod):
                      raise SystemExit(f'Invalid sitemap lastmod format: {lastmod}')
                  parsed = date.fromisoformat(lastmod)
                  if parsed > date.today():
                      raise SystemExit(f'Future sitemap lastmod found: {loc} -> {lastmod}')
                  lastmods.append(parsed)

          if not lastmods:
              raise SystemExit('Sitemap must contain source-backed lastmod values')

          freshness_floor = date(2026, 8, 31)
          for loc in ('https://baukostenradar.de', 'https://baukostenradar.de/kosten', 'https://baukostenradar.de/kosten/tueren'):
              value = entries.get(loc)
              if not value:
                  raise SystemExit(f'Missing expected lastmod for {loc}')
              if date.fromisoformat(value) < freshness_floor:
                  raise SystemExit(f'Stale lastmod for {loc}: {value}')

          print(f'Validated {len(lastmods)} source-backed lastmod values')
          PY

          duplicate_count=$(grep -o '<loc>[^<]*</loc>' /tmp/sitemap.xml | sort | uniq -d | wc -l | tr -d ' ')
          echo "Duplicate sitemap URLs: $duplicate_count"
          test "$duplicate_count" = '0'
