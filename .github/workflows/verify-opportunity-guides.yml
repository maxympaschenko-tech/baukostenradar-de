      - name: Verify parent guides link into the long-tail cluster
        shell: bash
        run: |
          set -euo pipefail

          check_parent() {
            local parent="$1"
            local child="$2"
            curl -sS --fail "https://baukostenradar.de/ratgeber/${parent}" -o /tmp/parent.html
            grep -q "/ratgeber/${child}" /tmp/parent.html
