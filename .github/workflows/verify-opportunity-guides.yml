          check_parent heizung-erneuern-kosten heizungswartung-kosten
          check_parent garten-anlegen-kosten doppelstabmattenzaun-kosten-pro-meter
          check_parent estrich-100-qm-kosten trockenestrich-kosten-pro-qm
          check_parent daemmung-kosten-pro-qm zwischensparrendaemmung-kosten-pro-qm
          check_parent daemmung-kosten-pro-qm aufsparrendaemmung-kosten-pro-qm
          check_parent fassade-sanieren-kosten putzfassade-kosten-pro-qm

          check_parent fliesenleger-kosten-pro-qm mosaik-fliesen-verlegen-kosten-pro-qm
          check_parent fliesenleger-kosten-pro-qm naturstein-verlegen-kosten-pro-qm
          check_parent elektrik-erneuern-altbau lichtschalter-austauschen-kosten
          check_parent dach-sanieren-kosten-pro-qm geruest-kosten-pro-qm
