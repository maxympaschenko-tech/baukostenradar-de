          check_opportunity heckenschnitt-kosten-pro-meter garten heckenschnitt
          check_opportunity innentuer-einbauen-kosten tueren innentuer-einbauen-inkl-zarge
          check_opportunity tuer-lackieren-kosten tueren tuer-lackieren-mit-zarge
