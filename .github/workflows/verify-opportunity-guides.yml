name: Verify opportunity guides

on:
  workflow_run:
    workflows: ["Deploy to Ukraine.com.ua"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-opportunity-guides:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify current opportunity guides and exact item mappings
        shell: bash
        run: |
          set -euo pipefail

          curl -sS --fail 'https://baukostenradar.de/sitemap.xml' -o /tmp/sitemap.xml

          opportunities=$(cat <<'EOF'
          einfahrt-pflastern-kosten|garten|einfahrt-pflastern|garten-anlegen-kosten
          terrasse-pflastern-kosten|garten|terrasse-pflastern-inkl-unterbau|garten-anlegen-kosten
          baum-faellen-kosten|garten|baumfaellung-mittelgross-inkl-entsorgung|garten-anlegen-kosten
          rollrasen-kosten-pro-qm|garten|rollrasen-inkl-vorbereitung|garten-anlegen-kosten
          parkett-abschleifen-kosten|bodenleger|parkett-abschleifen-und-oelen|bodenleger-kosten-pro-qm
          sicherungskasten-erneuern-kosten|elektriker|sicherungskasten-erneuern|elektrik-erneuern-altbau
          dachrinne-erneuern-kosten|dachsanierung|dachrinne-erneuern-zink|dach-sanieren-kosten-pro-qm
          haustuer-kunststoff-kosten|tueren|haustuer-kunststoff-inkl-montage|haustuer-einbauen-kosten
          fassadendaemmung-kosten-pro-qm|daemmung|fassadendaemmung-wdvs|daemmung-kosten-pro-qm
          waermepumpe-wartung-kosten|waermepumpe|wartung-waermepumpe|waermepumpe-kosten-2026
          stromspeicher-kosten-pro-kwh|photovoltaik|stromspeicher-lfp|photovoltaik-kosten-2026
          fenstereinbau-kosten|fenster|fenstereinbau|fenster-austauschen-kosten-haus
          trockenbauwand-kosten-pro-qm|trockenbau|trockenbauwand-beidseitig-beplankt|trockenbau-kosten-pro-qm
          heizkoerper-montieren-kosten|heizung|heizkoerper-montieren|heizung-erneuern-kosten
          bodenplatte-kosten-pro-qm|maurer|bodenplatte-standard|innenwand-mauern-kosten
          kuechenfronten-erneuern-kosten|kueche|kuechenfronten-austauschen-oder-lackieren|kueche-10-qm-renovieren-kosten
          kuechenarbeitsplatte-kosten|kueche|neue-arbeitsplatte|kueche-10-qm-renovieren-kosten
          parkett-verlegen-kosten-pro-qm|bodenleger|parkett-verlegen-inkl-material|bodenleger-kosten-pro-qm
          laminat-verlegen-kosten-pro-qm|bodenleger|laminat-verlegen|bodenleger-kosten-pro-qm
          innendaemmung-kosten-pro-qm|daemmung|innendaemmung|daemmung-kosten-pro-qm
          waende-streichen-kosten-pro-qm|maler|waende-streichen|maler-kosten-pro-qm
          tapezieren-kosten-pro-qm|maler|tapezieren-inkl-tapete|maler-kosten-pro-qm
          innenputz-q3-kosten-pro-qm|maler|innenputz-glaetten-q3|maler-kosten-pro-qm
          fliesen-verlegen-kosten-pro-qm|fliesenleger|standard-fliesen-verlegen|fliesenleger-kosten-pro-qm
          grossformat-fliesen-verlegen-kosten|fliesenleger|grossformat-ab-80-x-80-cm|fliesenleger-kosten-pro-qm
          steckdose-installieren-kosten|elektriker|steckdose-installieren|elektrik-erneuern-altbau
          dach-neu-eindecken-kosten-pro-qm|dachsanierung|neueindeckung-inkl-lattung|dach-sanieren-kosten-pro-qm
          vinylboden-verlegen-kosten-pro-qm|bodenleger|vinylboden-klick-inkl-material|bodenleger-kosten-pro-qm
          verspachtelung-q4-kosten-pro-qm|trockenbau|verspachtelung-q4|trockenbau-kosten-pro-qm
          luft-wasser-waermepumpe-kosten|waermepumpe|luft-wasser-waermepumpe-komplett|waermepumpe-kosten-2026
          photovoltaik-10-kwp-kosten|photovoltaik|pv-anlage-10-kwp-inkl-installation|photovoltaik-kosten-2026
          photovoltaik-mit-speicher-kosten|photovoltaik|10-kwp-pv-ca-10-kwh-speicher|photovoltaik-kosten-2026
          fenster-3-fach-verglasung-kosten|fenster|fenster-mit-3-fach-verglasung|fenster-austauschen-kosten-haus
          gasheizung-austauschen-kosten|heizung|gasheizung-austauschen|heizung-erneuern-kosten
          heizungswartung-kosten|heizung|heizungswartung|heizung-erneuern-kosten
          doppelstabmattenzaun-kosten-pro-meter|garten|doppelstabmattenzaun-inkl-montage|garten-anlegen-kosten
          trockenestrich-kosten-pro-qm|estrich|trockenestrich-verlegen|estrich-100-qm-kosten
          zwischensparrendaemmung-kosten-pro-qm|daemmung|dachdaemmung-zwischensparren|daemmung-kosten-pro-qm
          aufsparrendaemmung-kosten-pro-qm|daemmung|dachdaemmung-aufsparren|daemmung-kosten-pro-qm
          putzfassade-kosten-pro-qm|fassade|putz-fassade-neu|fassade-sanieren-kosten
          mosaik-fliesen-verlegen-kosten-pro-qm|fliesenleger|mosaik-fliesen-verlegen|fliesenleger-kosten-pro-qm
          naturstein-verlegen-kosten-pro-qm|fliesenleger|naturstein-verlegen|fliesenleger-kosten-pro-qm
          lichtschalter-austauschen-kosten|elektriker|lichtschalter-austauschen|elektrik-erneuern-altbau
          geruest-kosten-pro-qm|dachsanierung|geruest-ca-4-wochen|dach-sanieren-kosten-pro-qm
          boden-sanieren-kosten-pro-qm|bodenleger|boden-sanierung-alt-raus-neu-rein|bodenleger-kosten-pro-qm
          bad-entkernen-kosten|sanitaer|demontage-entsorgung-altbad|bad-komplett-sanieren-kosten
          photovoltaik-15-kwp-kosten|photovoltaik|pv-anlage-15-kwp-inkl-installation|photovoltaik-kosten-2026
          fenster-2-fach-verglasung-kosten|fenster|fenster-mit-2-fach-verglasung|fenster-austauschen-kosten-haus
          thermostat-installieren-kosten|heizung|thermostat-installieren|heizung-erneuern-kosten
          fassadenrisse-sanieren-kosten-pro-qm|fassade|fassaden-sanierung-bei-rissen|fassade-sanieren-kosten
          vorgehaengte-hinterlueftete-fassade-kosten-pro-qm|fassade|vorgehaengte-hinterlueftete-fassade|fassade-sanieren-kosten
          heckenschnitt-kosten-pro-meter|garten|heckenschnitt|garten-anlegen-kosten
          innentuer-einbauen-kosten|tueren|innentuer-mit-zarge-inkl-montage|6-innentueren-austauschen-kosten
          fliessestrich-kosten-pro-qm|estrich|fliessestrich-verlegen|estrich-100-qm-kosten
          holztreppe-schleifen-kosten|treppen|holztreppe-schleifen-und-versiegeln|14-treppenstufen-renovieren-kosten
          betontreppe-neuer-belag-kosten|treppen|betontreppe-mit-neuem-belag|14-treppenstufen-renovieren-kosten
          fliesenspiegel-erneuern-kosten|kueche|fliesenspiegel-erneuern|kueche-10-qm-renovieren-kosten
          bad-komplett-verfliesen-kosten|badsanierung|komplettverfliesung-bad|bad-komplett-sanieren-kosten
          bad-abdichten-kosten-pro-qm|badsanierung|verbundabdichtung-nassbereich|bad-komplett-sanieren-kosten
          elektro-neuinstallation-kosten|elektriker|komplett-neuinstallation|elektrik-erneuern-altbau
          dachsanierung-aufsparrendaemmung-kosten-pro-qm|dachsanierung|dachsanierung-inkl-aufsparrendaemmung|dach-sanieren-kosten-pro-qm
          photovoltaik-5-kwp-kosten|photovoltaik|pv-anlage-5-kwp-inkl-installation|photovoltaik-kosten-2026
          fassade-streichen-kosten-pro-qm|fassade|fassade-streichen-inkl-vorarbeiten|fassade-sanieren-kosten
          klinkerfassade-kosten-pro-qm|fassade|klinker-verblendung|fassade-sanieren-kosten
          zementestrich-kosten-pro-qm|estrich|zementestrich-verlegen|estrich-100-qm-kosten
          kalksandstein-mauerwerk-kosten-pro-qm|maurer|kalksandstein-mauerwerk|innenwand-mauern-kosten
          poroton-mauerwerk-kosten-pro-qm|maurer|poroton-mauerwerk|innenwand-mauern-kosten
          porenbeton-mauerwerk-kosten-pro-qm|maurer|porenbeton-mauerwerk|innenwand-mauern-kosten
          treppenrenovierung-holzstufen-system-kosten|treppen|treppenrenovierung-holzstufen-system|14-treppenstufen-renovieren-kosten
          treppen-stufenueberbau-gelaender-kosten|treppen|holztreppe-stufenueberbau-gelaender|14-treppenstufen-renovieren-kosten
          natursteintreppe-schleifen-kosten|treppen|natursteintreppe-schleifen-und-polieren|14-treppenstufen-renovieren-kosten
          sanitaerobjekte-bad-kosten|sanitaer|sanitaerobjekte-armaturen-fuer-8-m2-bad|sanitaer-kosten
          kueche-elektrogeraete-kosten|kueche|neue-elektrogeraete|kueche-10-qm-renovieren-kosten
          einbaukueche-kosten|kueche|komplett-neue-einbaukueche|kueche-10-qm-renovieren-kosten
          premium-kueche-umbau-kosten|kueche|premium-kueche-mit-umbau|kueche-10-qm-renovieren-kosten
          schnellestrich-kosten-pro-qm|estrich|schnellestrich|estrich-100-qm-kosten
          bodenausgleich-kosten-pro-qm|estrich|bodenausgleich-5-20-mm|estrich-100-qm-kosten
          estrich-rissreparatur-kosten|estrich|estrich-rissreparatur|estrich-100-qm-kosten
          EOF
          )

          checked=0
          while IFS='|' read -r guide service item parent; do
            guide="${guide#${guide%%[![:space:]]*}}"
            [ -n "$guide" ] || continue
            echo "Checking ${guide} -> ${service}/${item}"

            grep -q "https://baukostenradar.de/ratgeber/${guide}</loc>" /tmp/sitemap.xml || { echo "Missing guide in sitemap: ${guide}"; exit 1; }

            guide_output="/tmp/guide-${guide}.html"
            curl -sS --fail "https://baukostenradar.de/ratgeber/${guide}" -o "$guide_output"
            grep -q "https://baukostenradar.de/ratgeber/${guide}" "$guide_output" || { echo "Canonical missing: ${guide}"; exit 1; }
            grep -q '"@type":"Article"' "$guide_output" || { echo "Article schema missing: ${guide}"; exit 1; }
            grep -q "/kosten/${service}" "$guide_output" || { echo "Service link missing: ${guide}"; exit 1; }
            grep -q "/kosten/${service}/berlin" "$guide_output" || { echo "Berlin link missing: ${guide}"; exit 1; }
            grep -q "gewerk=${service}" "$guide_output" || { echo "Calculator service missing: ${guide}"; exit 1; }
            grep -q "leistung=${item}" "$guide_output" || { echo "Calculator item missing: ${guide} expected ${item}"; exit 1; }
            ! grep -qi 'noindex' "$guide_output" || { echo "Unexpected noindex: ${guide}"; exit 1; }

            item_output="/tmp/item-${service}-${item}.html"
            curl -sS --fail "https://baukostenradar.de/kosten/${service}/leistung/${item}" -o "$item_output"
            grep -q 'Passender Ratgeber' "$item_output" || { echo "Ratgeber block missing on ${service}/${item}"; exit 1; }
            grep -q "/ratgeber/${guide}" "$item_output" || { echo "Exact guide mapping missing on ${service}/${item}: ${guide}"; exit 1; }
            ! grep -qi 'noindex' "$item_output" || { echo "Unexpected item noindex: ${service}/${item}"; exit 1; }

            parent_output="/tmp/parent-${parent}.html"
            curl -sS --fail "https://baukostenradar.de/ratgeber/${parent}" -o "$parent_output"
            grep -q "/ratgeber/${guide}" "$parent_output" || { echo "Parent ${parent} does not link to ${guide}"; exit 1; }

            checked=$((checked + 1))
          done <<< "$opportunities"

          test "$checked" -eq 78
          echo "Verified ${checked} current opportunity guides, exact price-item mappings and parent links"

      - name: Verify deprecated catalog guides stay out of sitemap
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail 'https://baukostenradar.de/sitemap.xml' -o /tmp/sitemap.xml

          deprecated=(
            tuer-lackieren-kosten
            anhydritestrich-kosten-pro-qm
            gussasphaltestrich-kosten-pro-qm
            sichtestrich-kosten-pro-qm
          )

          for guide in "${deprecated[@]}"; do
            ! grep -q "https://baukostenradar.de/ratgeber/${guide}</loc>" /tmp/sitemap.xml
          done
