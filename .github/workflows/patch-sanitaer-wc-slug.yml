name: Patch Sanitär WC detail slug

on:
  push:
    branches: [fix/sanitaer-wc-detail-slug]
    paths:
      - '.github/workflows/patch-sanitaer-wc-slug.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sanitaer-wc-detail-slug
      - name: Replace noncanonical WC detail slug
        shell: bash
        run: |
          set -euo pipefail
          old='stand-wc-inkl-neuem-spuelkasten'
          new='stand-wc-mit-neuem-aufputzspuelkasten-tauschen'
          files=(
            lib/guides-sanitaer.ts
            lib/price-guide-links-sanitaer.ts
            .github/workflows/verify-sanitaer-guide-cluster.yml
          )

          for file in "${files[@]}"; do
            grep -q "$old" "$file" || { echo "Old slug missing from $file"; exit 1; }
            sed -i "s/${old}/${new}/g" "$file"
            ! grep -q "$old" "$file"
            grep -q "$new" "$file"
          done

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'Fix canonical Stand-WC detail slug'
          git push origin HEAD:fix/sanitaer-wc-detail-slug
