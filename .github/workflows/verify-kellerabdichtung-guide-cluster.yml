name: Verify Kellerabdichtung guide cluster

on:
  workflow_run:
    workflows: ["Deploy to Ukraine.com.ua"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-kellerabdichtung-guide-cluster:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact Kellerabdichtung price-item guide mappings
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 45 "$1" -o "$2"
          }

          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/kosten/kellerabdichtung' /tmp/kellerabdichtung.html
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html

          ! grep -qi 'noindex' /tmp/kellerabdichtung.html

          mappings=$(cat <<'EOF'
          kellerabdichtung-aussen-inkl-aushub|kellerabdichtung-aussen-kosten-pro-qm
          kellerabdichtung-innen|kellerabdichtung-innen-kosten-pro-qm
          EOF
          )

          checked=0
          while IFS='|' read -r item guide; do
            item="${item#${item%%[![:space:]]*}}"
            [ -n "$item" ] || continue

            item_url="https://baukostenradar.de/kosten/kellerabdichtung/leistung/${item}"
            guide_url="https://baukostenradar.de/ratgeber/${guide}"
            item_output="/tmp/keller-item-${item}.html"
            guide_output="/tmp/keller-guide-${guide}.html"

            grep -q "${item_url}</loc>" /tmp/sitemap.xml || { echo "Kellerabdichtung item missing in sitemap: ${item}"; exit 1; }
            grep -q "/kosten/kellerabdichtung/leistung/${item}" /tmp/kellerabdichtung.html || { echo "Kellerabdichtung item missing on category: ${item}"; exit 1; }

            fetch "$item_url" "$item_output"
            grep -q 'Passender Ratgeber' "$item_output"
            grep -q "/ratgeber/${guide}" "$item_output" || { echo "Wrong Kellerabdichtung guide mapping: ${item} -> ${guide}"; exit 1; }
            ! grep -qi 'noindex' "$item_output"

            grep -q "${guide_url}</loc>" /tmp/sitemap.xml
            grep -q "/ratgeber/${guide}" /tmp/ratgeber.html

            fetch "$guide_url" "$guide_output"
            grep -q "$guide_url" "$guide_output"
            grep -q '"@type":"Article"' "$guide_output"
            grep -q '/kosten/kellerabdichtung' "$guide_output"
            grep -q '/kosten/kellerabdichtung/berlin' "$guide_output"
            grep -q 'gewerk=kellerabdichtung' "$guide_output"
            grep -q "leistung=${item}" "$guide_output"
            ! grep -qi 'noindex' "$guide_output"

            checked=$((checked + 1))
          done <<< "$mappings"

          test "$checked" -eq 2
          echo "Verified ${checked} exact Kellerabdichtung price-item guide mappings"

      - name: Verify Kellerabdichtung parent guide and calculator
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 45 "$1" -o "$2"
          }

          guide='kellerabdichtung-aussen-oder-innen-kosten'
          guide_url="https://baukostenradar.de/ratgeber/${guide}"

          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html
          fetch "$guide_url" /tmp/keller-parent.html

          grep -q "${guide_url}</loc>" /tmp/sitemap.xml
          grep -q "/ratgeber/${guide}" /tmp/ratgeber.html
          grep -q "$guide_url" /tmp/keller-parent.html
          grep -q '"@type":"Article"' /tmp/keller-parent.html
          grep -q '/kosten/kellerabdichtung' /tmp/keller-parent.html
          grep -q '/kosten/kellerabdichtung/berlin' /tmp/keller-parent.html
          grep -q 'gewerk=kellerabdichtung' /tmp/keller-parent.html
          grep -q 'leistung=kellerabdichtung-aussen-inkl-aushub' /tmp/keller-parent.html
          ! grep -qi 'noindex' /tmp/keller-parent.html

      - name: Verify Kellerabdichtung guide hub and internal-link silo
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 45 "$1" -o "$2"
          }

          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html

          guides=(
            kellerabdichtung-aussen-oder-innen-kosten
            kellerabdichtung-aussen-kosten-pro-qm
            kellerabdichtung-innen-kosten-pro-qm
          )

          for source in "${guides[@]}"; do
            guide_url="https://baukostenradar.de/ratgeber/${source}"
            grep -q "${guide_url}</loc>" /tmp/sitemap.xml || { echo "Kellerabdichtung guide missing in sitemap: ${source}"; exit 1; }
            grep -q "/ratgeber/${source}" /tmp/ratgeber.html || { echo "Kellerabdichtung guide missing from hub: ${source}"; exit 1; }

            fetch "$guide_url" "/tmp/${source}.html"
            grep -q "$guide_url" "/tmp/${source}.html"
            grep -q '"@type":"Article"' "/tmp/${source}.html"
            ! grep -qi 'noindex' "/tmp/${source}.html"

            for target in "${guides[@]}"; do
              [ "$source" = "$target" ] && continue
              grep -q "/ratgeber/${target}" "/tmp/${source}.html" || { echo "${source} missing Kellerabdichtung peer ${target}"; exit 1; }
            done
          done

          echo "Verified Kellerabdichtung hub visibility and full peer-link silo"
