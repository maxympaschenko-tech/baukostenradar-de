name: Verify door guide cluster

on:
  workflow_run:
    workflows: ["Deploy to Ukraine.com.ua"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-door-guides:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Türen guide silo
        shell: bash
        run: |
          set -euo pipefail

          sitemap='/tmp/sitemap.xml'
          parent='/tmp/haustuer-parent.html'
          hub='/tmp/hub.html'
          category='/tmp/tueren.html'

          curl -sS --fail 'https://baukostenradar.de/sitemap.xml' -o "$sitemap"
          curl -sS --fail 'https://baukostenradar.de/ratgeber/haustuer-einbauen-kosten' -o "$parent"
          curl -sS --fail 'https://baukostenradar.de/ratgeber' -o "$hub"
          curl -sS --fail 'https://baukostenradar.de/kosten/tueren' -o "$category"

          verify_guide() {
            local guide="$1"
            local item="$2"
            local low="$3"
            local high="$4"
            local title="$5"
            local peer="$6"
            local guide_html="/tmp/${guide}.html"
            local item_html="/tmp/${item}.html"

            grep -q "https://baukostenradar.de/ratgeber/${guide}</loc>" "$sitemap"
            grep -q "https://baukostenradar.de/kosten/tueren/leistung/${item}</loc>" "$sitemap"

            curl -sS --fail "https://baukostenradar.de/ratgeber/${guide}" -o "$guide_html"
            grep -q "https://baukostenradar.de/ratgeber/${guide}" "$guide_html"
            grep -q '"@type":"Article"' "$guide_html"
            grep -q "$low" "$guide_html"
            grep -q "$high" "$guide_html"
            grep -q '/kosten/tueren/berlin' "$guide_html"
            grep -q 'gewerk=tueren' "$guide_html"
            grep -q "leistung=${item}" "$guide_html"
            grep -q "/ratgeber/${peer}" "$guide_html"
            ! grep -qi 'noindex' "$guide_html"

            curl -sS --fail "https://baukostenradar.de/kosten/tueren/leistung/${item}" -o "$item_html"
            grep -q 'Passender Ratgeber' "$item_html"
            grep -q "/ratgeber/${guide}" "$item_html"
            ! grep -qi 'noindex' "$item_html"

            grep -q "/kosten/tueren/leistung/${item}" "$category"
            grep -q "/ratgeber/${guide}" "$hub"
            grep -q "$title" "$hub"
          }

          verify_guide \
            'innentuer-einbauen-kosten' \
            'innentuer-mit-zarge-inkl-montage' \
            '320' \
            '950' \
            'Innentür einbauen Kosten 2026' \
            'haustuer-kunststoff-kosten'

          verify_guide \
            'haustuer-kunststoff-kosten' \
            'haustuer-kunststoff-inkl-montage' \
            '1.500' \
            '3.500' \
            'Haustür Kunststoff Kosten 2026' \
            'haustuer-rc2-kosten'

          verify_guide \
            'haustuer-rc2-kosten' \
            'haustuer-holz-alu-rc2-inkl-montage' \
            '3.500' \
            '8.500' \
            'Haustür Holz/Alu RC2 Kosten 2026' \
            'haustuer-kunststoff-kosten'

          grep -q '/ratgeber/haustuer-kunststoff-kosten' "$parent"
          grep -q '/ratgeber/haustuer-rc2-kosten' "$parent"
          grep -q '/ratgeber/haustuer-rc2-kosten' '/tmp/innentuer-einbauen-kosten.html'
          grep -q '/ratgeber/6-innentueren-austauschen-kosten' '/tmp/innentuer-einbauen-kosten.html'

          ! grep -qi 'noindex' "$parent"
          ! grep -qi 'noindex' "$hub"
          ! grep -qi 'noindex' "$category"

          echo 'All 3 Türen price items, dedicated guides, calculator presets, internal links, price backlinks and hub visibility verified'
