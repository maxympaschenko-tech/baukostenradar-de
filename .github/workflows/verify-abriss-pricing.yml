name: Verify Abriss pricing expansion

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-abriss-pricing:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Abriss pages and source catalog
        shell: bash
        run: |
          set -euo pipefail

          fetch_with_retry() {
            local url="$1"
            local output="$2"
            for i in 1 2 3 4 5; do
              if curl -sS --fail --connect-timeout 10 --max-time 25 "$url" -o "$output"; then
                return 0
              fi
              if [[ "$i" == "5" ]]; then
                return 1
              fi
              sleep 4
            done
          }

          fetch_with_retry 'https://baukostenradar.de/kosten/abriss-entsorgung' /tmp/abriss.html
          fetch_with_retry 'https://baukostenradar.de/kosten/abriss-entsorgung/muenchen' /tmp/abriss-muenchen.html
          fetch_with_retry 'https://baukostenradar.de/quellen' /tmp/quellen.html
          fetch_with_retry 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml

      - name: Verify expanded source-backed Abriss data
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import re
          from html.parser import HTMLParser

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []

              def handle_data(self, data):
                  value = data.strip()
                  if value:
                      self.parts.append(value)

          def text(path):
              parser = TextParser()
              with open(path, encoding='utf-8') as handle:
                  parser.feed(handle.read())
              return re.sub(r'\s+', ' ', ' '.join(parser.parts))

          abriss = text('/tmp/abriss.html')
          muenchen = text('/tmp/abriss-muenchen.html')
          quellen = text('/tmp/quellen.html')
          with open('/tmp/sitemap.xml', encoding='utf-8') as handle:
              sitemap = handle.read()

          expected_main = (
              '15 Preispositionen',
              '4 geprüfte Quellen',
              'Hausabriss Standard je Quadratmeter',
              'Hausabriss mit Keller',
              'Hausabriss mit Schadstoffbelastung',
              'Entkernung und Vorarbeiten',
              'Schadstoffgutachten vor Abriss',
              'Abrissgenehmigung oder Anzeige',
              'Bauschutt entsorgen',
              'Bauschuttcontainer 5 Kubikmeter komplett',
              'Baumischabfallcontainer 5 Kubikmeter komplett',
              'Bauabfall Kombisack 1 Kubikmeter',
              'MyHammer - Hausabriss Kosten 2026',
              'MyHammer - Bauschutt entsorgen Kosten 2026',
              'Containerhelfer - Hausabriss Kosten 2026',
          )
          for needle in expected_main:
              if needle not in abriss:
                  raise SystemExit(f'Missing Abriss production signal: {needle}')

          expected_city = (
              'Abriss & Entsorgung Kosten in München 2026',
              'Hausabriss Standard je Quadratmeter',
              'Hausabriss mit Keller',
              'Bauschutt entsorgen',
              'Bauschuttcontainer 5 Kubikmeter komplett',
          )
          for needle in expected_city:
              if needle not in muenchen:
                  raise SystemExit(f'Missing München Abriss production signal: {needle}')

          for needle in (
              'MyHammer - Hausabriss Kosten 2026',
              'MyHammer - Bauschutt entsorgen Kosten 2026',
              'Containerhelfer - Hausabriss Kosten 2026',
          ):
              if needle not in quellen:
                  raise SystemExit(f'Missing Abriss source in central source catalog: {needle}')

          sitemap_needles = (
              '/kosten/abriss-entsorgung/leistung/hausabriss-standard-je-quadratmeter',
              '/kosten/abriss-entsorgung/leistung/hausabriss-mit-keller',
              '/kosten/abriss-entsorgung/leistung/hausabriss-mit-schadstoffbelastung',
              '/kosten/abriss-entsorgung/leistung/entkernung-und-vorarbeiten',
              '/kosten/abriss-entsorgung/leistung/schadstoffgutachten-vor-abriss',
              '/kosten/abriss-entsorgung/leistung/abrissgenehmigung-oder-anzeige',
              '/kosten/abriss-entsorgung/leistung/bauschutt-entsorgen',
              '/kosten/abriss-entsorgung/leistung/bauschuttcontainer-5-kubikmeter-komplett',
              '/kosten/abriss-entsorgung/leistung/baumischabfallcontainer-5-kubikmeter-komplett',
              '/kosten/abriss-entsorgung/leistung/bauabfall-kombisack-1-kubikmeter',
          )
          for needle in sitemap_needles:
              if needle not in sitemap:
                  raise SystemExit(f'Missing Abriss detail URL in sitemap: {needle}')
          PY
