name: Verify service count baselines

on:
  pull_request:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-count-baselines:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production service counts do not regress
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/hostinger-verify.sh
          fetch_hostinger 'https://baukostenradar.de/kosten/badsanierung' /tmp/bad.html
          fetch_hostinger 'https://baukostenradar.de/kosten/garten' /tmp/garten.html
          python3 scripts/check-service-count.py /tmp/bad.html 14 Bad
          python3 scripts/check-service-count.py /tmp/garten.html 17 Garten
      - name: Verify baseline checker exists
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/check-service-count.py
