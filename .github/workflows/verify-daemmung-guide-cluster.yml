name: Verify Dämmung guide cluster

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-daemmung-guide-cluster:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hostinger-verifier

      - name: Verify exact Dämmung price-item guide mappings
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 45 "$1" -o "$2"
          }

          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/kosten/daemmung' /tmp/daemmung.html
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html

          grep -q 'https://baukostenradar.de/kosten/daemmung' /tmp/daemmung.html
          ! grep -qi 'noindex' /tmp/daemmung.html

          mappings=$(cat <<'EOF'
          fassadendaemmung-wdvs|fassadendaemmung-kosten-pro-qm
          wdvs-mit-eps-styropor|fassadendaemmung-kosten-pro-qm
          wdvs-mit-mineralwolle|fassadendaemmung-kosten-pro-qm
          wdvs-mit-holzfaser|fassadendaemmung-kosten-pro-qm
          kerndaemmung-einblasdaemmung-fassade|kerndaemmung-kosten-pro-qm
          innendaemmung|innendaemmung-kosten-pro-qm
          dachdaemmung-zwischensparren|zwischensparrendaemmung-kosten-pro-qm
          dachdaemmung-aufsparren|aufsparrendaemmung-kosten-pro-qm
          oberste-geschossdecke-daemmen-nicht-begehbar|daemmung-oberste-geschossdecke-kosten-pro-qm
          oberste-geschossdecke-daemmen-begehbar|daemmung-oberste-geschossdecke-kosten-pro-qm
          kellerdeckendaemmung-inkl-montage|daemmung-kellerdecke-kosten-pro-qm
          kellerdeckendaemmung-von-oben-mit-bodenbelag|daemmung-kellerdecke-kosten-pro-qm
          kellerdecke-per-einblasdaemmung|daemmung-kellerdecke-kosten-pro-qm
          kellerdecke-per-spruehdaemmung|daemmung-kellerdecke-kosten-pro-qm
          sockeldaemmung|sockeldaemmung-kosten
          sockeldaemmung-einfamilienhaus-komplett|sockeldaemmung-kosten
          EOF
          )

          checked=0
          while IFS='|' read -r item guide; do
            item="${item#${item%%[![:space:]]*}}"
            [ -n "$item" ] || continue

            item_url="https://baukostenradar.de/kosten/daemmung/leistung/${item}"
            guide_url="https://baukostenradar.de/ratgeber/${guide}"
            item_output="/tmp/daemmung-item-${item}.html"
            guide_output="/tmp/daemmung-guide-${guide}-${item}.html"

            grep -q "${item_url}</loc>" /tmp/sitemap.xml || { echo "Dämmung item missing in sitemap: ${item}"; exit 1; }
            grep -q "/kosten/daemmung/leistung/${item}" /tmp/daemmung.html || { echo "Dämmung item missing on category: ${item}"; exit 1; }

            fetch "$item_url" "$item_output"
            grep -q 'Passender Ratgeber' "$item_output"
            grep -q "/ratgeber/${guide}" "$item_output" || { echo "Wrong Dämmung guide mapping: ${item} -> ${guide}"; exit 1; }
            ! grep -qi 'noindex' "$item_output"

            grep -q "${guide_url}</loc>" /tmp/sitemap.xml
            grep -q "/ratgeber/${guide}" /tmp/ratgeber.html

            fetch "$guide_url" "$guide_output"
            grep -q "$guide_url" "$guide_output"
            grep -q '"@type":"Article"' "$guide_output"
            grep -q '/kosten/daemmung' "$guide_output"
            grep -q '/kosten/daemmung/berlin' "$guide_output"
            grep -q 'gewerk=daemmung' "$guide_output"
            grep -q "/kosten/daemmung/leistung/${item}" "$guide_output" || { echo "Guide missing exact price-item backlink: ${guide} -> ${item}"; exit 1; }
            ! grep -qi 'noindex' "$guide_output"

            checked=$((checked + 1))
          done <<< "$mappings"

          test "$checked" -eq 16
          echo "Verified ${checked} exact Dämmung price-item guide mappings"

      - name: Verify cross-service Kerndämmung canonical routing
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 45 "$1" -o "$2"
          }

          item='kerndaemmung-einblasdaemmung-fassade'
          guide='kerndaemmung-kosten-pro-qm'
          guide_url="https://baukostenradar.de/ratgeber/${guide}"

          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/kosten/fassade' /tmp/fassade.html
          fetch "https://baukostenradar.de/kosten/fassade/leistung/${item}" /tmp/fassade-kerndaemmung.html
          fetch "$guide_url" /tmp/kerndaemmung-guide.html

          grep -q "https://baukostenradar.de/kosten/fassade/leistung/${item}</loc>" /tmp/sitemap.xml
          grep -q "/kosten/fassade/leistung/${item}" /tmp/fassade.html
          grep -q 'Passender Ratgeber' /tmp/fassade-kerndaemmung.html
          grep -q "/ratgeber/${guide}" /tmp/fassade-kerndaemmung.html
          ! grep -qi 'noindex' /tmp/fassade-kerndaemmung.html

          grep -q '/kosten/fassade/leistung/kerndaemmung-einblasdaemmung-fassade' /tmp/kerndaemmung-guide.html
          grep -q '/kosten/daemmung/leistung/kerndaemmung-einblasdaemmung-fassade' /tmp/kerndaemmung-guide.html
          grep -q '/kosten/fassade' /tmp/kerndaemmung-guide.html
          grep -q '15-30' /tmp/kerndaemmung-guide.html
          grep -q '25-60' /tmp/kerndaemmung-guide.html

          echo "Verified Fassade and Dämmung Kerndämmung pages share one canonical guide"

      - name: Verify WDVS, Geschossdecke, Sockel and canonical Kellerdecke ranges
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 45 "$1" -o "$2"
          }

          fetch 'https://baukostenradar.de/ratgeber/fassadendaemmung-kosten-pro-qm' /tmp/wdvs.html
          grep -q '100-150' /tmp/wdvs.html
          grep -q '120-180' /tmp/wdvs.html
          grep -q '140-200' /tmp/wdvs.html
          grep -q '/kosten/daemmung/leistung/wdvs-mit-eps-styropor' /tmp/wdvs.html
          grep -q '/kosten/daemmung/leistung/wdvs-mit-mineralwolle' /tmp/wdvs.html
          grep -q '/kosten/daemmung/leistung/wdvs-mit-holzfaser' /tmp/wdvs.html

          fetch 'https://baukostenradar.de/ratgeber/daemmung-oberste-geschossdecke-kosten-pro-qm' /tmp/geschossdecke.html
          grep -q '20-35' /tmp/geschossdecke.html
          grep -q '40-80' /tmp/geschossdecke.html
          grep -q '/kosten/daemmung/leistung/oberste-geschossdecke-daemmen-nicht-begehbar' /tmp/geschossdecke.html
          grep -q '/kosten/daemmung/leistung/oberste-geschossdecke-daemmen-begehbar' /tmp/geschossdecke.html
          grep -q 'leistung=oberste-geschossdecke-daemmen-begehbar' /tmp/geschossdecke.html

          fetch 'https://baukostenradar.de/ratgeber/sockeldaemmung-kosten' /tmp/sockel.html
          grep -q '60-120' /tmp/sockel.html
          grep -q '2.500-5.000' /tmp/sockel.html
          grep -q '/kosten/daemmung/leistung/sockeldaemmung' /tmp/sockel.html
          grep -q '/kosten/daemmung/leistung/sockeldaemmung-einfamilienhaus-komplett' /tmp/sockel.html
          grep -q 'leistung=sockeldaemmung' /tmp/sockel.html

          fetch 'https://baukostenradar.de/ratgeber/daemmung-kellerdecke-kosten-pro-qm' /tmp/kellerdecke.html
          grep -q '40-100' /tmp/kellerdecke.html
          grep -q '15-30' /tmp/kellerdecke.html
          grep -q '20-50' /tmp/kellerdecke.html
          grep -q '50-150' /tmp/kellerdecke.html

          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          ! grep -q 'https://baukostenradar.de/ratgeber/kellerdeckendaemmung-kosten-pro-qm</loc>' /tmp/sitemap.xml

          duplicate='https://baukostenradar.de/ratgeber/kellerdeckendaemmung-kosten-pro-qm'
          status=$(curl -sS -o /dev/null -w '%{http_code}' "$duplicate")
          case "$status" in 301|308) ;; *) echo "Duplicate Kellerdecke URL is not a permanent redirect: HTTP ${status}"; exit 1 ;; esac
          location=$(curl -sSI "$duplicate" | tr -d '\r' | awk 'tolower($1) == "location:" { print $2; exit }')
          case "$location" in
            '/ratgeber/daemmung-kellerdecke-kosten-pro-qm'|'https://baukostenradar.de/ratgeber/daemmung-kellerdecke-kosten-pro-qm') ;;
            *) echo "Unexpected Kellerdecke redirect location: ${location}"; exit 1 ;;
          esac

          echo "Verified WDVS, Geschossdecke, Sockeldämmung and canonical Kellerdecke ranges"

      - name: Verify Dämmung parent guide and calculator
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 45 "$1" -o "$2"
          }

          guide='daemmung-kosten-pro-qm'
          guide_url="https://baukostenradar.de/ratgeber/${guide}"

          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html
          fetch "$guide_url" /tmp/daemmung-parent.html

          grep -q "${guide_url}</loc>" /tmp/sitemap.xml
          grep -q "/ratgeber/${guide}" /tmp/ratgeber.html
          grep -q "$guide_url" /tmp/daemmung-parent.html
          grep -q '"@type":"Article"' /tmp/daemmung-parent.html
          grep -q '/kosten/daemmung' /tmp/daemmung-parent.html
          grep -q '/kosten/daemmung/berlin' /tmp/daemmung-parent.html
          grep -q 'gewerk=daemmung' /tmp/daemmung-parent.html
          grep -q 'leistung=fassadendaemmung-wdvs' /tmp/daemmung-parent.html
          ! grep -qi 'noindex' /tmp/daemmung-parent.html

      - name: Verify nine-guide Dämmung hub and internal-link silo
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 45 "$1" -o "$2"
          }

          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html

          guides=(
            daemmung-kosten-pro-qm
            fassadendaemmung-kosten-pro-qm
            kerndaemmung-kosten-pro-qm
            innendaemmung-kosten-pro-qm
            zwischensparrendaemmung-kosten-pro-qm
            aufsparrendaemmung-kosten-pro-qm
            daemmung-oberste-geschossdecke-kosten-pro-qm
            daemmung-kellerdecke-kosten-pro-qm
            sockeldaemmung-kosten
          )

          for source in "${guides[@]}"; do
            guide_url="https://baukostenradar.de/ratgeber/${source}"
            grep -q "${guide_url}</loc>" /tmp/sitemap.xml || { echo "Dämmung cluster guide missing in sitemap: ${source}"; exit 1; }
            grep -q "/ratgeber/${source}" /tmp/ratgeber.html || { echo "Dämmung cluster guide missing from hub: ${source}"; exit 1; }

            fetch "$guide_url" "/tmp/${source}.html"
            grep -q "$guide_url" "/tmp/${source}.html"
            grep -q '"@type":"Article"' "/tmp/${source}.html"
            ! grep -qi 'noindex' "/tmp/${source}.html"

            for target in "${guides[@]}"; do
              [ "$source" = "$target" ] && continue
              grep -q "/ratgeber/${target}" "/tmp/${source}.html" || { echo "${source} missing Dämmung peer ${target}"; exit 1; }
            done
          done

          echo "Verified nine-guide Dämmung hub visibility and full peer-link silo"
