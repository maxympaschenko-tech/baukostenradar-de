name: Verify Kellerdeckendämmung guide

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-kellerdeckendaemmung-guide:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hostinger-verifier

      - name: Verify canonical Kellerdeckendämmung mappings and redirect
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --location "$1" -o "$2"
          }

          guide='daemmung-kellerdecke-kosten-pro-qm'
          duplicate='kellerdeckendaemmung-kosten-pro-qm'
          guide_url="https://baukostenradar.de/ratgeber/${guide}"
          duplicate_url="https://baukostenradar.de/ratgeber/${duplicate}"
          items=(
            kellerdeckendaemmung-inkl-montage
            kellerdeckendaemmung-von-oben-mit-bodenbelag
            kellerdecke-per-einblasdaemmung
            kellerdecke-per-spruehdaemmung
          )

          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/kosten/daemmung' /tmp/daemmung.html
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html
          fetch "$guide_url" /tmp/guide.html

          grep -q "${guide_url}</loc>" /tmp/sitemap.xml
          ! grep -q "https://baukostenradar.de/ratgeber/${duplicate}</loc>" /tmp/sitemap.xml
          grep -q "/ratgeber/${guide}" /tmp/ratgeber.html
          ! grep -q "/ratgeber/${duplicate}" /tmp/ratgeber.html
          grep -q "$guide_url" /tmp/guide.html
          grep -q '"@type":"Article"' /tmp/guide.html
          grep -q '/kosten/daemmung' /tmp/guide.html
          grep -q '/kosten/daemmung/berlin' /tmp/guide.html
          grep -q 'gewerk=daemmung' /tmp/guide.html
          grep -q 'leistung=kellerdeckendaemmung-inkl-montage' /tmp/guide.html
          grep -q '40-100' /tmp/guide.html
          grep -q '15-30' /tmp/guide.html
          grep -q '20-50' /tmp/guide.html
          grep -q '50-150' /tmp/guide.html
          ! grep -qi 'noindex' /tmp/guide.html

          redirect_status=$(curl -sS -o /dev/null -w '%{http_code}' "$duplicate_url")
          case "$redirect_status" in
            301|308) ;;
            *) echo "Duplicate guide did not permanently redirect: HTTP ${redirect_status}"; exit 1 ;;
          esac
          redirect_location=$(curl -sSI "$duplicate_url" | tr -d '\r' | awk 'tolower($1) == "location:" { print $2; exit }')
          case "$redirect_location" in
            '/ratgeber/daemmung-kellerdecke-kosten-pro-qm'|'https://baukostenradar.de/ratgeber/daemmung-kellerdecke-kosten-pro-qm') ;;
            *) echo "Unexpected duplicate redirect location: ${redirect_location}"; exit 1 ;;
          esac

          checked=0
          for item in "${items[@]}"; do
            item_url="https://baukostenradar.de/kosten/daemmung/leistung/${item}"
            output="/tmp/${item}.html"
            grep -q "${item_url}</loc>" /tmp/sitemap.xml
            grep -q "/kosten/daemmung/leistung/${item}" /tmp/daemmung.html
            fetch "$item_url" "$output"
            grep -q 'id="ratgeber"' "$output"
            grep -q "/ratgeber/${guide}" "$output" || { echo "Wrong Kellerdeckendämmung mapping for ${item}"; exit 1; }
            ! grep -qi 'noindex' "$output"
            checked=$((checked + 1))
          done

          test "$checked" -eq 4
          echo "Verified canonical Kellerdeckendämmung guide, redirect and ${checked} price-item mappings"

      - name: Verify six-guide Dämmung peer silo
        shell: bash
        run: |
          set -euo pipefail

          guides=(
            daemmung-kosten-pro-qm
            fassadendaemmung-kosten-pro-qm
            innendaemmung-kosten-pro-qm
            zwischensparrendaemmung-kosten-pro-qm
            aufsparrendaemmung-kosten-pro-qm
            daemmung-kellerdecke-kosten-pro-qm
          )

          for source in "${guides[@]}"; do
            curl -sS --fail --location "https://baukostenradar.de/ratgeber/${source}" -o "/tmp/${source}.html"
            for target in "${guides[@]}"; do
              [ "$source" = "$target" ] && continue
              grep -q "/ratgeber/${target}" "/tmp/${source}.html" || { echo "${source} missing Dämmung peer ${target}"; exit 1; }
            done
          done

          echo "Verified six-guide Dämmung peer silo"
