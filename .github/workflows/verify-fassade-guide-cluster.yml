name: Verify Fassade guide cluster

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-fassade-guide-cluster:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hostinger-verifier
      - name: Verify exact Fassade price-item guide mappings
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 45 "$1" -o "$2"
          }

          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/kosten/fassade' /tmp/fassade.html
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html

          grep -q 'https://baukostenradar.de/kosten/fassade' /tmp/fassade.html
          ! grep -qi 'noindex' /tmp/fassade.html

          mappings=$(cat <<'EOF'
          putz-fassade-neu|putzfassade-kosten-pro-qm
          fassaden-sanierung-bei-rissen|fassadenrisse-sanieren-kosten-pro-qm
          vorgehaengte-hinterlueftete-fassade|vorgehaengte-hinterlueftete-fassade-kosten-pro-qm
          fassade-streichen-inkl-vorarbeiten|fassade-streichen-kosten-pro-qm
          klinker-verblendung|klinkerfassade-kosten-pro-qm
          EOF
          )

          checked=0
          while IFS='|' read -r item guide; do
            item="${item#${item%%[![:space:]]*}}"
            [ -n "$item" ] || continue

            item_url="https://baukostenradar.de/kosten/fassade/leistung/${item}"
            guide_url="https://baukostenradar.de/ratgeber/${guide}"
            item_output="/tmp/fassade-item-${item}.html"
            guide_output="/tmp/fassade-guide-${guide}.html"

            grep -q "${item_url}</loc>" /tmp/sitemap.xml || { echo "Fassade item missing in sitemap: ${item}"; exit 1; }
            grep -q "/kosten/fassade/leistung/${item}" /tmp/fassade.html || { echo "Fassade item missing on category: ${item}"; exit 1; }

            fetch "$item_url" "$item_output"
            grep -q 'Passender Ratgeber' "$item_output"
            grep -q "/ratgeber/${guide}" "$item_output" || { echo "Wrong Fassade guide mapping: ${item} -> ${guide}"; exit 1; }
            ! grep -qi 'noindex' "$item_output"

            grep -q "${guide_url}</loc>" /tmp/sitemap.xml
            grep -q "/ratgeber/${guide}" /tmp/ratgeber.html

            fetch "$guide_url" "$guide_output"
            grep -q "$guide_url" "$guide_output"
            grep -q '"@type":"Article"' "$guide_output"
            grep -q '/kosten/fassade' "$guide_output"
            grep -q '/kosten/fassade/berlin' "$guide_output"
            grep -q 'gewerk=fassade' "$guide_output"
            grep -q "leistung=${item}" "$guide_output"
            ! grep -qi 'noindex' "$guide_output"

            checked=$((checked + 1))
          done <<< "$mappings"

          test "$checked" -eq 5
          echo "Verified ${checked} exact Fassade price-item guide mappings"

      - name: Verify Fassade parent guide and calculator
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 45 "$1" -o "$2"
          }

          guide='fassade-sanieren-kosten'
          guide_url="https://baukostenradar.de/ratgeber/${guide}"

          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html
          fetch "$guide_url" /tmp/fassade-parent.html

          grep -q "${guide_url}</loc>" /tmp/sitemap.xml
          grep -q "/ratgeber/${guide}" /tmp/ratgeber.html
          grep -q "$guide_url" /tmp/fassade-parent.html
          grep -q '"@type":"Article"' /tmp/fassade-parent.html
          grep -q '/kosten/fassade' /tmp/fassade-parent.html
          grep -q '/kosten/fassade/berlin' /tmp/fassade-parent.html
          grep -q 'gewerk=fassade' /tmp/fassade-parent.html
          grep -q 'leistung=putz-fassade-neu' /tmp/fassade-parent.html
          ! grep -qi 'noindex' /tmp/fassade-parent.html

      - name: Verify Fassade guide hub and internal-link silo
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 45 "$1" -o "$2"
          }

          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html

          guides=(
            fassade-sanieren-kosten
            putzfassade-kosten-pro-qm
            fassadenrisse-sanieren-kosten-pro-qm
            vorgehaengte-hinterlueftete-fassade-kosten-pro-qm
            fassade-streichen-kosten-pro-qm
            klinkerfassade-kosten-pro-qm
          )

          for source in "${guides[@]}"; do
            guide_url="https://baukostenradar.de/ratgeber/${source}"
            grep -q "${guide_url}</loc>" /tmp/sitemap.xml || { echo "Fassade cluster guide missing in sitemap: ${source}"; exit 1; }
            grep -q "/ratgeber/${source}" /tmp/ratgeber.html || { echo "Fassade cluster guide missing from hub: ${source}"; exit 1; }

            fetch "$guide_url" "/tmp/${source}.html"
            grep -q "$guide_url" "/tmp/${source}.html"
            grep -q '"@type":"Article"' "/tmp/${source}.html"
            ! grep -qi 'noindex' "/tmp/${source}.html"

            for target in "${guides[@]}"; do
              [ "$source" = "$target" ] && continue
              grep -q "/ratgeber/${target}" "/tmp/${source}.html" || { echo "${source} missing Fassade peer ${target}"; exit 1; }
            done
          done

          echo "Verified Fassade hub visibility and full peer-link silo"
