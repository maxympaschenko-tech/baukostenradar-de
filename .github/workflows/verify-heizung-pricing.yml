name: Verify Heizung pricing expansion

on:
  workflow_run:
    workflows: ["Deploy to Ukraine.com.ua"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-heizung-pricing:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Heizung pages and source catalog
        shell: bash
        run: |
          set -euo pipefail

          fetch_with_retry() {
            local url="$1"
            local output="$2"
            for i in 1 2 3 4 5; do
              if curl -sS --fail --connect-timeout 10 --max-time 25 "$url" -o "$output"; then
                return 0
              fi
              if [[ "$i" == "5" ]]; then
                return 1
              fi
              sleep 4
            done
          }

          fetch_with_retry 'https://baukostenradar.de/kosten/heizung' /tmp/heizung.html
          fetch_with_retry 'https://baukostenradar.de/kosten/heizung/muenchen' /tmp/heizung-muenchen.html
          fetch_with_retry 'https://baukostenradar.de/quellen' /tmp/quellen.html
          fetch_with_retry 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml

      - name: Verify expanded source-backed Heizung data
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import re
          from html.parser import HTMLParser

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []

              def handle_data(self, data):
                  value = data.strip()
                  if value:
                      self.parts.append(value)

          def text(path):
              parser = TextParser()
              with open(path, encoding='utf-8') as handle:
                  parser.feed(handle.read())
              return re.sub(r'\s+', ' ', ' '.join(parser.parts))

          heizung = text('/tmp/heizung.html')
          muenchen = text('/tmp/heizung-muenchen.html')
          quellen = text('/tmp/quellen.html')
          with open('/tmp/sitemap.xml', encoding='utf-8') as handle:
              sitemap = handle.read()

          expected_main = (
              '28 Preispositionen',
              '6 geprüfte Quellen',
              'Standardflachheizkörper austauschen inkl. Montage',
              'Badheizkörper austauschen inkl. Montage',
              'Niedertemperaturheizkörper austauschen inkl. Montage',
              'Fußbodenheizung Nasssystem verlegen',
              'Fußbodenheizung Dünnschichtsystem verlegen',
              'Fußbodenheizung Trockenbausystem verlegen',
              'Fußbodenheizung im Altbau nachrüsten',
              'Heizkreisverteiler für Fußbodenheizung',
              'Hydraulischer Abgleich Einfamilienhaus',
              'Heizungspumpe gegen Hocheffizienzpumpe tauschen',
              'Heizungspumpe plus hydraulischer Abgleich',
              'Schlamm- oder Magnetabscheider inkl. Installation',
              'Blauarbeit - Heizkörper austauschen Kosten 2026',
              'MyHammer - Fußbodenheizung verlegen Kosten 2026',
              'co2online - Hydraulischer Abgleich Kosten 2026',
              'co2online - Heizungspumpe tauschen Kosten',
          )
          for needle in expected_main:
              if needle not in heizung:
                  raise SystemExit(f'Missing Heizung production signal: {needle}')

          expected_city = (
              'Heizung Kosten in München 2026',
              'Standardflachheizkörper austauschen inkl. Montage',
              'Fußbodenheizung Nasssystem verlegen',
              'Fußbodenheizung im Altbau nachrüsten',
              'Hydraulischer Abgleich Einfamilienhaus',
              'Heizungspumpe gegen Hocheffizienzpumpe tauschen',
          )
          for needle in expected_city:
              if needle not in muenchen:
                  raise SystemExit(f'Missing München Heizung production signal: {needle}')

          for needle in (
              'Blauarbeit - Heizkörper austauschen Kosten 2026',
              'MyHammer - Fußbodenheizung verlegen Kosten 2026',
              'co2online - Hydraulischer Abgleich Kosten 2026',
              'co2online - Heizungspumpe tauschen Kosten',
          ):
              if needle not in quellen:
                  raise SystemExit(f'Missing Heizung source in central source catalog: {needle}')

          sitemap_needles = (
              '/kosten/heizung/leistung/standardflachheizkoerper-austauschen-inkl-montage',
              '/kosten/heizung/leistung/fussbodenheizung-nasssystem-verlegen',
              '/kosten/heizung/leistung/fussbodenheizung-im-altbau-nachruesten',
              '/kosten/heizung/leistung/hydraulischer-abgleich-einfamilienhaus',
              '/kosten/heizung/leistung/heizungspumpe-gegen-hocheffizienzpumpe-tauschen',
              '/kosten/heizung/leistung/heizungspumpe-plus-hydraulischer-abgleich',
          )
          for needle in sitemap_needles:
              if needle not in sitemap:
                  raise SystemExit(f'Missing Heizung detail URL in sitemap: {needle}')
          PY
