name: Verify Bodenleger pricing expansion

on:
  workflow_run:
    workflows: ["Deploy to Ukraine.com.ua"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-bodenleger-pricing:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Bodenleger pages and source catalog
        shell: bash
        run: |
          set -euo pipefail

          fetch_with_retry() {
            local url="$1"
            local output="$2"
            for i in 1 2 3 4 5; do
              if curl -sS --fail --connect-timeout 10 --max-time 25 "$url" -o "$output"; then
                return 0
              fi
              if [[ "$i" == "5" ]]; then
                return 1
              fi
              sleep 4
            done
          }

          fetch_with_retry 'https://baukostenradar.de/kosten/bodenleger' /tmp/bodenleger.html
          fetch_with_retry 'https://baukostenradar.de/kosten/bodenleger/muenchen' /tmp/bodenleger-muenchen.html
          fetch_with_retry 'https://baukostenradar.de/quellen' /tmp/quellen.html
          fetch_with_retry 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml

      - name: Verify expanded source-backed Bodenleger data
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import re
          from html.parser import HTMLParser

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []

              def handle_data(self, data):
                  value = data.strip()
                  if value:
                      self.parts.append(value)

          def text(path):
              parser = TextParser()
              with open(path, encoding='utf-8') as handle:
                  parser.feed(handle.read())
              return re.sub(r'\s+', ' ', ' '.join(parser.parts))

          bodenleger = text('/tmp/bodenleger.html')
          muenchen = text('/tmp/bodenleger-muenchen.html')
          quellen = text('/tmp/quellen.html')
          with open('/tmp/sitemap.xml', encoding='utf-8') as handle:
              sitemap = handle.read()

          expected_main = (
              '13 Preispositionen',
              '4 geprüfte Quellen',
              'Bodenleger Stundensatz',
              'Klick-Vinyl verlegen',
              'Klebe-Vinyl verlegen',
              'PVC / Laminat verlegen',
              'Mehrschichtparkett schwimmend verlegen',
              'Mehrschichtparkett vollflächig verklebt',
              'Alten Bodenbelag entfernen & entsorgen',
              'Untergrund vorbereiten & ausgleichen',
              'Aroundhome - Boden verlegen Preise & Kosten',
              'Aroundhome - Vinylboden verlegen Kosten',
          )
          for needle in expected_main:
              if needle not in bodenleger:
                  raise SystemExit(f'Missing Bodenleger production signal: {needle}')

          expected_city = (
              'Boden Kosten in München 2026',
              'Bodenleger Stundensatz',
              'Klick-Vinyl verlegen',
              'Klebe-Vinyl verlegen',
              'PVC / Laminat verlegen',
              'Mehrschichtparkett schwimmend verlegen',
              'Untergrund vorbereiten & ausgleichen',
          )
          for needle in expected_city:
              if needle not in muenchen:
                  raise SystemExit(f'Missing München Bodenleger production signal: {needle}')

          for needle in (
              'Aroundhome - Boden verlegen Preise & Kosten',
              'Aroundhome - Vinylboden verlegen Kosten',
          ):
              if needle not in quellen:
                  raise SystemExit(f'Missing Bodenleger source in central source catalog: {needle}')

          sitemap_needles = (
              '/kosten/bodenleger/leistung/bodenleger-stundensatz',
              '/kosten/bodenleger/leistung/klick-vinyl-verlegen',
              '/kosten/bodenleger/leistung/klebe-vinyl-verlegen',
              '/kosten/bodenleger/leistung/pvc-laminat-verlegen',
              '/kosten/bodenleger/leistung/mehrschichtparkett-schwimmend-verlegen',
              '/kosten/bodenleger/leistung/mehrschichtparkett-vollflaechig-verklebt',
              '/kosten/bodenleger/leistung/alten-bodenbelag-entfernen-entsorgen',
              '/kosten/bodenleger/leistung/untergrund-vorbereiten-ausgleichen',
          )
          for needle in sitemap_needles:
              if needle not in sitemap:
                  raise SystemExit(f'Missing Bodenleger detail URL in sitemap: {needle}')
          PY
