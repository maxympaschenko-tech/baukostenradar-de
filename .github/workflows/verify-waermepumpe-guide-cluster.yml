name: Verify Wärmepumpe guide cluster

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-waermepumpe-guide-cluster:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hostinger-verifier

      - name: Verify exact Wärmepumpe price-item guide mappings
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --location \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 15 --max-time 60 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              -H 'User-Agent: BauKostenRadar-CI/1.0' \
              "$1" -o "$2"
          }

          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/kosten/waermepumpe' /tmp/waermepumpe.html
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html

          grep -q 'https://baukostenradar.de/kosten/waermepumpe' /tmp/waermepumpe.html
          ! grep -qi 'noindex' /tmp/waermepumpe.html

          mappings=$(cat <<'EOF'
          waermepumpe-im-altbau-inkl-einbau-und-anpassungen|waermepumpe-altbau-kosten
          waermepumpe-im-neubau-inkl-einbau|waermepumpe-neubau-kosten
          luft-wasser-waermepumpe-geraet-10-kw|luft-wasser-waermepumpe-kosten
          waermepumpe-installieren-und-hydraulisch-einbinden|waermepumpe-installation-kosten
          altheizung-demontieren-mit-pufferspeicher-und-zubehoer|waermepumpe-installation-kosten
          elektrik-fuer-waermepumpe-mit-zaehlerschrank-und-anschluss|waermepumpe-installation-kosten
          niedertemperatur-heizkoerper-fuer-waermepumpe-nachruesten|waermepumpe-heizkoerper-kosten
          hydraulischer-abgleich-fuer-waermepumpe-im-einfamilienhaus|waermepumpe-installation-kosten
          EOF
          )

          checked=0
          while IFS='|' read -r item guide; do
            item="${item#${item%%[![:space:]]*}}"
            [ -n "$item" ] || continue

            item_url="https://baukostenradar.de/kosten/waermepumpe/leistung/${item}"
            guide_url="https://baukostenradar.de/ratgeber/${guide}"
            item_output="/tmp/waermepumpe-item-${item}.html"
            guide_output="/tmp/waermepumpe-guide-${guide}.html"

            grep -q "${item_url}</loc>" /tmp/sitemap.xml || { echo "Wärmepumpe item missing in sitemap: ${item}"; exit 1; }
            grep -q "/kosten/waermepumpe/leistung/${item}" /tmp/waermepumpe.html || { echo "Wärmepumpe item missing on category: ${item}"; exit 1; }

            fetch "$item_url" "$item_output"
            grep -q 'Passender Ratgeber' "$item_output"
            grep -q "/ratgeber/${guide}" "$item_output" || { echo "Wrong Wärmepumpe guide mapping: ${item} -> ${guide}"; exit 1; }
            ! grep -qi 'noindex' "$item_output"

            grep -q "${guide_url}</loc>" /tmp/sitemap.xml || { echo "Wärmepumpe guide missing in sitemap: ${guide}"; exit 1; }
            grep -q "/ratgeber/${guide}" /tmp/ratgeber.html || { echo "Wärmepumpe guide missing from Ratgeber hub: ${guide}"; exit 1; }

            fetch "$guide_url" "$guide_output"
            grep -q "$guide_url" "$guide_output"
            grep -q '"@type":"Article"' "$guide_output"
            grep -q '/kosten/waermepumpe' "$guide_output"
            ! grep -qi 'noindex' "$guide_output"

            checked=$((checked + 1))
          done <<< "$mappings"

          test "$checked" -eq 8
          echo "Verified ${checked} exact Wärmepumpe price-item guide mappings"

      - name: Verify Wärmepumpe parent and child silo
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl -sS --fail --location \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 15 --max-time 60 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              -H 'User-Agent: BauKostenRadar-CI/1.0' \
              "$1" -o "$2"
          }

          fetch 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml
          fetch 'https://baukostenradar.de/ratgeber' /tmp/ratgeber.html

          guides=(
            waermepumpe-kosten-2026
            waermepumpe-altbau-kosten
            waermepumpe-neubau-kosten
            waermepumpe-installation-kosten
            waermepumpe-heizkoerper-kosten
            luft-wasser-waermepumpe-kosten
            waermepumpe-wartung-kosten
          )

          for guide in "${guides[@]}"; do
            guide_url="https://baukostenradar.de/ratgeber/${guide}"
            output="/tmp/waermepumpe-silo-${guide}.html"

            grep -q "${guide_url}</loc>" /tmp/sitemap.xml || { echo "Wärmepumpe silo guide missing in sitemap: ${guide}"; exit 1; }
            grep -q "/ratgeber/${guide}" /tmp/ratgeber.html || { echo "Wärmepumpe silo guide missing from hub: ${guide}"; exit 1; }

            fetch "$guide_url" "$output"
            grep -q "$guide_url" "$output"
            grep -q '"@type":"Article"' "$output"
            ! grep -qi 'noindex' "$output"
          done

          fetch 'https://baukostenradar.de/ratgeber/waermepumpe-kosten-2026' /tmp/waermepumpe-parent.html
          grep -q '/ratgeber/waermepumpe-altbau-kosten' /tmp/waermepumpe-parent.html
          grep -q '/ratgeber/waermepumpe-neubau-kosten' /tmp/waermepumpe-parent.html
          grep -q '/ratgeber/waermepumpe-installation-kosten' /tmp/waermepumpe-parent.html
          grep -q '/ratgeber/waermepumpe-heizkoerper-kosten' /tmp/waermepumpe-parent.html
          grep -q '/ratgeber/luft-wasser-waermepumpe-kosten' /tmp/waermepumpe-parent.html
          grep -q '/ratgeber/waermepumpe-wartung-kosten' /tmp/waermepumpe-parent.html
          grep -q '30.000-55.000' /tmp/waermepumpe-parent.html
          grep -q '22.000' /tmp/waermepumpe-parent.html

          echo "Verified Wärmepumpe parent plus ${#guides[@]} clustered guide URLs"
