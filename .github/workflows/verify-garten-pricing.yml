name: Verify Garten pricing expansion

on:
  workflow_run:
    workflows: ["Deploy to Ukraine.com.ua"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-garten-pricing:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Garten pages and source catalog
        shell: bash
        run: |
          set -euo pipefail

          fetch_with_retry() {
            local url="$1"
            local output="$2"
            for i in 1 2 3 4 5; do
              if curl -sS --fail --connect-timeout 10 --max-time 25 "$url" -o "$output"; then
                return 0
              fi
              if [[ "$i" == "5" ]]; then
                return 1
              fi
              sleep 4
            done
          }

          fetch_with_retry 'https://baukostenradar.de/kosten/garten' /tmp/garten.html
          fetch_with_retry 'https://baukostenradar.de/kosten/garten/muenchen' /tmp/garten-muenchen.html
          fetch_with_retry 'https://baukostenradar.de/quellen' /tmp/quellen.html
          fetch_with_retry 'https://baukostenradar.de/sitemap.xml' /tmp/sitemap.xml

      - name: Verify expanded source-backed Garten data
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import re
          from html.parser import HTMLParser

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []

              def handle_data(self, data):
                  value = data.strip()
                  if value:
                      self.parts.append(value)

          def text(path):
              parser = TextParser()
              with open(path, encoding='utf-8') as handle:
                  parser.feed(handle.read())
              return re.sub(r'\s+', ' ', ' '.join(parser.parts))

          garten = text('/tmp/garten.html')
          muenchen = text('/tmp/garten-muenchen.html')
          quellen = text('/tmp/quellen.html')
          with open('/tmp/sitemap.xml', encoding='utf-8') as handle:
              sitemap = handle.read()

          expected_main = (
              '17 Preispositionen',
              '4 geprüfte Quellen',
              'Garten- und Landschaftsbauer Stundensatz',
              'Rasen neu anlegen mit Saat',
              'Hecke pflanzen',
              'Betonpflaster inkl. Unterbau verlegen',
              'Klinkerpflaster inkl. Unterbau verlegen',
              'Granitpflaster inkl. Unterbau verlegen',
              'Natursteinpflaster inkl. Unterbau verlegen',
              'Maschendrahtzaun 80 cm inkl. Montage',
              'Sichtschutzzaun Holz 1,80 m inkl. Montage',
              'Gabionenzaun 1,80 m inkl. Montage',
              'HandwerkerMatch - Garten anlegen Kosten 2026',
              'Gartenbau.org - Gartenzaun Kosten 2026',
              'KostenFinder - Pflasterarbeiten Kosten 2026',
          )
          for needle in expected_main:
              if needle not in garten:
                  raise SystemExit(f'Missing Garten production signal: {needle}')

          expected_city = (
              'Garten & Außenanlagen Kosten in München 2026',
              'Rasen neu anlegen mit Saat',
              'Hecke pflanzen',
              'Natursteinpflaster inkl. Unterbau verlegen',
              'Sichtschutzzaun Holz 1,80 m inkl. Montage',
          )
          for needle in expected_city:
              if needle not in muenchen:
                  raise SystemExit(f'Missing München Garten production signal: {needle}')

          for needle in (
              'HandwerkerMatch - Garten anlegen Kosten 2026',
              'Gartenbau.org - Gartenzaun Kosten 2026',
              'KostenFinder - Pflasterarbeiten Kosten 2026',
          ):
              if needle not in quellen:
                  raise SystemExit(f'Missing Garten source in central source catalog: {needle}')

          sitemap_needles = (
              '/kosten/garten/leistung/garten-und-landschaftsbauer-stundensatz',
              '/kosten/garten/leistung/rasen-neu-anlegen-mit-saat',
              '/kosten/garten/leistung/hecke-pflanzen',
              '/kosten/garten/leistung/betonpflaster-inkl-unterbau-verlegen',
              '/kosten/garten/leistung/klinkerpflaster-inkl-unterbau-verlegen',
              '/kosten/garten/leistung/granitpflaster-inkl-unterbau-verlegen',
              '/kosten/garten/leistung/natursteinpflaster-inkl-unterbau-verlegen',
              '/kosten/garten/leistung/maschendrahtzaun-80-cm-inkl-montage',
              '/kosten/garten/leistung/sichtschutzzaun-holz-1-80-m-inkl-montage',
              '/kosten/garten/leistung/gabionenzaun-1-80-m-inkl-montage',
          )
          for needle in sitemap_needles:
              if needle not in sitemap:
                  raise SystemExit(f'Missing Garten detail URL in sitemap: {needle}')
          PY
