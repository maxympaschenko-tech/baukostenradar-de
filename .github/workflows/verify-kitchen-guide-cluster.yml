name: Verify kitchen guide cluster

on:
  workflow_run:
    workflows: ["Hostinger production ready"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-kitchen-guide-cluster:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hostinger-verifier

      - name: Verify 13 kitchen price-item guide mappings
        shell: bash
        run: |
          set -euo pipefail

          curl -sS --fail 'https://baukostenradar.de/sitemap.xml' -o /tmp/sitemap.xml
          curl -sS --fail 'https://baukostenradar.de/kosten/kueche' -o /tmp/kueche.html
          curl -sS --fail 'https://baukostenradar.de/ratgeber' -o /tmp/ratgeber.html

          grep -q 'https://baukostenradar.de/kosten/kueche' /tmp/kueche.html
          ! grep -qi 'noindex' /tmp/kueche.html

          mappings=$(cat <<'EOF'
          kuechen-renovierung-ohne-moebel|kueche-10-qm-renovieren-kosten|kuechen-renovierung-ohne-moebel
          kuechenfronten-austauschen-oder-lackieren|kuechenfronten-erneuern-kosten|kuechenfronten-austauschen-oder-lackieren
          neue-arbeitsplatte|kuechenarbeitsplatte-kosten|neue-arbeitsplatte
          neue-elektrogeraete|kueche-elektrogeraete-kosten|neue-elektrogeraete
          fliesenspiegel-erneuern|fliesenspiegel-erneuern-kosten|fliesenspiegel-erneuern
          komplett-neue-einbaukueche|einbaukueche-kosten|komplett-neue-einbaukueche
          premium-kueche-mit-umbau|premium-kueche-umbau-kosten|premium-kueche-mit-umbau
          arbeitsplatte-gerade-bis-3-m-montieren|kuechenarbeitsplatte-kosten|neue-arbeitsplatte
          arbeitsplatte-l-kueche-mit-eckverbindung-montieren|kuechenarbeitsplatte-kosten|neue-arbeitsplatte
          ausschnitt-fuer-spuele-oder-kochfeld|kuechenarbeitsplatte-kosten|neue-arbeitsplatte
          alte-arbeitsplatte-demontieren-und-entsorgen|kuechenarbeitsplatte-kosten|neue-arbeitsplatte
          naturstein-oder-quarzkomposit-arbeitsplatte-inkl-montage|kuechenarbeitsplatte-kosten|neue-arbeitsplatte
          einstiegs-kuechenzeile-mit-geraeten-ohne-montage|einbaukueche-kosten|komplett-neue-einbaukueche
          EOF
          )

          checked=0
          while IFS='|' read -r item guide calculator_item; do
            item="${item#${item%%[![:space:]]*}}"
            [ -n "$item" ] || continue

            echo "Checking Küche ${item} -> ${guide} (calculator ${calculator_item})"
            item_url="https://baukostenradar.de/kosten/kueche/leistung/${item}"
            guide_url="https://baukostenradar.de/ratgeber/${guide}"
            item_output="/tmp/kueche-item-${item}.html"
            guide_output="/tmp/kueche-guide-${guide}.html"

            grep -q "${item_url}</loc>" /tmp/sitemap.xml || { echo "Kitchen item missing in sitemap: ${item}"; exit 1; }
            grep -q "/kosten/kueche/leistung/${item}" /tmp/kueche.html || { echo "Kitchen item missing on category: ${item}"; exit 1; }

            curl -sS --fail "$item_url" -o "$item_output"
            grep -q 'Passender Ratgeber' "$item_output" || { echo "Ratgeber block missing: ${item}"; exit 1; }
            grep -q "/ratgeber/${guide}" "$item_output" || { echo "Wrong guide mapping: ${item} -> ${guide}"; exit 1; }
            ! grep -qi 'noindex' "$item_output"

            grep -q "${guide_url}</loc>" /tmp/sitemap.xml || { echo "Kitchen guide missing in sitemap: ${guide}"; exit 1; }
            grep -q "/ratgeber/${guide}" /tmp/ratgeber.html || { echo "Kitchen guide missing from hub: ${guide}"; exit 1; }

            curl -sS --fail "$guide_url" -o "$guide_output"
            grep -q "$guide_url" "$guide_output" || { echo "Canonical missing: ${guide}"; exit 1; }
            grep -q '"@type":"Article"' "$guide_output" || { echo "Article schema missing: ${guide}"; exit 1; }
            grep -q '/kosten/kueche' "$guide_output" || { echo "Kitchen service link missing: ${guide}"; exit 1; }
            grep -q '/kosten/kueche/berlin' "$guide_output" || { echo "Kitchen Berlin link missing: ${guide}"; exit 1; }
            grep -q 'gewerk=kueche' "$guide_output" || { echo "Kitchen calculator missing: ${guide}"; exit 1; }
            grep -q "leistung=${calculator_item}" "$guide_output" || { echo "Primary calculator item missing: ${guide} expected ${calculator_item}"; exit 1; }
            ! grep -qi 'noindex' "$guide_output"

            checked=$((checked + 1))
          done <<< "$mappings"

          test "$checked" -eq 13
          echo "Verified ${checked} kitchen price-item guide mappings"

      - name: Verify kitchen internal-link silo
        shell: bash
        run: |
          set -euo pipefail

          guides=(
            kueche-10-qm-renovieren-kosten
            kuechenfronten-erneuern-kosten
            kuechenarbeitsplatte-kosten
            fliesenspiegel-erneuern-kosten
            kueche-elektrogeraete-kosten
            einbaukueche-kosten
            premium-kueche-umbau-kosten
          )

          for source in "${guides[@]}"; do
            curl -sS --fail "https://baukostenradar.de/ratgeber/${source}" -o "/tmp/${source}.html"
            grep -q '"@type":"Article"' "/tmp/${source}.html"
            ! grep -qi 'noindex' "/tmp/${source}.html"

            for target in "${guides[@]}"; do
              [ "$source" = "$target" ] && continue
              grep -q "/ratgeber/${target}" "/tmp/${source}.html" || { echo "${source} missing kitchen peer ${target}"; exit 1; }
            done
          done

          test "${#guides[@]}" -eq 7
          echo "Verified ${#guides[@]} kitchen guides and full peer-link silo"
