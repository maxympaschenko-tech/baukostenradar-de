name: One-time Hostinger workflow trigger migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'ci/finish-hostinger-workflow-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Migrate legacy workflow_run triggers
        shell: bash
        run: |
          set -euo pipefail

          old='Deploy to Ukraine.com.ua'
          new='Hostinger production ready'
          guard='.github/workflows/verify-hosting-workflow-migration.yml'
          self='.github/workflows/migrate-hosting-triggers.yml'

          mapfile -t stale_files < <(
            grep -RIl --include='*.yml' --include='*.yaml' "$old" .github/workflows \
              | grep -Fvx "$guard" \
              | grep -Fvx "$self" \
              | sort || true
          )

          if (( ${#stale_files[@]} == 0 )); then
            echo 'No legacy verifier triggers found.'
          else
            echo "Migrating ${#stale_files[@]} workflow files:"
            printf ' - %s\n' "${stale_files[@]}"
            for file in "${stale_files[@]}"; do
              python - "$file" "$old" "$new" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          old = sys.argv[2]
          new = sys.argv[3]
          text = path.read_text()
          if old not in text:
              raise SystemExit(f'Expected legacy trigger not found in {path}')
          path.write_text(text.replace(old, new))
          PY
            done
          fi

          if grep -RIl --include='*.yml' --include='*.yaml' "$old" .github/workflows \
            | grep -Fvx "$guard" \
            | grep -Fvx "$self" \
            | grep -q .; then
            echo 'Legacy workflow references remain after migration.' >&2
            exit 1
          fi

          git rm "$self"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows

          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi

          git commit -m 'Migrate remaining production verifiers to Hostinger gate'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
