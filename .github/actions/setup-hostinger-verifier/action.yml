name: Setup Hostinger verifier transport
description: Add one-time jitter and a resilient curl wrapper for legacy production verifier steps.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        marker="${RUNNER_TEMP:-/tmp}/baukostenradar-hostinger-jitter-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
        if [[ ! -e "$marker" ]]; then
          delay=$((RANDOM % 181))
          echo "Hostinger verifier startup jitter: ${delay}s"
          sleep "$delay"
          : > "$marker"
        fi

        wrapper_dir="${RUNNER_TEMP:-/tmp}/baukostenradar-hostinger-curl"
        mkdir -p "$wrapper_dir"
        cat > "$wrapper_dir/curl" <<'BASH'
        #!/usr/bin/env bash
        set -euo pipefail

        args=()
        for arg in "$@"; do
          if [[ "$arg" == https://baukostenradar.de/* && "$arg" != *'ci_verify='* ]]; then
            separator='?'
            [[ "$arg" == *'?'* ]] && separator='&'
            arg="${arg}${separator}ci_verify=${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}-${RANDOM}"
          fi
          args+=("$arg")
        done

        exec /usr/bin/curl -q \
          --retry 5 --retry-delay 7 --retry-all-errors \
          --connect-timeout 15 --max-time 45 \
          -H 'Cache-Control: no-cache, no-store, max-age=0' \
          -H 'Pragma: no-cache' \
          -H 'User-Agent: BauKostenRadar-Production-Verify/1.0' \
          "${args[@]}"
        BASH
        chmod +x "$wrapper_dir/curl"
        echo "$wrapper_dir" >> "$GITHUB_PATH"
